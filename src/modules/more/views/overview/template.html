<div class="module-container">
    <!-- Welcome Banner -->
    <div class="wb-container"
        style="--wb-gradient-1: rgba(238, 242, 255, 0.95); --wb-gradient-2: rgba(224, 231, 255, 0.90); --wb-orb-1-color: rgba(129, 140, 248, 0.15); --wb-orb-2-color: rgba(165, 180, 252, 0.12); --wb-orb-3-color: rgba(99, 102, 241, 0.08); --wb-particle-color: rgba(99, 102, 241, 0.6);">
        <div class="wb-orb wb-orb-1"></div>
        <div class="wb-orb wb-orb-2"></div>
        <div class="wb-orb wb-orb-3"></div>
        <div class="wb-grid-pattern"></div>

        <!-- 浮动粒子 -->
        <div class="wb-particle wb-particle-1"></div>
        <div class="wb-particle wb-particle-2"></div>
        <div class="wb-particle wb-particle-3"></div>
        <div class="wb-particle wb-particle-4"></div>
        <div class="wb-particle wb-particle-5"></div>
        <div class="wb-particle wb-particle-6"></div>
        <div class="wb-particle wb-particle-7"></div>
        <div class="wb-particle wb-particle-8"></div>

        <div class="wb-content">
            <div class="wb-icon">
                <i class="fas fa-compass"></i>
            </div>
            <div class="wb-title-row">
                <h1 class="wb-title">更多功能</h1>
                <span aria-label="中心功能" class="wb-badge wb-badge-hub">
                    <i class="fa-solid fa-compass"></i>MORE
                </span>
            </div>
            <p class="wb-description">探索更多实用功能和工具，提升工作效率，发现无限可能。</p>
            <div class="wb-tags">
                <div class="wb-tag">
                    <div class="wb-tag-dot" style="background-color: var(--wb-tag-dot-2, #6178D3);"></div>
                    <span>大模型探索</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 分类筛选器 -->
    <div class="mb-6 flex items-center gap-3 overflow-x-auto pb-2">
        <button
            class="category-filter-btn active px-4 py-2 bg-green-500 text-white rounded-lg text-sm font-medium transition-all whitespace-nowrap hover:bg-green-600"
            data-category="all">
            <i class="fas fa-th mr-2"></i>全部
        </button>
        <button
            class="category-filter-btn px-4 py-2 bg-white text-slate-700 border border-slate-300 rounded-lg text-sm font-medium transition-all whitespace-nowrap hover:bg-slate-50"
            data-category="explore">
            <i class="fas fa-compass mr-2"></i>探索
        </button>
    </div>

    <!-- Module: 探索体系 (The Explore Layer) -->
    <section class="mb-10" data-category="explore" id="more-module-explore">
        <div class="more-module-section">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center text-green-600">
                    <i class="fas fa-compass"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-800">探索</h2>
                    <p class="text-sm text-slate-500">The Explore Layer · 智能体、提示词、工作流等实用功能</p>
                </div>
            </div>
            <div class="sop-card-grid">
                <!-- 智能体 -->
                <div class="sop-card border-l-4 border-l-green-400" data-action="switch-tab" data-tab="more_agents">
                    <div class="flex items-start justify-between mb-3">
                        <div class="sop-icon-container bg-green-50 text-green-600">
                            <i class="fas fa-robot"></i>
                        </div>
                        <span class="sop-status-badge sop-status-pending">建设中</span>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800 mb-2">智能体</h3>
                    <p class="text-sm text-slate-500 mb-3">探索和使用各种智能体，提升工作效率和自动化水平</p>
                    <div class="text-xs text-slate-400">
                        <i class="fas fa-robot mr-1"></i>AI 驱动的智能助手
                    </div>
                </div>

                <!-- 提示词 -->
                <div class="sop-card border-l-4 border-l-green-400" data-action="switch-tab" data-tab="more_prompts">
                    <div class="flex items-start justify-between mb-3">
                        <div class="sop-icon-container bg-green-50 text-green-600">
                            <i class="fas fa-message"></i>
                        </div>
                        <span class="sop-status-badge sop-status-pending">建设中</span>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800 mb-2">提示词</h3>
                    <p class="text-sm text-slate-500 mb-3">管理和使用各种提示词模板，优化AI交互体验</p>
                    <div class="text-xs text-slate-400">
                        <i class="fas fa-message mr-1"></i>提示词模板库
                    </div>
                </div>

                <!-- 工作流 -->
                <div class="sop-card border-l-4 border-l-green-400" data-action="switch-tab" data-tab="more_workflows">
                    <div class="flex items-start justify-between mb-3">
                        <div class="sop-icon-container bg-green-50 text-green-600">
                            <i class="fas fa-diagram-project"></i>
                        </div>
                        <span class="sop-status-badge sop-status-pending">建设中</span>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800 mb-2">工作流</h3>
                    <p class="text-sm text-slate-500 mb-3">创建和管理自动化工作流，简化复杂业务流程</p>
                    <div class="text-xs text-slate-400">
                        <i class="fas fa-diagram-project mr-1"></i>自动化流程管理
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Quick Stats -->
    <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-white rounded-xl p-4 border border-slate-200 text-center">
            <div class="text-2xl font-bold text-green-500">3</div>
            <div class="text-xs text-slate-500 mt-1">探索功能</div>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-200 text-center">
            <div class="" -bold text-slate-400">0</div>
            <div class="text-xs text-slate-500 mt-1">已启用功能</div>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-200 text-center">
            <div class="text-2xl font-bold text-slate-400">持续更新</div>
            <div class="text-xs text-slate-500 mt-1">敬请期待</div>
        </div>
    </div>
</div>
