<!--JSON导入提醒模态框-->
<app-modal id="import-conflict-modal" size="lg" no-header>
    <div slot="body">
        <div class="bg-amber-50 px-6 py-4 border-b border-amber-100 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center text-amber-600">
                <i class="fas fa-exclamation-triangle text-lg"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-slate-800">数据冲突确认</h3>
                <p class="text-xs text-slate-500">检测到 <span id="conflict-count"
                        class="font-bold text-amber-600 text-sm">0</span> 个已存在的 ASIN</p>
            </div>
        </div>

        <div class="p-6 space-y-4">
            <p class="text-sm text-slate-600 leading-relaxed">
                导入文件中包含部分已在当前列表中的商品。请选择如何处理这些重复项：
            </p>

            <div class="grid grid-cols-1 gap-3">
                <button id="btn-resolve-merge"
                    class="group flex items-center justify-between p-4 rounded-xl border-2 border-blue-100 hover:border-blue-500 hover:bg-blue-50 transition-all text-left w-full">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors">
                            <i class="fas fa-code-branch rotate-90"></i>
                        </div>
                        <div>
                            <div class="font-bold text-slate-700 group-hover:text-blue-700">智能合并 (推荐)</div>
                            <div class="text-xs text-slate-500">保留旧数据，合并新评论，自动去重</div>
                        </div>
                    </div>
                    <i class="fas fa-check text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                </button>

                <button id="btn-resolve-overwrite"
                    class="group flex items-center justify-between p-4 rounded-xl border border-slate-200 hover:border-red-400 hover:bg-red-50 transition-all text-left w-full">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-red-100 group-hover:text-red-500 transition-colors">
                            <i class="fas fa-sync-alt"></i>
                        </div>
                        <div>
                            <div class="font-bold text-slate-700 group-hover:text-red-700">覆盖旧版</div>
                            <div class="text-xs text-slate-500">完全使用新导入的数据替换</div>
                        </div>
                    </div>
                </button>
            </div>
        </div>

        <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
            <button id="btn-resolve-skip"
                class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-colors">
                跳过重复项
            </button>
        </div>
    </div>
</app-modal>

<!--dataDisplay删除确认模态框-->
<app-modal id="delete-confirm-modal" title="确认删除" size="sm">
    <div slot="body" class="p-6 space-y-4">
        <p id="del-modal-desc" class="text-sm text-slate-600 leading-relaxed">
            确认要删除吗？
        </p>

        <div class="flex items-center pt-2">
            <label class="flex items-center gap-2 cursor-pointer group">
                <input type="checkbox" id="del-dont-ask"
                    class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 transition-colors">
                <span class="text-xs text-slate-500 group-hover:text-slate-700 select-none">不再提醒</span>
            </label>
        </div>
    </div>

    <div slot="footer" class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
        <button id="btn-del-cancel"
            class="px-4 py-2 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 hover:text-slate-800 text-sm font-medium rounded-lg transition-colors shadow-sm">
            取消
        </button>
        <button id="btn-del-confirm"
            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-lg shadow-md transition-all active:scale-95">
            确定
        </button>
    </div>
</app-modal>
