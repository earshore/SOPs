<div id="panel-home" class="panel w-full h-full absolute top-0 left-0 overflow-hidden hidden z-10">
  <div id="home-splash-container">
    <div class="clean-bg"></div>

    <canvas id="particles-canvas"></canvas>

    <header class="top-bar">
      <div class="time-display" id="time-display"></div>
      <div class="logo-section">
        <div class="logo-text">AMAZON WORKFLOW</div>
        <div class="logo-sub">Standard Operating Procedure</div>
      </div>
    </header>

    <main class="splash-content-wrapper">
      <div class="hero-container" id="hero-content">
        <h1 class="slogan-main">
          <div class="slogan-line highlight" data-text="规范流程">规范流程</div>
          <div class="slogan-line outline" data-text="无限可能">无限可能</div>
        </h1>

        <p class="slogan-sub">
          把<span>混乱</span>变成<span>秩序</span>， 把<span>经验</span>变成<span>指令</span>。
        </p>

        <section class="workbench-launchpad" aria-labelledby="workbench-launchpad-title">
          <div class="workbench-launchpad__header">
            <div>
              <div class="workbench-launchpad__eyebrow">
                <span class="workbench-launchpad__signal" aria-hidden="true"></span>
                从这里开始今日运营
              </div>
              <h2 id="workbench-launchpad-title">亚马逊运营工作台</h2>
              <p>统一进入日常作业、工具总览与流程规范。</p>
            </div>
            <span class="workbench-launchpad__badge">
              <i class="fas fa-star" aria-hidden="true"></i>
              推荐入口
            </span>
          </div>

          <div class="workbench-launchpad__action-area">
            <button
              type="button"
              class="workbench-launchpad__primary-action"
              data-action="switch-tab"
              data-tab="app_center_overview"
            >
              <span class="workbench-launchpad__primary-icon" aria-hidden="true">
                <i class="fas fa-layer-group"></i>
              </span>
              <span class="workbench-launchpad__primary-content">
                <span class="workbench-launchpad__primary-meta">一站式运营中枢</span>
                <span class="workbench-launchpad__primary-title">查看最近作业</span>
                <span class="workbench-launchpad__primary-description"
                  >查看工具总览，从当前任务继续开始</span
                >
              </span>
              <i
                class="fas fa-arrow-right workbench-launchpad__primary-arrow"
                aria-hidden="true"
              ></i>
            </button>
            <button
              type="button"
              class="workbench-launchpad__sop-link"
              data-action="switch-tab"
              data-tab="sops_overview"
            >
              <i class="fas fa-diagram-project" aria-hidden="true"></i>
              <span><strong>需要规范作业？</strong>进入 SOPs 流程中心</span>
              <i class="fas fa-arrow-right" aria-hidden="true"></i>
            </button>
          </div>

          <div class="workbench-launchpad__tools" aria-label="运营工具快捷入口">
            <div class="workbench-launchpad__tools-heading">
              <span>直接开始一项任务</span>
            </div>
            <button
              type="button"
              class="workbench-tool"
              data-action="switch-tab"
              data-tab="scraper"
            >
              <i class="fas fa-cubes-stacked" aria-hidden="true"></i>
              <span class="workbench-tool__content">
                <span class="workbench-tool__meta">01 · 数据洞察</span>
                <span class="workbench-tool__title">Master Analysis</span>
                <span class="workbench-tool__description">采集并分析竞品 ASIN</span>
              </span>
              <i
                class="fas fa-arrow-up-right-from-square workbench-tool__arrow"
                aria-hidden="true"
              ></i>
            </button>
            <button
              type="button"
              class="workbench-tool"
              data-action="switch-tab"
              data-tab="playground_deep_chat"
            >
              <i class="fas fa-paper-plane" aria-hidden="true"></i>
              <span class="workbench-tool__content">
                <span class="workbench-tool__meta">02 · 内容生成</span>
                <span class="workbench-tool__title">Playground</span>
                <span class="workbench-tool__description">验证 Prompt，生成产品文案</span>
              </span>
              <i
                class="fas fa-arrow-up-right-from-square workbench-tool__arrow"
                aria-hidden="true"
              ></i>
            </button>
            <button
              type="button"
              class="workbench-tool"
              data-action="switch-tab"
              data-tab="keyword_hunter_input"
            >
              <i class="fas fa-search" aria-hidden="true"></i>
              <span class="workbench-tool__content">
                <span class="workbench-tool__meta">03 · SEO 复核</span>
                <span class="workbench-tool__title">Keyword Hunter</span>
                <span class="workbench-tool__description">梳理关键词覆盖与 Listing</span>
              </span>
              <i
                class="fas fa-arrow-up-right-from-square workbench-tool__arrow"
                aria-hidden="true"
              ></i>
            </button>
          </div>
        </section>

        <div class="ai-status">
          <div class="status-dot-inner"></div>
          <span class="status-text">AI SYSTEM ONLINE · READY TO TRANSFORM</span>
        </div>
      </div>
    </main>

    <aside class="floating-workbench" aria-label="运营工作台快捷入口">
      <button
        type="button"
        class="floating-workbench__trigger"
        aria-expanded="false"
        aria-controls="home-floating-workbench-actions"
        aria-label="展开运营工作台快捷入口"
        title="运营工作台"
      >
        <i class="fas fa-cubes" aria-hidden="true"></i>
        <span class="sr-only">运营工作台</span>
      </button>
      <div
        id="home-floating-workbench-actions"
        class="floating-workbench__actions"
        aria-label="运营工作台应用快捷入口"
        aria-hidden="true"
        inert
      >
        <button
          type="button"
          class="floating-workbench__item"
          data-action="switch-tab"
          data-tab="scraper"
          aria-label="打开 Master Analysis"
          title="Master Analysis"
        >
          <i class="fas fa-cubes-stacked" aria-hidden="true"></i>
          <span class="sr-only">Master Analysis</span>
        </button>
        <button
          type="button"
          class="floating-workbench__item"
          data-action="switch-tab"
          data-tab="playground_deep_chat"
          aria-label="打开 Playground"
          title="Playground"
        >
          <i class="fas fa-paper-plane" aria-hidden="true"></i>
          <span class="sr-only">Playground</span>
        </button>
        <button
          type="button"
          class="floating-workbench__item"
          data-action="switch-tab"
          data-tab="keyword_hunter_input"
          aria-label="打开 Keyword Hunter"
          title="Keyword Hunter"
        >
          <i class="fas fa-search" aria-hidden="true"></i>
          <span class="sr-only">Keyword Hunter</span>
        </button>
        <button
          type="button"
          class="floating-workbench__item"
          data-action="switch-tab"
          data-tab="ppc_search_terms"
          aria-label="打开 PPC Tools"
          title="PPC Tools"
        >
          <i class="fas fa-bullhorn" aria-hidden="true"></i>
          <span class="sr-only">PPC Tools</span>
        </button>
      </div>
    </aside>

    <footer class="brand-footer">
      <div class="brand-line"></div>
      <span class="brand-text"
        >AI DRIVEN | HUMAN CENTERED | PROCESS AS CODE | DECISION AT SPEED</span
      >
      <div class="brand-line"></div>
    </footer>

    <svg class="geometric-decor" viewBox="0 0 800 800" aria-hidden="true">
      <defs>
        <linearGradient id="decorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2563eb" stop-opacity="0.2" />
          <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
        </linearGradient>
      </defs>
      <circle
        cx="400"
        cy="400"
        r="300"
        stroke="url(#decorGrad)"
        stroke-width="1"
        fill="none"
        class="pulse-ring"
      />
      <circle
        cx="400"
        cy="400"
        r="250"
        stroke="url(#decorGrad)"
        stroke-width="1"
        fill="none"
        class="pulse-ring delay-1"
      />
    </svg>
  </div>
</div>
