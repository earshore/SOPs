<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Menu Debug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; }
        .debug-border { border: 2px solid red !important; }
        .debug-bg { background: rgba(255, 0, 0, 0.1) !important; }
    </style>
</head>
<body class="bg-slate-50">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200/80 z-[100] relative">
        <div class="px-6 h-16 flex items-center justify-between">
            <div class="text-lg font-bold">Logo</div>
            
            <!-- Navigation -->
            <nav class="flex items-center h-full">
                <div class="group h-full static">
                    <button class="px-5 h-full text-sm font-semibold text-slate-500 group-hover:text-blue-600">
                        SOPs 流程中心
                        <i class="fas fa-chevron-down text-[10px]"></i>
                    </button>

                    <!-- Mega Menu Panel -->
                    <div class="mega-menu-panel fixed top-16 left-0 right-0 bg-white/98 backdrop-blur-xl border-b border-slate-200/80 shadow-xl
                                opacity-0 invisible
                                group-hover:opacity-100 group-hover:visible
                                z-[60] debug-border">
                        <div class="max-w-screen-xl mx-auto px-8 py-8 debug-bg">
                            <h3 class="text-sm font-bold text-slate-400 mb-4">核心 SOP 体系</h3>
                            <div class="grid grid-cols-5 gap-4">
                                <div class="bg-blue-100 h-24 rounded-xl flex items-center justify-center">Card 1</div>
                                <div class="bg-green-100 h-24 rounded-xl flex items-center justify-center">Card 2</div>
                                <div class="bg-purple-100 h-24 rounded-xl flex items-center justify-center">Card 3</div>
                                <div class="bg-orange-100 h-24 rounded-xl flex items-center justify-center">Card 4</div>
                                <div class="bg-pink-100 h-24 rounded-xl flex items-center justify-center">Card 5</div>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="p-8">
        <h1 class="text-2xl font-bold mb-4">Mega Menu 调试页面</h1>
        <p class="text-slate-600">鼠标悬停在"SOPs 流程中心"上查看mega menu</p>
        <ul class="mt-4 space-y-2 text-sm">
            <li>✅ 红色边框 = mega menu面板边界</li>
            <li>✅ 红色半透明背景 = max-w-screen-xl容器边界</li>
            <li>✅ 5个彩色卡片应该横向排列</li>
        </ul>
    </main>

</body>
</html>
