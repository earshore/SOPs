<!-- Promptlab 子模块模板 -->
<div class="app-center-container">
  <div class="mb-6">
    <div
      class="bg-gradient-to-br from-slate-50 via-purple-50/30 to-pink-50/30 rounded-2xl border border-slate-200/60 p-8 relative overflow-hidden">
      <!-- 装饰元素 -->
      <div
        class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-purple-100/30 to-pink-100/40 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2">
      </div>
      <div
        class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-indigo-100/30 to-purple-100/30 rounded-full blur-2xl translate-y-1/3 -translate-x-1/3">
      </div>

      <div class="relative z-10 flex items-start gap-6">
        <div
          class="app-center-icon-container bg-gradient-to-br from-purple-600 to-indigo-600 shadow-lg shadow-purple-500/20">
          <i class="fas fa-wand-magic-sparkles text-white"></i>
        </div>
        <div class="flex-1">
          <h2 class="text-xl font-bold text-slate-800 mb-2">Listing 炼金术工场</h2>
          <p class="text-slate-600 text-sm leading-relaxed max-w-2xl">
            融合竞品洞察、产品 DNA与SEO关键词,以及A10、COSMO与Rufus Ai逻辑,打造高转化率的 Master Prompt
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 relative pb-10">
    <div class="lg:col-span-8 space-y-6">

      <div id="card-product-dna"
        class="app-center-card">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-slate-800 flex items-center gap-2">
          <span
            class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs">1</span>
          产品 DNA 定义 (Product DNA)
        </h3>
        <select id="lab-target-market"
          class="text-xs border-slate-300 rounded-lg focus:ring-indigo-500 border p-1.5 w-48 bg-slate-50 text-slate-700 font-medium">
          <option value="" disabled selected>选择目标站点/语言...</option>
        </select>
      </div>

      <div class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">
              <!-- <span class="text-red-500 mr-1">*</span> -->
              <i class="fa-solid fa-asterisk text-red-500 mr-1"></i>Tier 1 核心大词 (Core Keywords) - 1-2个
            </label>
            <input type="text" id="lab-keywords-tier1" placeholder="humidifiers for bedroom, cool mist humidifier"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">
              <i class="fa-solid fa-ban"></i> 限制词 (Negative) - 不希望出现的词汇
            </label>
            <input type="text" id="negative-keywords" placeholder="例如: bestseller/cure"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border" />
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">
              <!-- <span class="text-red-500 mr-1">*</span> -->
              <i class="fa-solid fa-asterisk text-red-500 mr-1"></i>Tier 2 长尾词 (Long tail Keywords) - 2-5个
            </label>
            <textarea type="text" id="lab-keywords-tier2" rows="1"
              placeholder="baby humidifier, easy to clean, quiet operation"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border"></textarea>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">
              <i class="fa-solid fa-users"></i> 目标受众 (Target Audience) - 客户特征
            </label>
            <input type="text" id="lab-audience" placeholder="e.g. Busy moms, Tech enthusiasts"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 p-2 border" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">
              <i class="fa-solid fa-list-check"></i> 核心卖点 (USPs) - 可补充，报告已拆解竞品卖点
            </label>
            <textarea id="lab-usps" rows="2" placeholder="- 专利静音技术 (<28dB)&#10;- 360度旋转喷嘴"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border"></textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">
              <i class="fa-solid fa-circle-info"></i> 详细参数 (Specs) - 产品特征
            </label>
            <textarea id="lab-specs" rows="2" placeholder="材质: ABS + PP&#10;尺寸: 20x20x30cm"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border"></textarea>
          </div>

        </div>
        <div>
          <label class="block text-xs font-medium text-purple-600 mb-1">
            <i class="fab fa-instagram mr-1"></i> 植入社媒"Hook"/节日词 (Social Hooks) - 可补充
          </label>
          <input type="text" id="lab-social-hook" placeholder="例如: 🔥限时半价 / 🎄圣诞特供 / #SummerVibes"
            class="w-full text-sm border-purple-200 rounded-lg focus:ring-purple-500 border p-2 bg-purple-50/20 text-purple-700" />
        </div>

      </div>
    </div>

      <div id="card-analysis"
        class="app-center-card">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-slate-800 flex items-center gap-2">
          <span
            class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs">2</span>
          Ai分析报告
        </h3>
        <div id="lab-analysis-status"
          class="px-2 py-1 bg-slate-100 text-slate-500 rounded text-xs flex items-center gap-1">
          <i class="fas fa-exclamation-circle"></i> 检测中...
        </div>
      </div>

      <div class="bg-slate-50 rounded-lg p-4 border border-slate-100">
        <div class="flex items-center justify-between mb-2 pb-2 border-b border-slate-200">
          <div class="flex items-center gap-2">
            <input type="checkbox" id="use-analysis-data" class="rounded text-blue-600 focus:ring-blue-500" />
            <label for="use-analysis-data"
              class="text-sm font-medium text-slate-700 cursor-pointer">启用竞品分析数据注入</label>
          </div>
        </div>
        <div id="report-sections-container"
          class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-60 overflow-y-auto custom-scrollbar">
          <p class="text-xs text-slate-400 italic">暂无报告数据...</p>
        </div>
      </div>
    </div>

      <div id="card-strategy"
        class="app-center-card mb-10">
      <h3 class="font-semibold text-slate-800 flex items-center gap-2 mb-4">
        <span
          class="w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-xs">3</span>
        生成策略配置
      </h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">文案语气 Tone</label>
          <select id="lab-tone" class="w-full text-sm border-slate-300 rounded-lg focus:ring-orange-500 p-2 border">
            <option value="professional">Professional (专业)</option>
            <option value="exciting">Exciting (激动人心)</option>
            <option value="emotional">Emotional (情感共鸣)</option>
            <option value="minimalist">Minimalist (极简)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">自定义生成规则 (Custom Rules) - 有就填</label>
          <textarea id="lab-custom-strategy" rows="1" placeholder="例如: 禁止使用'Best Seller'词汇..."
            class="w-full text-sm border-slate-300 rounded-lg focus:ring-orange-500 border p-2"></textarea>
        </div>
      </div>

      <div class="mt-4 pt-4 border-t border-slate-100 flex items-center gap-6 flex-wrap">
        <label
          class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer hover:text-slate-900 bg-orange-50 px-2 py-1 rounded border border-orange-100">
          <input type="checkbox" id="opt-cosmo" class="rounded text-orange-500 focus:ring-orange-500" checked />
          <span>COSMO意图匹配(构建场景化)</span>
        </label>
        <label
          class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer hover:text-slate-900 bg-orange-50 px-2 py-1 rounded border border-orange-100">
          <input type="checkbox" id="opt-rufus" class="rounded text-orange-500 focus:ring-orange-500" checked />
          <span>Rufus 优化(问答预判)</span>
        </label>
        <label
          class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer hover:text-slate-900 bg-orange-50 px-2 py-1 rounded border border-orange-100">
          <input type="checkbox" id="opt-emoji" class="rounded text-orange-500 focus:ring-orange-500" checked />
          <span>Emoji 点缀</span>
        </label>
      </div>
    </div>
  </div>

  <div class="lg:col-span-4">
    <div class="sticky top-6 space-y-4">
      <div class="relative w-full group [perspective:1000px]">
        <div id="embed-toggle-container"
          class="absolute top-4 right-4 z-[60] bg-white/20 backdrop-blur-md p-1 rounded-lg flex items-center shadow-sm border border-white/10 transition-all duration-500">
          <div id="mode-toggle-glider"
            class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-white shadow-sm rounded transition-all duration-300 ease-out z-0">
          </div>

          <button data-action="amz_toggleConsoleMode" data-param="listing" id="btn-mode-listing"
            class="relative z-10 px-3 py-1 text-[10px] font-bold rounded transition-colors duration-300 text-blue-600 uppercase tracking-wide cursor-pointer">
            Listing
          </button>

          <button data-action="amz_toggleConsoleMode" data-param="visual" id="btn-mode-visual"
            class="relative z-10 px-3 py-1 text-[10px] font-bold rounded transition-colors duration-300 text-slate-500 hover:text-pink-600 uppercase tracking-wide cursor-pointer">
            Visual
          </button>
        </div>

        <div id="console-card-inner"
          class="relative transition-all duration-700 [transform-style:preserve-3d] grid grid-cols-1 grid-rows-1">
          <div class="col-start-1 row-start-1 w-full [backface-visibility:hidden]">
            <div
              class="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 rounded-xl shadow-lg shadow-blue-900/20 p-5 text-white h-full flex flex-col gap-6 border border-blue-500/20">


              <div class="pr-24">
                <h3 class="font-bold text-lg mb-1 flex items-center gap-2">
                  <i class="fas fa-pen-nib text-blue-400"></i>
                  <span>Listing<span class="text-slate-200/50 font-normal text-xs ml-2">Text Gen</span></span>
                </h3>
                <p class="text-slate-200/60 text-xs">
                  基于 A10 算法生成高转化文本
                </p>
              </div>

              <div class="space-y-3 pb-2">
                <button id="btn-generate-prompt" data-action="amz_generateMasterPrompt"
                  class="w-full py-3 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-400 hover:to-purple-500 text-white font-bold rounded-lg shadow-md transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2 group cursor-pointer">
                  <i class="fas fa-microchip group-hover:animate-pulse"></i>
                  生成 Master Prompt
                </button>
              </div>
            </div>
          </div>

          <div class="col-start-1 row-start-1 w-full [backface-visibility:hidden] [transform:rotateY(180deg)]">
            <div
              class="bg-gradient-to-br from-slate-900 via-slate-800 to-pink-900 rounded-xl shadow-lg shadow-pink-900/20 p-5 text-white h-full flex flex-col gap-6 border border-pink-500/20">
              <div class="pr-24">
                <h3
                  class="font-bold text-lg mb-1 flex items-center gap-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-rose-300">
                  <i class="fas fa-palette text-pink-400"></i>
                  <span>Visual<span class="text-pink-200/50 font-normal text-xs ml-2">Art Director</span></span>
                </h3>
                <p class="text-pink-200/60 text-xs">
                  将痛点转化为视觉防御策略
                </p>
              </div>

              <div class="space-y-3 pb-2">
                <button id="btn-generate-visual" data-action="amz_generateVisualPrompt"
                  class="w-full py-3 bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-bold rounded-lg shadow-lg shadow-pink-700/30 transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2 group cursor-pointer border border-pink-400/20">
                  <i class="fas fa-magic group-hover:spin-slow"></i>
                  生成视觉剧本 (A+/EBC)
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="app-center-card flex flex-col h-[500px] overflow-hidden !p-0" id="prompt-output-card">
        <div class="px-4 py-2 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
          <span id="output-preview-title" class="text-xs font-bold text-slate-600 uppercase tracking-wider">Listing Prompt</span>
          <div class="flex items-center gap-1">
            <button data-action="amz_togglePromptZoom" title="放大视图"
              class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-indigo-100/80 text-slate-400 hover:text-indigo-600 transition-all cursor-pointer">
              <i class="fas fa-expand text-sm" id="zoom-icon"></i>
            </button>
            <button data-action="amz_copyMasterPrompt" title="复制"
              class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-blue-100/80 text-slate-400 hover:text-blue-600 transition-all cursor-pointer">
              <i class="fas fa-copy text-sm"></i>
            </button>
            <button data-action="amz_clearPromptInputs" title="清空"
              class="w-7 h-7 flex items-center justify-center rounded-md hover:bg-red-100/80 text-slate-400 hover:text-red-600 transition-all cursor-pointer">
              <i class="fas fa-trash-alt text-sm"></i>
            </button>
          </div>
          <input type="number" id="lab-char-limit" value="5000" class="hidden" />
        </div>
        <div class="relative flex-1 bg-white">
          <textarea id="final-prompt-output"
            class="w-full h-full px-4 py-3 pb-8 text-xs font-mono text-slate-600 bg-transparent resize-none focus:outline-none border-0 transition-colors duration-500"
            placeholder="// 1. 填写左侧信息&#10;// 2. 点击生成按钮&#10;// 3. 复制并发送给 Ai大模型" readonly></textarea>
          <div class="absolute bottom-2 right-3 flex items-center gap-1.5 text-xs text-slate-400">
            <span id="prompt-word-count" class="font-medium">0</span>
            <span>chars</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 放大视图模态框 -->
<div id="prompt-zoom-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[9999] hidden items-center justify-center p-6" style="display: none;">
  <div id="prompt-zoom-content" class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col transform scale-95 opacity-0 transition-all duration-300">
    <!-- 放大后的内容容器 -->
    <div id="zoomed-cards-container" class="flex-1 overflow-y-auto p-6 space-y-4">
      <!-- 卡片将被动态移动到这里 -->
    </div>
  </div>
</div>

<!-- 放大视图的CSS样式 -->
<style>
/* 放大视图模态框样式 */
#prompt-zoom-modal {
  animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* 放大视图中的卡片容器 */
#prompt-zoom-content {
  transition: transform 0.3s ease-out, opacity 0.3s ease-out;
}

/* 翻转卡片容器样式 - 保持原始尺寸 */
.zoomed-console-card {
  width: 100%;
  max-width: 420px !important;
  margin: 0 auto !important;
  flex-shrink: 0;
}

/* 修复切换按钮定位 - 在放大视图中重新定位 */
.zoomed-console-card #embed-toggle-container {
  position: absolute !important;
  top: 1rem !important;
  right: 1rem !important;
  left: auto !important;
  bottom: auto !important;
  transform: none !important;
}

/* 输出卡片样式 - 占据剩余空间 */
.zoomed-output-card {
  max-width: 100%;
  flex: 1;
  display: flex !important;
  flex-direction: column !important;
}

/* 输出卡片内的textarea占满容器 */
.zoomed-output-card textarea {
  flex: 1 !important;
  min-height: 450px !important;
}

/* 放大视图容器的滚动条样式 */
#zoomed-cards-container {
  scrollbar-width: thin;
  scrollbar-color: rgba(148, 163, 184, 0.3) transparent;
}

#zoomed-cards-container::-webkit-scrollbar {
  width: 6px;
}

#zoomed-cards-container::-webkit-scrollbar-track {
  background: transparent;
}

#zoomed-cards-container::-webkit-scrollbar-thumb {
  background-color: rgba(148, 163, 184, 0.3);
  border-radius: 3px;
}

#zoomed-cards-container::-webkit-scrollbar-thumb:hover {
  background-color: rgba(148, 163, 184, 0.5);
}
</style>
