name: Quality Gate

on:
  push:
    branches: [main, develop, branch2-21]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test type check
        run: npm run type-check:tests

  lint-warning-gate:
    name: lint warning gate
    runs-on: ubuntu-latest
    needs: type-check

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Test ESLint
        run: npm run lint:tests

      - name: ESLint warning baseline gate
        run: npm run lint:warning-gate

      - name: Format check
        run: npm run format:check

  quality-gate:
    name: architecture boundaries & duplication
    runs-on: ubuntu-latest
    needs: lint-warning-gate

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Architecture boundary check (eslint-plugin-boundaries)
        run: npm run lint:boundaries

      - name: Duplication gate (jscpd)
        run: npm run jscpd:gate

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Check coverage threshold
        shell: pwsh
        run: |
          # Keep CI floors aligned with vite.config.js test.coverage.thresholds
          $lineThreshold = 82
          $statementThreshold = 80
          $functionThreshold = 82
          $branchThreshold = 65
          $coverage = Get-Content './coverage/coverage-summary.json' -Raw | ConvertFrom-Json
          $lines = $coverage.total.lines.pct
          $statements = $coverage.total.statements.pct
          $functions = $coverage.total.functions.pct
          $branches = $coverage.total.branches.pct
          Write-Host "Line coverage: $lines% (min $lineThreshold%)"
          Write-Host "Statement coverage: $statements% (min $statementThreshold%)"
          Write-Host "Function coverage: $functions% (min $functionThreshold%)"
          Write-Host "Branch coverage: $branches% (min $branchThreshold%)"
          if (
            $lines -lt $lineThreshold -or
            $statements -lt $statementThreshold -or
            $functions -lt $functionThreshold -or
            $branches -lt $branchThreshold
          ) {
            Write-Error "Coverage is below the configured thresholds (lines $lineThreshold / statements $statementThreshold / functions $functionThreshold / branches $branchThreshold)."
            exit 1
          }

      - name: Upload coverage report
        continue-on-error: true # artifact quota outage: report collection only, never blocks release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: build
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        timeout-minutes: 10
        # ci:quality 链末端 ci:ui-audit（card/callout/workbench）用 chromium.launch 审计
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Static artifact contract
        # _headers/_redirects/404.html 是生产安全头与路由事实源，契约必须在 CI 强制执行
        run: npm run release:artifact-contract

      - name: Bundle size gate
        # 任何 dist JS chunk 超过体积预算（gzip 400KB / raw 1200KB）即失败
        run: npm run build:size-gate

      - name: Check build output
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/index.html')) {
            Write-Error 'Missing dist/index.html.'
            exit 1
          }
          if (!(Test-Path 'dist/assets')) {
            Write-Error 'Missing dist/assets.'
            exit 1
          }

      - name: Upload build artifact
        continue-on-error: true # artifact quota outage: report collection only, never fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifact
          path: dist/
          retention-days: 7

  smoke-e2e:
    name: smoke e2e
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        id: download-build
        continue-on-error: true # artifact quota outage: fall back to local build below
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: build-artifact
          path: dist

      - name: Build dist locally (artifact unavailable)
        if: steps.download-build.outcome == 'failure'
        run: npm run build

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run release smoke E2E against dist
        env:
          # CI-minted baseline re-seed: `assertPixelDiff` writes the captured
          # region to docs/color-region-baselines/ when set, then returns
          # (no pixel assert). The re-seeded baseline is uploaded below and
          # must be reviewed + committed back via PR (GA one-off until stable).
          UPDATE_SNAPSHOTS: '1'
        run: npm run test:e2e:smoke:release

      - name: Upload re-seeded color-region baselines
        # GA 一次性：CI-minted baselines 必须提交回 docs/color-region-baselines/
        continue-on-error: true # report collection only, never blocks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: color-region-baselines
          path: docs/color-region-baselines/
          retention-days: 7

      - name: Upload E2E report
        continue-on-error: true # artifact quota outage: report collection only, never blocks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-e2e-report
          path: |
            tests/playwright-report/
            test-results/
          retention-days: 30

  business-e2e:
    name: business e2e (scraper)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run business e2e (scraper + keyword hunter)
        run: npx playwright test tests/e2e/scraper.spec.ts tests/e2e/keyword-hunter-input.spec.ts tests/e2e/keyword-hunter-process.spec.ts tests/e2e/keyword-hunter-analysis.spec.ts --project=chromium

      - name: Upload scraper e2e report
        continue-on-error: true # artifact quota outage: report collection only, never blocks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: business-e2e-report
          path: |
            tests/playwright-report/
            test-results/
          retention-days: 30

  visual:
    name: visual regression
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        id: download-build
        continue-on-error: true # artifact quota outage: fall back to local build below
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: build-artifact
          path: dist

      - name: Build dist locally (artifact unavailable)
        if: steps.download-build.outcome == 'failure'
        run: npm run build

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Mint and verify visual baselines
        env:
          PLAYWRIGHT_USE_PREVIEW: 'true'
          PLAYWRIGHT_GLOBAL_TIMEOUT: '1800000'
        run: npm run test:visual:update -- --project=chromium

      - name: Ensure visual baselines are up to date
        run: |
          if [ -n "$(git status --porcelain tests/visual/visual.test.ts-snapshots)" ]; then
            echo "::error::Visual baselines changed. Review the visual-snapshots artifact; commit CI-minted baselines (npm run test:visual:update)."
            exit 1
          fi

      - name: Upload visual report
        continue-on-error: true # artifact quota outage: report collection only, never blocks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-report
          path: |
            tests/playwright-report/
            test-results/
          retention-days: 30

      - name: Upload visual snapshots
        continue-on-error: true # 5 artifact quota outage: report collection only, never blocks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: visual-snapshots
          path: tests/visual/visual.test.ts-snapshots/
          retention-days: 30

  performance:
    name: performance
    runs-on: ubuntu-latest
    needs: smoke-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        id: download-build
        continue-on-error: true # artifact quota outage: fall back to local build below
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: build-artifact
          path: dist

      - name: Build dist locally (artifact unavailable)
        if: steps.download-build.outcome == 'failure'
        run: npm run build

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run performance gate
        run: npm run test:performance:gate

      - name: Upload performance report
        continue-on-error: true # artifact quota outage: report collection only, never blocks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: performance-report
          path: |
            tests/playwright-report/
            test-results/
            .lighthouseci/
            tests/performance/lighthouse-reports/
            performance-*.json
          retention-days: 30

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  required:
    name: required
    runs-on: ubuntu-latest
    needs:
      - type-check
      - lint-warning-gate
      - quality-gate
      - unit
      - build
      - smoke-e2e
      - business-e2e
      - visual
      - performance
      - npm-audit
    if: always()

    steps:
      - name: Check required gate results
        shell: pwsh
        run: |
          $results = @{
            'type-check' = '${{ needs['type-check'].result }}'
            'lint warning gate' = '${{ needs['lint-warning-gate'].result }}'
            'boundaries & duplication' = '${{ needs['quality-gate'].result }}'
            'unit' = '${{ needs.unit.result }}'
            'build' = '${{ needs.build.result }}'
            'smoke e2e' = '${{ needs['smoke-e2e'].result }}'
            'business e2e' = '${{ needs['business-e2e'].result }}'
            'visual regression' = '${{ needs.visual.result }}'
            'performance' = '${{ needs.performance.result }}'
            'npm audit' = '${{ needs['npm-audit'].result }}'
          }

          Add-Content $env:GITHUB_STEP_SUMMARY '## Quality Gate'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY '| Check | Result |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| --- | --- |'

          foreach ($entry in ($results.GetEnumerator() | Sort-Object Name)) {
            Write-Host "$($entry.Name): $($entry.Value)"
            Add-Content $env:GITHUB_STEP_SUMMARY "| $($entry.Name) | $($entry.Value) |"
          }

          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -ne 'success' })
          if ($failed.Count -gt 0) {
            $failedNames = ($failed | ForEach-Object { $_.Name }) -join ', '
            Write-Error "Quality gate failed: $failedNames"
            exit 1
          }

          Write-Host 'Quality gate passed.'
