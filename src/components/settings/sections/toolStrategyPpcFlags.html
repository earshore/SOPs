                <details
                  class="settings-pref-fold"
                  data-settings-focus="ppc-analysis-flags"
                  data-settings-nav-id="ppc-analysis-flags"
                  data-settings-nav-group="tool"
                >
                  <summary class="settings-pref-row settings-pref-row--fold">
                    <div class="settings-pref-row__meta">
                      <span class="settings-pref-row__icon" aria-hidden="true">
                        <i class="fas fa-bullseye"></i>
                      </span>
                      <div class="min-w-0">
                        <h4 class="settings-pref-row__title">PPC Tools</h4>
                        <p class="settings-pref-row__hint">搜索词模型与策略</p>
                      </div>
                    </div>
                    <i
                      class="settings-pref-fold__chevron fas fa-chevron-down text-[10px] text-slate-400"
                      aria-hidden="true"
                    ></i>
                  </summary>
                  <div class="settings-pref-fold__body">
                    <div class="settings-tool-page mt-3">
                      <div class="settings-pref-list" data-testid="settings-ppc-bool-pref-list">
                        <template
                          x-for="item in toolStrategyTargetItemsByIds(['ppc-tools-ppc-search-terms'])"
                          :key="item.id"
                        >
                          <div class="settings-pref-row">
                            <div class="settings-pref-row__meta">
                              <div class="min-w-0">
                                <label
                                  class="settings-pref-row__title"
                                  :for="'tool-strategy-model-' + item.id"
                                  >默认模型</label
                                >
                                <p
                                  class="settings-pref-row__hint"
                                  x-text="item.model ? '覆盖全局模型' : '跟随全局模型'"
                                ></p>
                              </div>
                            </div>
                            <div
                              class="settings-pref-row__control settings-pref-row__control--model"
                            >
                              <div class="settings-tool-page__model">
                                <select
                                  :id="'tool-strategy-model-' + item.id"
                                  :name="'tool-strategy-model-' + item.id"
                                  :value="item.model"
                                  @change="setToolTargetModel(item.id, $event)"
                                  :disabled="toolStrategyModelSelectDisabled"
                                  class="settings-control settings-control--sm settings-tool-page__model-select"
                                >
                                  <option value="" x-text="item.followGlobalOptionLabel"></option>
                                  <template x-for="model in llm.models" :key="getModelValue(model)">
                                    <option
                                      :value="getModelValue(model)"
                                      x-text="getToolStrategyModelOptionLabel(model)"
                                    ></option>
                                  </template>
                                </select>
                                <span class="settings-tool-page__model-chevron" aria-hidden="true">
                                  <i class="fas fa-chevron-down"></i>
                                </span>
                              </div>
                            </div>
                          </div>
                        </template>

                        <div class="settings-pref-divider" role="separator"></div>

                        <label class="settings-pref-row">
                          <div class="settings-pref-row__meta">
                            <div class="min-w-0">
                              <span class="settings-pref-row__title">PPC 批次大小</span>
                            </div>
                          </div>
                          <div class="settings-pref-row__control">
                            <input
                              type="number"
                              min="20"
                              max="200"
                              step="10"
                              :value="runtimeStrategy.settings.ppcSearchTerms.batchSize"
                              @input="setRuntimeNumber('ppcSearchTerms.batchSize', $event)"
                              class="settings-control settings-control--sm"
                            />
                          </div>
                        </label>

                        <div class="settings-pref-divider" role="separator"></div>

                        <label class="settings-pref-row">
                          <div class="settings-pref-row__meta">
                            <div class="min-w-0">
                              <span class="settings-pref-row__title">PPC 并发批次</span>
                            </div>
                          </div>
                          <div class="settings-pref-row__control">
                            <input
                              type="number"
                              min="1"
                              max="6"
                              step="1"
                              :value="runtimeStrategy.settings.ppcSearchTerms.maxConcurrentBatches"
                              @input="setRuntimeNumber('ppcSearchTerms.maxConcurrentBatches', $event)"
                              class="settings-control settings-control--sm"
                            />
                          </div>
                        </label>

                        <div class="settings-pref-divider" role="separator"></div>

                        <label class="settings-pref-row">
                          <div class="settings-pref-row__meta">
                            <div class="min-w-0">
                              <span class="settings-pref-row__title">缓存 TTL</span>
                              <p class="settings-pref-row__hint">小时</p>
                            </div>
                          </div>
                          <div class="settings-pref-row__control">
                            <input
                              type="number"
                              min="1"
                              max="720"
                              step="1"
                              :value="getRuntimeNumber('ppcSearchTerms.cacheTtlMs', 3600000)"
                              @input="setRuntimeNumber('ppcSearchTerms.cacheTtlMs', $event, 3600000)"
                              class="settings-control settings-control--sm"
                            />
                          </div>
                        </label>

                        <div class="settings-pref-divider" role="separator"></div>

                        <label class="settings-pref-row">
                          <div class="settings-pref-row__meta">
                            <div class="min-w-0">
                              <span class="settings-pref-row__title">最大输出 Token</span>
                            </div>
                          </div>
                          <div class="settings-pref-row__control">
                            <input
                              type="number"
                              min="1024"
                              max="64000"
                              step="1024"
                              :value="runtimeStrategy.settings.ppcSearchTerms.maxOutputTokens"
                              @input="setRuntimeNumber('ppcSearchTerms.maxOutputTokens', $event)"
                              class="settings-control settings-control--sm"
                            />
                          </div>
                        </label>

                        <div class="settings-pref-divider" role="separator"></div>

                        <div class="settings-pref-row">
                          <div class="settings-pref-row__meta">
                            <div class="min-w-0">
                              <h4 class="settings-pref-row__title">启用 LLM 缓存</h4>
                              <p class="settings-pref-row__hint">分析结果缓存</p>
                            </div>
                          </div>
                          <label class="settings-switch">
                            <span class="sr-only">启用 LLM 缓存</span>
                            <input
                              type="checkbox"
                              :checked="runtimeStrategy.settings.ppcSearchTerms.enableLlmCache"
                              @change="setRuntimeBoolean('ppcSearchTerms.enableLlmCache', $event)"
                            />
                            <span class="settings-switch__track" aria-hidden="true"></span>
                          </label>
                        </div>

                        <div class="settings-pref-divider" role="separator"></div>

                        <div class="settings-pref-row">
                          <div class="settings-pref-row__meta">
                            <div class="min-w-0">
                              <h4 class="settings-pref-row__title">默认启用 Agent</h4>
                              <p class="settings-pref-row__hint">优先走 Agent 路径</p>
                            </div>
                          </div>
                          <label class="settings-switch">
                            <span class="sr-only">默认启用 Agent</span>
                            <input
                              type="checkbox"
                              :checked="runtimeStrategy.settings.ppcSearchTerms.useAgent"
                              @change="setRuntimeBoolean('ppcSearchTerms.useAgent', $event)"
                            />
                            <span class="settings-switch__track" aria-hidden="true"></span>
                          </label>
                        </div>

                        <div class="settings-pref-divider" role="separator"></div>

                        <div class="settings-pref-row">
                          <div class="settings-pref-row__meta">
                            <div class="min-w-0">
                              <h4 class="settings-pref-row__title">允许本地回退</h4>
                              <p class="settings-pref-row__hint">模型失败时本地规则回退</p>
                            </div>
                          </div>
                          <label class="settings-switch">
                            <span class="sr-only">允许本地回退</span>
                            <input
                              type="checkbox"
                              :checked="runtimeStrategy.settings.ppcSearchTerms.allowLocalFallback"
                              @change="setRuntimeBoolean('ppcSearchTerms.allowLocalFallback', $event)"
                            />
                            <span class="settings-switch__track" aria-hidden="true"></span>
                          </label>
                        </div>

                        <div
                          class="contents"
                          data-settings-focus="ppc-thresholds"
                          id="ppc-thresholds"
                        >
                          <template x-for="item in ppcThresholdItems" :key="item.key">
                            <div>
                              <div class="settings-pref-divider" role="separator"></div>
                              <label class="settings-pref-row">
                                <div class="settings-pref-row__meta">
                                  <div class="min-w-0">
                                    <span
                                      class="settings-pref-row__title"
                                      x-text="item.label"
                                    ></span>
                                  </div>
                                </div>
                                <div class="settings-pref-row__control">
                                  <input
                                    type="number"
                                    :min="item.min"
                                    :max="item.max"
                                    :step="item.step"
                                    :value="item.value"
                                    @input="setRuntimeNumber(item.path, $event)"
                                    class="settings-control settings-control--sm"
                                  />
                                </div>
                              </label>
                            </div>
                          </template>
                        </div>
                      </div>
                    </div>
                  </div>
                </details>
