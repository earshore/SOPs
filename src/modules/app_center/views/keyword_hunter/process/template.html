<!-- Process Module Template -->
<section id="kt-module-process" class="flex-1 overflow-y-auto pb-20 w-full">
    <div class="app-center-container">
        <!-- Process Module Welcome -->
        <div class="mb-2">
            <div
                class="bg-gradient-to-br from-slate-50 via-green-50/30 to-teal-50/30 rounded-2xl border border-slate-200/60 p-8 relative overflow-hidden">
                <div
                    class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-green-100/30 to-teal-100/40 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2">
                </div>
                <div
                    class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-emerald-100/30 to-green-100/30 rounded-full blur-2xl translate-y-1/3 -translate-x-1/3">
                </div>
                <div class="relative z-10">
                    <div class="flex items-start gap-6">
                        <div
                            class="app-center-icon-container bg-gradient-to-br from-green-500 to-teal-600 shadow-lg shadow-green-500/20">
                            <i class="fas fa-tasks text-white"></i>
                        </div>
                        <div class="flex-1">
                            <h2 class="text-xl font-bold text-slate-800 mb-2">SEO处理中心</h2>
                            <p class="text-slate-600 text-sm leading-relaxed">
                                通过 自动化 的方式，对文案进行SEO覆盖标注、分析高频词云，快速定位，利用 AI 强大的理解能力，提供逐行翻译服务，方便用户审核、补充和优化，确保最大化SEO，提高语义丰富度。
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-center-card">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-800">
                    <i class="fa-solid fa-list-check"></i> 待处理Listing文案
                </h2>
                <div class="flex items-center gap-3">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="kt-show-translation" checked
                            class="rounded text-blue-600 w-4 h-4">
                        <span class="text-sm text-gray-600">显示翻译</span>
                    </label>
                    <div class="h-4 w-px bg-slate-300 mx-1"></div>
                    <button onclick="window.kt_syncToInput()"
                        class="px-3 py-1.5 bg-green-100 hover:bg-green-200 text-green-700 rounded-lg text-sm font-medium smooth-transition flex items-center gap-1">
                        <i class="fas fa-reply"></i> 同步回输入
                    </button>

                    <button onclick="window.kt_translateCopyImmersive()" id="kt-translate-btn"
                        class="relative overflow-hidden px-4 py-2 bg-gray-300 text-gray-500 rounded-xl font-medium cursor-not-allowed flex items-center gap-2 smooth-transition disabled:opacity-50 disabled:cursor-not-allowed">
                        <div id="kt-translate-progress"
                            class="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-purple-500 to-pink-500 opacity-25 hidden smooth-transition"
                            style="width:0%"></div>
                        <i class="fas fa-language"></i>
                        <span id="kt-translate-btn-text">AI 沉浸式翻译</span>
                        <span id="translate-btn-percent" class="hidden text-xs font-semibold">0%</span>
                    </button>
                </div>
            </div>

            <div id="kt-copy-display"
                class="copy-content p-6 bg-slate-50 rounded-xl border border-slate-200 min-h-[400px] text-slate-800 text-sm"
                contenteditable="true"
                data-placeholder="请先在 输入模块 点击 开始分析!">
            </div>
        </div>

        <!-- Statistics + Word Frequency (从 Analysis 模块移动过来) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start mt-6">
            <!-- Word Frequency (左侧，占2/3，突出显示) -->
            <div class="lg:col-span-2 app-center-card h-auto shadow-lg border-2 border-indigo-100">
                <h3 class="text-xl font-bold text-gray-800 mb-5 flex items-center gap-3 pb-3 border-b border-slate-200">
                    <i class="fas fa-cloud text-indigo-500 text-2xl"></i> 
                    <span>高频词云 (Top 50)</span>
                </h3>
                <div id="kt-word-frequency-list" class="max-h-96 overflow-y-auto scrollbar-thin leading-relaxed">
                    <!-- 高频词将在这里动态渲染 -->
                </div>
            </div>

            <!-- Coverage Rate (右侧，占1/3，紧凑显示) -->
            <div class="app-center-card h-auto">
                <h2 class="text-sm font-semibold text-slate-700 mb-3 flex items-center gap-2">
                    <i class="fas fa-chart-pie text-blue-500 text-base"></i> 关键词覆盖率
                </h2>

                <div class="mb-4">
                    <div class="flex justify-between items-end mb-1.5">
                        <span class="text-xs text-slate-500">Coverage</span>
                        <span id="kt-coverage-rate" class="text-xl font-bold text-blue-600">0%</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-3 overflow-hidden">
                        <div id="kt-coverage-bar"
                            class="bg-gradient-to-r from-blue-500 to-purple-500 h-3 rounded-full smooth-transition"
                            style="width: 0%"></div>
                    </div>
                </div>

                <!-- Stats Cards -->
                <div class="grid grid-cols-1 gap-2.5">
                    <div class="p-2.5 bg-green-50 rounded-lg border border-green-100 text-center">
                        <div id="kt-stat-matched" class="text-xl font-bold text-green-600">0</div>
                        <div class="text-[10px] text-green-800 mt-0.5">已匹配</div>
                    </div>
                    <div class="p-2.5 bg-red-50 rounded-lg border border-red-100 text-center">
                        <div id="kt-stat-unmatched" class="text-xl font-bold text-red-600">0</div>
                        <div class="text-[10px] text-red-800 mt-0.5">未匹配</div>
                    </div>
                    <div class="p-2.5 bg-slate-50 rounded-lg border border-slate-200 text-center">
                        <div id="kt-stat-total" class="text-xl font-bold text-slate-600">0</div>
                        <div class="text-[10px] text-slate-500 mt-0.5">总词数</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Floating Keywords Window -->
<div id="kt-keywords-floating" class="kt-floating-window">
    <div class="floating-header bg-gradient-to-r from-blue-500 to-purple-500 text-white">
        <h3 class="font-medium text-sm flex items-center gap-2">
            <i class="fas fa-list"></i> 关键词监控
        </h3>
        <div class="flex items-center gap-2">
            <button onclick="window.kt_minimizeKeywordsWindow()" class="p-1 hover:bg-white/20 rounded transition-colors" title="最小化">
                <i class="fas fa-minus"></i>
            </button>
        </div>
    </div>

    <div class="kt-floating-content">
        <div class="flex items-center justify-start gap-4 mb-3 pb-3 border-b border-slate-200">
            <div class="flex items-center gap-1.5 text-xs">
                <span class="w-3 h-3 bg-green-500 rounded-full"></span>
                <span class="text-slate-600 font-medium">已匹配 (<span id="kt-tab-matched-count">0</span>)</span>
            </div>
            <div class="flex items-center gap-1.5 text-xs">
                <span class="w-3 h-3 bg-red-500 rounded-full"></span>
                <span class="text-slate-600 font-medium">未匹配 (<span id="kt-tab-unmatched-count">0</span>)</span>
            </div>
        </div>
        <div class="kt-keyword-list-wrapper">
            <div id="kt-all-keywords" class="kt-keyword-list space-y-2 scrollbar-thin"></div>
        </div>
    </div>
</div>

<!-- Minimized Keywords Button -->
<button id="kt-keywords-minimized" onclick="window.kt_restoreKeywordsWindow()"
    class="kt-minimized-btn fixed bg-gradient-to-r from-blue-500 to-purple-500 text-white px-4 py-3 rounded-full shadow-lg hidden hover:shadow-xl smooth-transition">
    <i class="fas fa-list"></i>
    <span class="text-sm font-medium">关键词</span>
    <span class="bg-red-500 text-white text-[10px] px-1.5 rounded-full" id="kt-minimized-badge">0</span>
</button>
