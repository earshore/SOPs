<section
  id="settings-section-data"
  class="settings-panel-section space-y-4"
  data-settings-nav-id="settings-section-data"
  data-settings-nav-group="data"
>
  <div class="settings-section-head">
    <div class="settings-section-head__icon settings-section-head__icon--blue" aria-hidden="true">
      <i class="fas fa-database"></i>
    </div>
    <div class="settings-section-head__main">
      <div class="settings-section-head__title-row">
        <h3 class="settings-section-head__title">数据与备份</h3>
        <span class="settings-badge settings-badge--destructive">破坏性</span>
        <div class="settings-section-tip">
          <button type="button" class="settings-section-tip__btn" aria-label="查看说明">
            <i class="fas fa-circle-info" aria-hidden="true"></i>
          </button>
          <div class="settings-section-tip__popover" role="tooltip">
            <p>导出可能含密钥；清理前建议先备份。</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="settings-section-frame settings-section-frame--data space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div class="settings-stat-tile">
        <span class="settings-stat-tile__label">localStorage</span>
        <span class="settings-stat-tile__value" x-text="localStorageUsedText"></span>
        <span class="settings-stat-tile__meta" x-text="localStorageKeysText"></span>
      </div>
      <div class="settings-stat-tile">
        <span class="settings-stat-tile__label">IndexedDB</span>
        <span class="settings-stat-tile__value" x-text="indexedDbUsedText"></span>
        <span class="settings-stat-tile__meta" x-text="indexedDbKeysText"></span>
      </div>
    </div>

    <!-- Pref-list elevation (same family as appearance) -->
    <div class="settings-pref-list" data-testid="settings-data-pref-list">
      <details
        id="settings-export-buckets"
        class="settings-pref-fold"
        data-testid="settings-export-buckets"
        data-settings-nav-id="settings-export-buckets"
        data-settings-nav-group="data"
      >
        <summary class="settings-pref-row settings-pref-row--fold">
          <div class="settings-pref-row__meta">
            <span class="settings-pref-row__icon" aria-hidden="true">
              <i class="fas fa-file-export"></i>
            </span>
            <div class="min-w-0">
              <h4 class="settings-pref-row__title">数据导入与导出</h4>
              <p class="settings-pref-row__hint">选择分桶后导出或导入备份</p>
            </div>
          </div>
          <i
            class="settings-pref-fold__chevron fas fa-chevron-down text-[10px] text-slate-400"
            aria-hidden="true"
          ></i>
        </summary>
        <div class="settings-pref-fold__body">
          <div class="settings-tool-page settings-tool-page--framed">
            <div class="settings-pref-list">
              <template x-for="bucket in localDataBucketItems" :key="'export-' + bucket.id">
                <label class="settings-pref-row settings-pref-row--check">
                  <div class="settings-pref-row__meta">
                    <div class="min-w-0">
                      <span class="settings-pref-row__title" x-text="bucket.label"></span>
                      <p
                        class="settings-pref-row__hint"
                        x-text="bucket.isEmpty ? '暂无数据' : bucket.usedText + ' · ' + bucket.keysText"
                      ></p>
                    </div>
                  </div>
                  <span class="settings-pref-row__check">
                    <input
                      type="checkbox"
                      class="settings-checkbox h-4 w-4 rounded border-slate-300"
                      :checked="isExportBucketSelected(bucket.id)"
                      @change="toggleExportBucket(bucket.id)"
                      :disabled="localData.isBusy"
                      :data-export-bucket="bucket.id"
                      :aria-label="bucket.label"
                    />
                  </span>
                </label>
              </template>
            </div>
            <div class="settings-data-io-select-actions">
              <button
                type="button"
                @click="selectAllExportBuckets()"
                :disabled="localData.isBusy"
                class="settings-data-io-actions__btn"
              >
                全选
              </button>
              <button
                type="button"
                @click="clearExportBucketSelection()"
                :disabled="localData.isBusy"
                class="settings-data-io-actions__btn"
              >
                清空选择
              </button>
            </div>
            <div class="settings-data-io-actions">
              <button
                type="button"
                @click="exportLocalData()"
                :disabled="localData.isBusy"
                class="settings-data-io-actions__btn"
                :class="{ 'settings-data-io-actions__btn--active': isPartialLocalDataExport }"
              >
                <i class="fas fa-file-export settings-text-accent" aria-hidden="true"></i>
                <span x-text="exportLocalDataButtonText"></span>
              </button>
              <button
                type="button"
                @click="importLocalData()"
                :disabled="localData.isBusy"
                class="settings-data-io-actions__btn"
              >
                <i class="fas fa-file-import text-emerald-500" aria-hidden="true"></i>
                <span>导入备份</span>
              </button>
            </div>
          </div>
        </div>
      </details>

      <div class="settings-pref-divider" role="separator"></div>

      <details
        id="settings-data-retention"
        class="settings-pref-fold"
        data-settings-focus="settings-data-retention"
        data-settings-nav-id="settings-data-retention"
        data-settings-nav-group="data"
      >
        <summary class="settings-pref-row settings-pref-row--fold">
          <div class="settings-pref-row__meta">
            <span class="settings-pref-row__icon" aria-hidden="true">
              <i class="fas fa-clock-rotate-left"></i>
            </span>
            <div class="min-w-0">
              <h4 class="settings-pref-row__title">数据保留策略</h4>
              <p class="settings-pref-row__hint">历史条数与缓存清理阈值</p>
            </div>
          </div>
          <i
            class="settings-pref-fold__chevron fas fa-chevron-down text-[10px] text-slate-400"
            aria-hidden="true"
          ></i>
        </summary>
        <div class="settings-pref-fold__body">
          <div class="settings-tool-page settings-tool-page--framed">
            <div class="settings-pref-list">
              <label class="settings-pref-row">
                <div class="settings-pref-row__meta">
                  <div class="min-w-0">
                    <span class="settings-pref-row__title">历史保留条数</span>
                    <p class="settings-pref-row__hint">超出后优先淘汰旧记录</p>
                  </div>
                </div>
                <div class="settings-pref-row__control">
                  <input
                    type="number"
                    min="10"
                    max="500"
                    step="10"
                    data-testid="settings-storage-history-max"
                    :value="runtimeStrategy.settings.storage.historyMaxItems"
                    @input="setRuntimeNumber('storage.historyMaxItems', $event)"
                    class="settings-control settings-control--sm"
                  />
                </div>
              </label>

              <div class="settings-pref-divider" role="separator"></div>

              <label class="settings-pref-row">
                <div class="settings-pref-row__meta">
                  <div class="min-w-0">
                    <span class="settings-pref-row__title">缓存清理阈值</span>
                    <p class="settings-pref-row__hint">占用达到该比例时提示清理</p>
                  </div>
                </div>
                <div class="settings-pref-row__control">
                  <input
                    type="number"
                    min="0.5"
                    max="0.95"
                    step="0.05"
                    :value="runtimeStrategy.settings.storage.lruWarningThreshold"
                    @input="setRuntimeNumber('storage.lruWarningThreshold', $event)"
                    class="settings-control settings-control--sm"
                  />
                </div>
              </label>

              <div class="settings-pref-divider" role="separator"></div>

              <label class="settings-pref-row">
                <div class="settings-pref-row__meta">
                  <div class="min-w-0">
                    <span class="settings-pref-row__title">缓存清理比例</span>
                    <p class="settings-pref-row__hint">触发清理时淘汰的比例</p>
                  </div>
                </div>
                <div class="settings-pref-row__control">
                  <input
                    type="number"
                    min="0.05"
                    max="0.8"
                    step="0.05"
                    :value="runtimeStrategy.settings.storage.lruCleanupRatio"
                    @input="setRuntimeNumber('storage.lruCleanupRatio', $event)"
                    class="settings-control settings-control--sm"
                  />
                </div>
              </label>
            </div>
            <div class="settings-data-io-actions settings-data-io-actions--single">
              <button
                type="button"
                data-testid="settings-save-data-strategy"
                @click="saveRuntimeStrategy()"
                :disabled="runtimeStrategy.isSaving"
                class="settings-data-io-actions__btn"
              >
                <i class="fas fa-check settings-text-accent" aria-hidden="true"></i>
                <span>保存数据策略</span>
              </button>
            </div>
          </div>
        </div>
      </details>

      <div class="settings-pref-divider" role="separator"></div>

      <details
        id="settings-data-cleanup-items"
        class="settings-pref-fold"
        data-settings-focus="settings-data-cleanup-items"
        data-settings-nav-id="settings-data-cleanup-items"
        data-settings-nav-group="data"
      >
        <summary class="settings-pref-row settings-pref-row--fold">
          <div class="settings-pref-row__meta">
            <span class="settings-pref-row__icon" aria-hidden="true">
              <i class="fas fa-list-check"></i>
            </span>
            <div class="min-w-0">
              <h4 class="settings-pref-row__title">项目清理</h4>
              <p class="settings-pref-row__hint" x-text="localDataCleanupSummaryText"></p>
            </div>
          </div>
          <i
            class="settings-pref-fold__chevron fas fa-chevron-down text-[10px] text-slate-400"
            aria-hidden="true"
          ></i>
        </summary>
        <div class="settings-pref-fold__body">
          <div class="settings-tool-page settings-tool-page--framed">
            <div class="settings-data-bucket-list">
              <template x-for="bucket in localDataBucketItems" :key="bucket.id">
                <div class="settings-data-bucket-row">
                  <div class="settings-data-bucket-row__main">
                    <div class="settings-data-bucket-row__copy min-w-0 flex-1">
                      <div class="settings-data-bucket-row__title-line">
                        <h4 class="settings-pref-row__title truncate" x-text="bucket.label"></h4>
                        <span
                          class="settings-data-bucket-row__badge"
                          x-text="bucket.percentText"
                        ></span>
                      </div>
                      <p class="settings-pref-row__hint" x-text="bucket.description"></p>
                    </div>
                    <div class="settings-data-bucket-row__stats">
                      <span class="settings-data-bucket-row__used" x-text="bucket.usedText"></span>
                      <span class="settings-data-bucket-row__keys" x-text="bucket.keysText"></span>
                    </div>
                  </div>
                  <div class="settings-data-bucket-row__meter">
                    <div class="settings-data-bucket-row__track">
                      <progress
                        class="settings-local-data-progress"
                        value="0"
                        max="100"
                        :value="bucket.percentValue"
                        :data-bucket="bucket.id"
                        :aria-label="bucket.label"
                      ></progress>
                    </div>
                    <button
                      type="button"
                      @click="clearLocalDataBucket(bucket.id)"
                      :disabled="localData.isBusy || bucket.isEmpty"
                      class="settings-data-bucket-row__action"
                      :class="bucket.buttonClass"
                    >
                      <span :hidden="bucket.isClearing" x-text="bucket.actionLabel"></span>
                      <span :hidden="!bucket.isClearing" class="settings-data-bucket-row__busy">
                        <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
                        清理中
                      </span>
                    </button>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </div>
      </details>

      <div class="settings-pref-divider" role="separator"></div>

      <div
        id="settings-data-danger"
        class="settings-pref-row settings-pref-row--danger"
        data-settings-nav-id="settings-data-danger"
        data-settings-nav-group="data"
      >
        <div class="settings-pref-row__meta">
          <span class="settings-pref-row__icon settings-pref-row__icon--danger" aria-hidden="true">
            <i class="fas fa-exclamation-triangle"></i>
          </span>
          <div class="min-w-0">
            <h4 class="settings-pref-row__title">清空全部本地数据</h4>
            <p class="settings-pref-row__hint">破坏性操作，请先导出备份</p>
          </div>
        </div>
        <button
          type="button"
          class="settings-pref-row__action settings-pref-row__action--danger"
          @click="clearAllLocalData()"
          :disabled="localData.isBusy"
        >
          <i class="fas fa-trash-alt mr-1" aria-hidden="true"></i>
          清空
        </button>
      </div>
    </div>
  </div>
</section>
