<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Banner 性能测试</title>
    <link rel="stylesheet" href="../src/css/variables.css">
    <link rel="stylesheet" href="../src/css/components/welcome-banner.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 2rem;
            background: #f8fafc;
            margin: 0;
        }
        
        .header {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .header h1 {
            margin: 0 0 1rem 0;
            color: #0f172a;
        }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .metric-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .metric-label {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 0.5rem;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: 700;
            color: #0f172a;
        }
        
        .metric-value.good {
            color: #22c55e;
        }
        
        .metric-value.warning {
            color: #f59e0b;
        }
        
        .metric-value.bad {
            color: #ef4444;
        }
        
        .metric-unit {
            font-size: 1rem;
            font-weight: 400;
            color: #64748b;
        }
        
        .controls {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 200ms;
            margin-right: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-success {
            background: #22c55e;
            color: white;
        }
        
        .btn-success:hover {
            background: #16a34a;
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .test-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }
        
        .wb-container {
            margin-bottom: 0;
        }
        
        .log {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 2rem;
        }
        
        .log h3 {
            margin-top: 0;
            color: #0f172a;
        }
        
        .log-content {
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 0.75rem;
            background: #f8fafc;
            padding: 1rem;
            border-radius: 6px;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.6;
        }
        
        .log-entry {
            margin-bottom: 0.25rem;
        }
        
        .log-entry.info {
            color: #3b82f6;
        }
        
        .log-entry.success {
            color: #22c55e;
        }
        
        .log-entry.warning {
            color: #f59e0b;
        }
        
        .log-entry.error {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Welcome Banner 性能测试</h1>
        <p>实时监控动画性能和渲染指标</p>
    </div>

    <div class="metrics">
        <div class="metric-card">
            <div class="metric-label">当前帧率 (FPS)</div>
            <div class="metric-value" id="fps-value">--</div>
        </div>
        
        <div class="metric-card">
            <div class="metric-label">平均帧率</div>
            <div class="metric-value" id="avg-fps-value">--</div>
        </div>
        
        <div class="metric-card">
            <div class="metric-label">最低帧率</div>
            <div class="metric-value" id="min-fps-value">--</div>
        </div>
        
        <div class="metric-card">
            <div class="metric-label">帧时间 (ms)</div>
            <div class="metric-value" id="frame-time-value">--</div>
        </div>
        
        <div class="metric-card">
            <div class="metric-label">测试时长</div>
            <div class="metric-value" id="duration-value">0<span class="metric-unit">s</span></div>
        </div>
        
        <div class="metric-card">
            <div class="metric-label">组件数量</div>
            <div class="metric-value" id="component-count">0</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-primary" onclick="startTest()">开始测试</button>
        <button class="btn btn-danger" onclick="stopTest()">停止测试</button>
        <button class="btn btn-success" onclick="addComponents(5)">添加 5 个组件</button>
        <button class="btn btn-success" onclick="addComponents(10)">添加 10 个组件</button>
        <button class="btn btn-danger" onclick="clearComponents()">清空组件</button>
    </div>

    <div class="test-container" id="test-container">
        <!-- 初始组件 -->
        <div class="wb-container">
            <div class="wb-content">
                <div class="wb-title-row">
                    <h3 class="wb-title">测试组件 1</h3>
                    <span class="wb-badge wb-badge-ai" aria-label="人工智能功能">
                        <i class="fa-solid fa-sparkles" aria-hidden="true"></i>
                        <span>AI</span>
                    </span>
                </div>
            </div>
        </div>
        
        <div class="wb-container">
            <div class="wb-content">
                <div class="wb-title-row">
                    <h3 class="wb-title">测试组件 2</h3>
                    <span class="wb-badge wb-badge-safety" aria-label="安全警告">
                        <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
                        <span>Safety</span>
                    </span>
                </div>
            </div>
        </div>
        
        <div class="wb-container">
            <div class="wb-content">
                <div class="wb-title-row">
                    <h3 class="wb-title">测试组件 3</h3>
                    <span class="wb-badge wb-badge-growth" aria-label="增长功能">
                        <i class="fa-solid fa-chart-line" aria-hidden="true"></i>
                        <span>Growth</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div class="log">
        <h3>测试日志</h3>
        <div class="log-content" id="log-content"></div>
    </div>

    <script>
        let isTestRunning = false;
        let frameCount = 0;
        let lastTime = performance.now();
        let startTime = 0;
        let fpsHistory = [];
        let minFps = Infinity;
        let componentCounter = 3;
        
        const badgeThemes = ['ai', 'growth', 'safety', 'service', 'supply', 'analytics', 'pro', 'hub'];
        const badgeIcons = {
            'ai': 'fa-sparkles',
            'growth': 'fa-chart-line',
            'safety': 'fa-shield-halved',
            'service': 'fa-headset',
            'supply': 'fa-truck',
            'analytics': 'fa-chart-bar',
            'pro': 'fa-crown',
            'hub': 'fa-circle-nodes'
        };
        const badgeLabels = {
            'ai': '人工智能功能',
            'growth': '增长功能',
            'safety': '安全警告',
            'service': '服务功能',
            'supply': '供应链功能',
            'analytics': '分析功能',
            'pro': '专业功能',
            'hub': '中心功能'
        };
        
        function log(message, type = 'info') {
            const logContent = document.getElementById('log-content');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        function updateMetric(id, value, unit = '') {
            const element = document.getElementById(id);
            if (element) {
                element.innerHTML = value + (unit ? `<span class="metric-unit">${unit}</span>` : '');
                
                // 根据值设置颜色
                if (id === 'fps-value' || id === 'avg-fps-value' || id === 'min-fps-value') {
                    const numValue = parseFloat(value);
                    element.className = 'metric-value';
                    if (numValue >= 60) {
                        element.classList.add('good');
                    } else if (numValue >= 30) {
                        element.classList.add('warning');
                    } else if (!isNaN(numValue)) {
                        element.classList.add('bad');
                    }
                }
            }
        }
        
        function measureFPS() {
            if (!isTestRunning) return;
            
            frameCount++;
            const currentTime = performance.now();
            const elapsed = currentTime - lastTime;
            
            if (elapsed >= 1000) {
                const fps = Math.round((frameCount * 1000) / elapsed);
                const frameTime = (elapsed / frameCount).toFixed(2);
                
                // 更新 FPS 历史
                fpsHistory.push(fps);
                if (fps < minFps) {
                    minFps = fps;
                }
                
                // 计算平均 FPS
                const avgFps = Math.round(fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length);
                
                // 更新显示
                updateMetric('fps-value', fps);
                updateMetric('avg-fps-value', avgFps);
                updateMetric('min-fps-value', minFps);
                updateMetric('frame-time-value', frameTime + '<span class="metric-unit">ms</span>');
                
                // 更新测试时长
                const duration = Math.round((currentTime - startTime) / 1000);
                updateMetric('duration-value', duration, 's');
                
                // 日志
                if (fps < 60) {
                    log(`FPS 低于 60: ${fps} FPS`, 'warning');
                }
                if (fps < 30) {
                    log(`FPS 严重下降: ${fps} FPS`, 'error');
                }
                
                frameCount = 0;
                lastTime = currentTime;
            }
            
            requestAnimationFrame(measureFPS);
        }
        
        function startTest() {
            if (isTestRunning) {
                log('测试已在运行中', 'warning');
                return;
            }
            
            isTestRunning = true;
            frameCount = 0;
            lastTime = performance.now();
            startTime = performance.now();
            fpsHistory = [];
            minFps = Infinity;
            
            log('开始性能测试', 'success');
            log(`组件数量: ${document.querySelectorAll('.wb-container').length}`, 'info');
            
            requestAnimationFrame(measureFPS);
        }
        
        function stopTest() {
            if (!isTestRunning) {
                log('测试未运行', 'warning');
                return;
            }
            
            isTestRunning = false;
            
            const avgFps = Math.round(fpsHistory.reduce((a, b) => a + b, 0) / fpsHistory.length);
            
            log('测试已停止', 'info');
            log(`平均 FPS: ${avgFps}`, avgFps >= 60 ? 'success' : 'warning');
            log(`最低 FPS: ${minFps}`, minFps >= 60 ? 'success' : 'warning');
            
            if (avgFps >= 60) {
                log('✓ 性能测试通过 (平均 FPS ≥ 60)', 'success');
            } else {
                log('✗ 性能测试未通过 (平均 FPS < 60)', 'error');
            }
        }
        
        function addComponents(count) {
            const container = document.getElementById('test-container');
            
            for (let i = 0; i < count; i++) {
                componentCounter++;
                const theme = badgeThemes[Math.floor(Math.random() * badgeThemes.length)];
                
                const component = document.createElement('div');
                component.className = 'wb-container';
                component.innerHTML = `
                    <div class="wb-content">
                        <div class="wb-title-row">
                            <h3 class="wb-title">测试组件 ${componentCounter}</h3>
                            <span class="wb-badge wb-badge-${theme}" aria-label="${badgeLabels[theme]}">
                                <i class="fa-solid ${badgeIcons[theme]}" aria-hidden="true"></i>
                                <span>${theme.toUpperCase()}</span>
                            </span>
                        </div>
                    </div>
                `;
                
                container.appendChild(component);
            }
            
            updateComponentCount();
            log(`添加了 ${count} 个组件`, 'success');
        }
        
        function clearComponents() {
            const container = document.getElementById('test-container');
            container.innerHTML = '';
            componentCounter = 0;
            updateComponentCount();
            log('已清空所有组件', 'info');
        }
        
        function updateComponentCount() {
            const count = document.querySelectorAll('.wb-container').length;
            updateMetric('component-count', count);
        }
        
        // 页面加载时初始化
        window.addEventListener('load', () => {
            updateComponentCount();
            log('性能测试页面已加载', 'success');
            log('点击"开始测试"按钮开始监控性能', 'info');
            log('目标: 平均 FPS ≥ 60', 'info');
        });
    </script>
</body>
</html>
