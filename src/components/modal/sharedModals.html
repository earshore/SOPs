<!--JSON导入提醒模态框-->
<app-modal id="import-conflict-modal" size="lg" no-header>
    <div slot="body">
        <div class="bg-amber-50 px-6 py-4 border-b border-amber-100 flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center text-amber-600">
                <i class="fas fa-exclamation-triangle text-lg"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-slate-800">数据冲突确认</h3>
                <p class="text-xs text-slate-500">检测到 <span id="conflict-count"
                        class="font-bold text-amber-600 text-sm">0</span> 个已存在的 ASIN</p>
            </div>
        </div>

        <div class="p-6 space-y-4">
            <p class="text-sm text-slate-600 leading-relaxed">
                导入文件中包含部分已在当前列表中的商品。请选择如何处理这些重复项：
            </p>

            <div class="grid grid-cols-1 gap-3">
                <button id="btn-resolve-merge"
                    class="group flex items-center justify-between p-4 rounded-xl border-2 border-blue-100 hover:border-blue-500 hover:bg-blue-50 transition-all text-left w-full">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center group-hover:bg-blue-500 group-hover:text-white transition-colors">
                            <i class="fas fa-code-branch rotate-90"></i>
                        </div>
                        <div>
                            <div class="font-bold text-slate-700 group-hover:text-blue-700">智能合并 (推荐)</div>
                            <div class="text-xs text-slate-500">保留旧数据，合并新评论，自动去重</div>
                        </div>
                    </div>
                    <i class="fas fa-check text-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>
                </button>

                <button id="btn-resolve-overwrite"
                    class="group flex items-center justify-between p-4 rounded-xl border border-slate-200 hover:border-red-400 hover:bg-red-50 transition-all text-left w-full">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center group-hover:bg-red-100 group-hover:text-red-500 transition-colors">
                            <i class="fas fa-sync-alt"></i>
                        </div>
                        <div>
                            <div class="font-bold text-slate-700 group-hover:text-red-700">覆盖旧版</div>
                            <div class="text-xs text-slate-500">完全使用新导入的数据替换</div>
                        </div>
                    </div>
                </button>
            </div>
        </div>

        <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex justify-end gap-3">
            <button id="btn-resolve-skip"
                class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-slate-800 hover:bg-slate-200 rounded-lg transition-colors">
                跳过重复项
            </button>
        </div>
    </div>
</app-modal>

<!--dataDisplay删除确认模态框-->
<app-modal id="delete-confirm-modal" title="确认删除操作" size="sm">
    <div slot="body">
        <div class="p-6 md:p-8 text-center bg-white rounded-xl">
            <div
                class="mx-auto mb-6 flex h-16 w-16 items-center justify-center rounded-full bg-rose-50 ring-8 ring-rose-50/40 animate-pulse-slow">
                <i class="fas fa-trash-alt text-2xl text-rose-500"></i>
            </div>

            <h3 class="mb-2 text-lg font-bold text-gray-900">
                确定要删除吗？
            </h3>
            <p id="del-modal-desc" class="text-sm text-gray-500 leading-relaxed mb-8 max-w-[80%] mx-auto">
                此操作将<span class="font-medium text-rose-500">永久删除</span>该数据且无法恢复。请谨慎操作。
            </p>

            <div class="mb-8 flex justify-center">
                <label
                    class="group flex cursor-pointer items-center gap-3 rounded-lg border border-transparent px-3 py-2 transition-all hover:bg-gray-50 active:scale-95">
                    <div class="relative flex items-center">
                        <input type="checkbox" id="del-dont-ask"
                            class="peer h-4 w-4 cursor-pointer appearance-none rounded border border-gray-300 shadow-sm transition-all checked:border-rose-500 checked:bg-rose-500 hover:border-rose-400 focus:ring-2 focus:ring-rose-200">
                        <i
                            class="fas fa-check absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-[10px] text-white opacity-0 transition-opacity peer-checked:opacity-100"></i>
                    </div>
                    <span class="text-sm text-gray-500 transition-colors group-hover:text-gray-700 select-none">
                        不再提醒我
                    </span>
                </label>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button id="btn-del-cancel"
                    class="w-full rounded-xl border border-gray-200 bg-white py-3 px-4 text-sm font-semibold text-gray-700 shadow-sm transition-all hover:bg-gray-50 hover:text-gray-900 hover:shadow active:scale-[0.98]">
                    取消
                </button>
                <button id="btn-del-confirm"
                    class="w-full rounded-xl bg-rose-600 py-3 px-4 text-sm font-semibold text-white shadow-lg shadow-rose-500/30 transition-all hover:bg-rose-700 hover:shadow-rose-500/40 hover:-translate-y-0.5 active:scale-[0.98] active:translate-y-0 flex items-center justify-center gap-2">
                    <span>确认删除</span>
                </button>
            </div>
        </div>
    </div>
</app-modal>
