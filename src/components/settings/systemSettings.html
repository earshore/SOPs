<!-- 系统设置 (Alpine.js Refactored - Visual Enhanced) -->
<div
  x-data="settingsPanel"
  @open-settings.window="open()"
  @close-settings.window="close()"
  @keydown.escape.window="isOpen && close()"
  :hidden="!isOpen"
  :aria-hidden="(!isOpen).toString()"
  data-state="closed"
  :data-state="isOpen ? 'open' : 'closed'"
  class="settings-panel-root fixed inset-0 z-50 flex items-center justify-end"
  data-testid="settings-panel"
>
  <!-- Backdrop with blur -->
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" @click="close()"></div>

  <!-- Modal Panel -->
  <div
    class="settings-panel-shell relative h-full w-full max-w-[min(860px,calc(100vw-48px))] overflow-hidden flex flex-col"
  >
    <!-- Decorative top accent line (Appearance primary) -->
    <div class="settings-panel-chrome-bar" aria-hidden="true"></div>

    <!-- Header -->
    <div class="settings-panel-header relative p-5 pb-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="settings-panel-chrome-icon" aria-hidden="true">
          <i class="fas fa-sliders-h"></i>
        </div>
        <div>
          <h2 class="settings-panel-title text-[15px] font-bold tracking-tight">系统设置</h2>
        </div>
      </div>
      <button
        type="button"
        @click="close()"
        aria-label="关闭系统设置"
        title="关闭系统设置"
        class="settings-panel-close-btn w-8 h-8 flex items-center justify-center rounded-lg transition-colors duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--color-focus-ring,#3b82f6)] focus-visible:ring-offset-2"
      >
        <i class="fas fa-times text-sm"></i>
      </button>
    </div>

    <!-- Subtle separator -->
    <div class="settings-panel-separator mx-5 h-px"></div>

    <!-- In-panel search -->
    <div class="settings-toolbar settings-toolbar--search-only">
      <div class="settings-search">
        <span class="settings-search__icon" aria-hidden="true">
          <i class="fas fa-search"></i>
        </span>
        <input
          type="search"
          class="settings-control settings-control--sm settings-search__input"
          data-testid="settings-search"
          placeholder="搜索设置…"
          aria-label="搜索设置"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="settings-search-results"
          :aria-expanded="(searchHits.length > 0).toString()"
          :value="searchQuery"
          @input="onSettingsSearch($event)"
        />
        <div
          id="settings-search-results"
          class="settings-search-results"
          data-testid="settings-search-results"
          role="listbox"
          aria-label="搜索结果"
          :hidden="searchHits.length === 0"
        >
          <template x-for="hit in searchHits" :key="hit.id">
            <button
              type="button"
              class="settings-search-results__item"
              role="option"
              :class="{ 'is-active': searchHitId === hit.id }"
              :aria-selected="(searchHitId === hit.id).toString()"
              :data-search-hit-id="hit.id"
              @click="selectSettingsSearchHit(hit.id, hit.sectionId)"
            >
              <span class="settings-search-results__title" x-text="hit.title"></span>
              <span class="settings-search-results__meta" x-text="hit.sectionLabel"></span>
            </button>
          </template>
        </div>
      </div>
      <p
        class="settings-search-empty"
        :hidden="!searchQuery || searchHits.length > 0"
        role="status"
      >
        无匹配设置项
      </p>
    </div>

    <!-- P2-4 multi-tab external change notice -->
    <div
      class="settings-status-bar settings-status-bar--info"
      data-testid="settings-external-change-notice"
      hidden
      :hidden="!externalChangeNotice"
      role="status"
    >
      <span class="settings-status-bar__icon" aria-hidden="true">
        <i class="fas fa-window-restore"></i>
      </span>
      <div class="settings-status-bar__body">
        <p class="settings-status-bar__title">其他标签页已修改设置</p>
        <p
          class="settings-status-bar__text"
          x-text="
            externalChangeConflict
              ? '当前有未保存修改，重新加载将覆盖本地编辑。'
              : '可重新加载以同步其他标签页的更改。'
          "
        ></p>
      </div>
      <div class="settings-status-bar__actions">
        <button
          type="button"
          class="settings-status-bar__btn settings-status-bar__btn--primary"
          data-testid="settings-reload-external"
          @click="reloadFromExternalChange()"
        >
          重新加载
        </button>
        <button
          type="button"
          class="settings-status-bar__btn"
          data-testid="settings-dismiss-external"
          @click="dismissExternalChangeNotice()"
        >
          忽略
        </button>
      </div>
    </div>

    <!-- P2-5 quota warning -->
    <div
      class="settings-status-bar settings-status-bar--warning"
      data-testid="settings-quota-warning"
      hidden
      :hidden="!quotaWarningVisible"
      role="status"
    >
      <span class="settings-status-bar__icon" aria-hidden="true">
        <i class="fas fa-hdd"></i>
      </span>
      <div class="settings-status-bar__body">
        <p class="settings-status-bar__title">本机存储占用较高</p>
        <p class="settings-status-bar__text">建议清理缓存或导出备份后再继续保存。</p>
      </div>
      <div class="settings-status-bar__actions">
        <button
          type="button"
          class="settings-status-bar__btn settings-status-bar__btn--primary"
          data-testid="settings-quota-cta"
          @click="scrollToSection('settings-section-data')"
        >
          清理/导出
        </button>
      </div>
    </div>

    <!-- Scrollable Content -->
    <div class="settings-panel-scroll flex-1 overflow-y-auto px-5 py-6">
      <div class="settings-panel-body">
        <nav class="settings-panel-nav" aria-label="系统设置分类" data-testid="settings-side-nav">
          <div class="settings-panel-nav-title">分类</div>

          <!-- AI 模型与连接 -->
          <div class="settings-panel-nav-group" :class="{ 'is-open': isNavGroupOpen('llm') }">
            <button
              type="button"
              class="settings-panel-nav-link settings-panel-nav-link--primary"
              :class="{ 'is-current': isNavTargetCurrent('settings-section-llm') }"
              aria-controls="settings-section-llm"
              :aria-expanded="isNavGroupOpen('llm').toString()"
              @click="toggleNavGroup('llm', 'settings-section-llm')"
            >
              <i class="fas fa-robot" aria-hidden="true"></i>
              <span class="settings-panel-nav-link__label">AI 模型与连接</span>
              <i class="settings-panel-nav-caret fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <div class="settings-panel-nav-children" :hidden="!isNavGroupOpen('llm')">
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('llm-step-1-title') }"
                @click="navigateToNavTarget('llm-step-1-title', 'llm')"
              >
                基本信息
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('llm-step-2-title') }"
                @click="navigateToNavTarget('llm-step-2-title', 'llm')"
              >
                凭证
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('llm-step-3-title') }"
                @click="navigateToNavTarget('llm-step-3-title', 'llm')"
              >
                模型与能力
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('llm-step-4-title') }"
                @click="navigateToNavTarget('llm-step-4-title', 'llm')"
              >
                服务层级
              </button>
            </div>
          </div>

          <!-- 工具策略 -->
          <div class="settings-panel-nav-group" :class="{ 'is-open': isNavGroupOpen('tool') }">
            <button
              type="button"
              class="settings-panel-nav-link settings-panel-nav-link--primary"
              :class="{ 'is-current': isNavTargetCurrent('settings-section-tool-strategy') }"
              aria-controls="settings-section-tool-strategy"
              :aria-expanded="isNavGroupOpen('tool').toString()"
              @click="toggleNavGroup('tool', 'settings-section-tool-strategy')"
            >
              <i class="fas fa-sliders" aria-hidden="true"></i>
              <span class="settings-panel-nav-link__label">工具策略</span>
              <i class="settings-panel-nav-caret fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <div class="settings-panel-nav-children" :hidden="!isNavGroupOpen('tool')">
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('settings-runtime-presets') }"
                @click="navigateToNavTarget('settings-runtime-presets', 'tool')"
              >
                应用策略预案
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('general-ai-runtime') }"
                @click="navigateToNavTarget('general-ai-runtime', 'tool')"
              >
                通用 AI 执行策略
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('master-analysis') }"
                @click="navigateToNavTarget('master-analysis', 'tool')"
              >
                Master Analysis
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('master-analysis-scrape') }"
                @click="navigateToNavTarget('master-analysis-scrape', 'tool')"
              >
                数据采集
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('master-analysis-ai') }"
                @click="navigateToNavTarget('master-analysis-ai', 'tool')"
              >
                AI 智能分析
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('playground-deep-chat') }"
                @click="navigateToNavTarget('playground-deep-chat', 'tool')"
              >
                Deep Chat
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('keyword-hunter') }"
                data-testid="settings-nav-keyword-hunter"
                @click="navigateToNavTarget('keyword-hunter', 'tool')"
              >
                Keyword Hunter
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('ppc-analysis-flags') }"
                @click="navigateToNavTarget('ppc-analysis-flags', 'tool')"
              >
                PPC Tools
              </button>
            </div>
          </div>

          <!-- 数据与备份 -->
          <div class="settings-panel-nav-group" :class="{ 'is-open': isNavGroupOpen('data') }">
            <button
              type="button"
              class="settings-panel-nav-link settings-panel-nav-link--primary"
              :class="{ 'is-current': isNavTargetCurrent('settings-section-data') }"
              aria-controls="settings-section-data"
              :aria-expanded="isNavGroupOpen('data').toString()"
              @click="toggleNavGroup('data', 'settings-section-data')"
            >
              <i class="fas fa-database" aria-hidden="true"></i>
              <span class="settings-panel-nav-link__label">数据与备份</span>
              <i class="settings-panel-nav-caret fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <div class="settings-panel-nav-children" :hidden="!isNavGroupOpen('data')">
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('settings-export-buckets') }"
                @click="navigateToNavTarget('settings-export-buckets', 'data')"
              >
                数据导入与导出
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('settings-data-retention') }"
                @click="navigateToNavTarget('settings-data-retention', 'data')"
              >
                数据保留策略
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('settings-data-cleanup-items') }"
                @click="navigateToNavTarget('settings-data-cleanup-items', 'data')"
              >
                清理项
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('settings-data-danger') }"
                @click="navigateToNavTarget('settings-data-danger', 'data')"
              >
                危险操作
              </button>
            </div>
          </div>

          <!-- 外观与体验 -->
          <div
            class="settings-panel-nav-group"
            :class="{ 'is-open': isNavGroupOpen('appearance') }"
          >
            <button
              type="button"
              class="settings-panel-nav-link settings-panel-nav-link--primary"
              :class="{ 'is-current': isNavTargetCurrent('settings-section-appearance') }"
              aria-controls="settings-section-appearance"
              :aria-expanded="isNavGroupOpen('appearance').toString()"
              @click="toggleNavGroup('appearance', 'settings-section-appearance')"
            >
              <i class="fas fa-palette" aria-hidden="true"></i>
              <span class="settings-panel-nav-link__label">外观与体验</span>
              <i class="settings-panel-nav-caret fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <div class="settings-panel-nav-children" :hidden="!isNavGroupOpen('appearance')">
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('settings-appearance-color-mode') }"
                @click="navigateToNavTarget('settings-appearance-color-mode', 'appearance')"
              >
                主题
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('settings-appearance-theme') }"
                @click="navigateToNavTarget('settings-appearance-theme', 'appearance')"
              >
                色调
              </button>
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('settings-appearance-animation') }"
                @click="navigateToNavTarget('settings-appearance-animation', 'appearance')"
              >
                动画与动效
              </button>
            </div>
          </div>

          <!-- 开发者诊断 -->
          <div
            class="settings-panel-nav-group"
            :class="{ 'is-open': isNavGroupOpen('dev') }"
            :hidden="!showDeveloperDiagnostics"
          >
            <button
              type="button"
              class="settings-panel-nav-link settings-panel-nav-link--primary"
              :class="{ 'is-current': isNavTargetCurrent('settings-section-performance') }"
              aria-controls="settings-section-performance"
              :aria-expanded="isNavGroupOpen('dev').toString()"
              @click="toggleNavGroup('dev', 'settings-section-performance')"
            >
              <i class="fas fa-chart-line" aria-hidden="true"></i>
              <span class="settings-panel-nav-link__label">开发者诊断</span>
              <i class="settings-panel-nav-caret fas fa-chevron-down" aria-hidden="true"></i>
            </button>
            <div class="settings-panel-nav-children" :hidden="!isNavGroupOpen('dev')">
              <button
                type="button"
                class="settings-panel-nav-link settings-panel-nav-link--secondary"
                :class="{ 'is-current': isNavTargetCurrent('settings-section-performance') }"
                @click="navigateToNavTarget('settings-section-performance', 'dev')"
              >
                监控与调试
              </button>
            </div>
          </div>
        </nav>
        <div class="settings-panel-sections space-y-7">
          <!-- Section 1: AI Model Connection -->
<!--settings-slot:llmSection-->

          <div class="settings-section-sep" role="separator" aria-hidden="true"></div>

          <!-- Section 2: Tool Strategy -->
<!--settings-slot:toolStrategySection-->

          <div class="settings-section-sep" role="separator" aria-hidden="true"></div>

          <!-- Section 4: Data and Backup -->
<!--settings-slot:dataSection-->

          <div class="settings-section-sep" role="separator" aria-hidden="true"></div>

          <!-- Section 5: Appearance & Experience -->

<!--settings-slot:appearanceSection-->

          <div class="settings-section-sep" role="separator" aria-hidden="true"></div>

          <!-- Section 6: Developer Diagnostics -->
<!--settings-slot:diagnosticsSection-->

          <!-- Bottom spacer for comfortable scrolling -->
          <div class="h-2"></div>
        </div>
      </div>
    </div>

    <!-- Footer: flex-shrink-0 keeps it pinned; never scrolls with section nav -->
    <div class="settings-panel-footer">
      <div class="settings-panel-footer__status">
        <div
          class="settings-panel-footer__dot"
          :class="{ 'is-warn': healthMessages.length > 0 }"
          aria-hidden="true"
        ></div>
        <span class="settings-panel-footer__label" x-text="settingsFooterStatusText"></span>
      </div>
      <span class="settings-panel-footer__version" x-text="settingsAppVersionLabel"></span>
    </div>
  </div>
</div>
