name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - b3-24
  pull_request:
    branches:
      - b3-24
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  BUILD_OUTPUT_DIR: dist
  CLOUDFLARE_ACCOUNT_ID: f8557b8acef971d10dddfb3bde91592e
  CLOUDFLARE_PROJECT_NAME: sops

jobs:
  deploy-preview:
    name: 部署 Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run build

      - name: 发布到 Cloudflare Pages Preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ env.BUILD_OUTPUT_DIR }}
            --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.head_ref }}

  deploy-production:
    name: 部署 Production
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sops-3js.pages.dev

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run build

      - name: 发布到 Cloudflare Pages Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy ${{ env.BUILD_OUTPUT_DIR }}
            --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }}
