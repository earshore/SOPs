<div class="module-container ppc-search-app">
    <section class="bg-white border border-slate-200 rounded-lg p-5 mb-6">
        <div class="flex flex-col xl:flex-row xl:items-start justify-between gap-5">
            <div class="min-w-0">
                <div class="flex items-center gap-3 mb-2">
                    <div class="w-10 h-10 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
                        <i class="fas fa-magnifying-glass-dollar"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">PPC 搜索词分析器</h1>
                        <p class="text-sm text-slate-500 mt-1">导入广告 Search Term 报表，输出否词、加精准词、降竞价和 Listing 词池动作。</p>
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 text-xs text-slate-600 mt-4">
                    <span class="px-2.5 py-1 rounded bg-slate-100">Amazon Ads CSV/TSV</span>
                    <span class="px-2.5 py-1 rounded bg-slate-100">ERP 导出表</span>
                    <span class="px-2.5 py-1 rounded bg-slate-100">大模型分析</span>
                    <span class="px-2.5 py-1 rounded bg-slate-100">可导出动作清单</span>
                </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 xl:w-[560px]">
                <div class="rounded-lg border border-slate-200 p-3 bg-slate-50">
                    <div id="ppc-stat-rows" class="text-xl font-bold text-slate-900">0</div>
                    <div class="text-xs text-slate-500">搜索词行</div>
                </div>
                <div class="rounded-lg border border-slate-200 p-3 bg-slate-50">
                    <div id="ppc-stat-spend" class="text-xl font-bold text-slate-900">0</div>
                    <div class="text-xs text-slate-500">花费</div>
                </div>
                <div class="rounded-lg border border-slate-200 p-3 bg-slate-50">
                    <div id="ppc-stat-acos" class="text-xl font-bold text-slate-900">-</div>
                    <div class="text-xs text-slate-500">ACOS</div>
                </div>
                <div class="rounded-lg border border-slate-200 p-3 bg-slate-50">
                    <div id="ppc-stat-actions" class="text-xl font-bold text-slate-900">0</div>
                    <div class="text-xs text-slate-500">需处理</div>
                </div>
            </div>
        </div>
    </section>

    <section class="grid grid-cols-1 xl:grid-cols-3 gap-5 mb-6">
        <div class="bg-white border border-slate-200 rounded-lg p-5 xl:col-span-2">
            <div class="flex items-center justify-between gap-3 mb-4">
                <div>
                    <h2 class="font-bold text-slate-900 flex items-center gap-2">
                        <i class="fas fa-file-import text-blue-500"></i>数据导入
                    </h2>
                    <p id="ppc-file-name" class="text-xs text-slate-500 mt-1">支持 CSV、TSV 或直接粘贴表格内容。</p>
                </div>
                <button id="ppc-btn-sample" type="button"
                    class="inline-flex items-center gap-2 px-3 py-2 rounded-lg bg-slate-100 text-slate-700 text-sm font-semibold hover:bg-slate-200 transition-colors">
                    <i class="fas fa-flask"></i>样例数据
                </button>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-[280px,1fr] gap-4">
                <label class="border-2 border-dashed border-blue-200 rounded-lg bg-blue-50/60 p-5 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-blue-50 transition-colors">
                    <i class="fas fa-cloud-arrow-up text-3xl text-blue-500 mb-3"></i>
                    <span class="font-bold text-blue-800">选择报表文件</span>
                    <span class="text-xs text-blue-600 mt-1">Amazon Ads 或 ERP 导出的 CSV/TSV</span>
                    <input id="ppc-file-input" type="file" class="sr-only" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values">
                </label>
                <div>
                    <textarea id="ppc-paste-input"
                        class="w-full min-h-[150px] rounded-lg border border-slate-300 p-3 text-sm focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
                        placeholder="也可以直接粘贴 Search Term 报表内容，首行需要包含列名。"></textarea>
                    <div class="flex flex-wrap gap-2 mt-3">
                        <button id="ppc-btn-parse" type="button"
                            class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 transition-colors">
                            <i class="fas fa-chart-line"></i>开始分析
                        </button>
                        <button id="ppc-btn-clear" type="button"
                            class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-white border border-slate-300 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition-colors">
                            <i class="fas fa-eraser"></i>清空
                        </button>
                    </div>
                </div>
            </div>
            <div id="ppc-mapping-status" class="mt-4 text-xs text-slate-500"></div>
        </div>

        <div class="bg-white border border-slate-200 rounded-lg p-5">
            <h2 class="font-bold text-slate-900 flex items-center gap-2 mb-4">
                <i class="fas fa-sliders text-emerald-500"></i>分析阈值
            </h2>
            <div class="grid grid-cols-2 gap-3">
                <label class="text-xs font-semibold text-slate-600">
                    目标 ACOS %
                    <input id="ppc-target-acos" type="number" value="35" min="1" step="1"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                </label>
                <label class="text-xs font-semibold text-slate-600">
                    高 ACOS %
                    <input id="ppc-high-acos" type="number" value="55" min="1" step="1"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                </label>
                <label class="text-xs font-semibold text-slate-600">
                    无单点击
                    <input id="ppc-min-clicks" type="number" value="12" min="1" step="1"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                </label>
                <label class="text-xs font-semibold text-slate-600">
                    无单花费
                    <input id="ppc-min-spend" type="number" value="15" min="1" step="1"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                </label>
                <label class="text-xs font-semibold text-slate-600">
                    收割订单
                    <input id="ppc-min-orders" type="number" value="2" min="1" step="1"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                </label>
                <label class="text-xs font-semibold text-slate-600">
                    低 CTR %
                    <input id="ppc-min-ctr" type="number" value="0.35" min="0" step="0.05"
                        class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                </label>
            </div>
            <div class="mt-4 rounded-lg bg-emerald-50 border border-emerald-100 p-3">
                <div class="font-bold text-emerald-800 text-sm mb-1">交付口径</div>
                <p class="text-xs text-emerald-700 leading-relaxed">本工具只输出建议动作，最终改价、否词、加词仍在 ERP 或广告后台执行。</p>
            </div>
            <div class="mt-4 border-t border-slate-200 pt-4">
                <h3 class="font-bold text-slate-900 text-sm mb-3">模型设置</h3>
                <label class="flex items-start gap-2 text-xs text-slate-700 mb-3">
                    <input id="ppc-allow-local-fallback" type="checkbox" class="mt-0.5 rounded border-slate-300">
                    <span>
                        <span class="font-semibold">模型失败时使用本地规则</span>
                        <span class="block text-slate-500 mt-0.5">默认关闭，开启后仅在模型不可用时降级。</span>
                    </span>
                </label>
                <label class="flex items-start gap-2 text-xs text-slate-700">
                    <input id="ppc-use-context" type="checkbox" class="mt-0.5 rounded border-slate-300">
                    <span>
                        <span class="font-semibold">加入产品上下文</span>
                        <span class="block text-slate-500 mt-0.5">可选，不填时只基于搜索词报表分析。</span>
                    </span>
                </label>
                <div id="ppc-context-fields" class="hidden mt-3 space-y-3">
                    <label class="text-xs font-semibold text-slate-600 block">
                        ASIN
                        <input id="ppc-context-asin" type="text"
                            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                    </label>
                    <label class="text-xs font-semibold text-slate-600 block">
                        类目
                        <input id="ppc-context-category" type="text"
                            class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
                    </label>
                    <label class="text-xs font-semibold text-slate-600 block">
                        Listing
                        <textarea id="ppc-context-listing"
                            class="mt-1 w-full min-h-[90px] rounded-lg border border-slate-300 px-3 py-2 text-sm"
                            placeholder="可粘贴标题、五点或描述，用于辅助判断搜索词相关性。"></textarea>
                    </label>
                </div>
            </div>
        </div>
    </section>

    <section class="bg-white border border-slate-200 rounded-lg p-5">
        <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-4">
            <div>
                <h2 class="font-bold text-slate-900 flex items-center gap-2">
                    <i class="fas fa-list-check text-purple-500"></i>动作清单
                </h2>
                <p id="ppc-result-count" class="text-xs text-slate-500 mt-1">等待导入数据。</p>
            </div>
            <div class="flex flex-wrap gap-2">
                <button class="ppc-filter-btn active" type="button" data-filter="all">全部</button>
                <button class="ppc-filter-btn" type="button" data-filter="negative_exact">否词</button>
                <button class="ppc-filter-btn" type="button" data-filter="harvest_exact">加精准</button>
                <button class="ppc-filter-btn" type="button" data-filter="scale_budget">加预算</button>
                <button class="ppc-filter-btn" type="button" data-filter="bid_down">降竞价</button>
                <button class="ppc-filter-btn" type="button" data-filter="listing_term">Listing 词池</button>
                <button class="ppc-filter-btn" type="button" data-filter="observe">观察</button>
            </div>
        </div>

        <div class="flex flex-wrap gap-2 mb-4">
            <button id="ppc-export-all" type="button" class="ppc-export-btn">
                <i class="fas fa-file-csv"></i>导出全部动作
            </button>
            <button id="ppc-export-current" type="button" class="ppc-export-btn">
                <i class="fas fa-filter"></i>导出当前筛选
            </button>
            <button id="ppc-export-negative" type="button" class="ppc-export-btn">
                <i class="fas fa-ban"></i>导出否词
            </button>
            <button id="ppc-export-harvest" type="button" class="ppc-export-btn">
                <i class="fas fa-bullseye"></i>导出加词
            </button>
            <button id="ppc-copy-summary" type="button" class="ppc-export-btn">
                <i class="fas fa-copy"></i>复制周报摘要
            </button>
        </div>

        <div id="ppc-empty-state" class="border border-dashed border-slate-300 rounded-lg p-8 text-center">
            <i class="fas fa-table text-3xl text-slate-300 mb-3"></i>
            <div class="font-bold text-slate-700">还没有分析结果</div>
            <p class="text-sm text-slate-500 mt-1">导入报表或加载样例数据后，会在这里生成可执行动作。</p>
        </div>

        <div id="ppc-table-wrapper" class="hidden overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="bg-slate-100 text-slate-600">
                        <th class="px-3 py-2 text-left font-bold">搜索词</th>
                        <th class="px-3 py-2 text-left font-bold">动作</th>
                        <th class="px-3 py-2 text-right font-bold">花费</th>
                        <th class="px-3 py-2 text-right font-bold">销售额</th>
                        <th class="px-3 py-2 text-right font-bold">订单</th>
                        <th class="px-3 py-2 text-right font-bold">ACOS</th>
                        <th class="px-3 py-2 text-right font-bold">CTR</th>
                        <th class="px-3 py-2 text-right font-bold">CVR</th>
                        <th class="px-3 py-2 text-left font-bold">原因</th>
                    </tr>
                </thead>
                <tbody id="ppc-results-body"></tbody>
            </table>
        </div>
    </section>
</div>
