<div class="module-container" x-data="aiAnalysisPanel">
  <!-- Welcome Banner -->
  <div class="wb-container wb-container--card mb-8"
    style="--wb-gradient-1: rgba(239, 246, 255, 0.95); --wb-gradient-2: rgba(219, 234, 254, 0.90); --wb-orb-1-color: rgba(96, 165, 250, 0.15); --wb-orb-2-color: rgba(147, 197, 253, 0.12); --wb-orb-3-color: rgba(59, 130, 246, 0.08); --wb-particle-color: rgba(59, 130, 246, 0.6);">
    <div class="wb-card">
      <div class="wb-bg-gradient"></div>
      <div class="wb-orb wb-orb-1"></div>
      <div class="wb-orb wb-orb-2"></div>
      <div class="wb-orb wb-orb-3"></div>
      <div class="wb-grid-pattern"></div>
      <div class="wb-particle wb-particle-1"></div>
      <div class="wb-particle wb-particle-2"></div>
      <div class="wb-particle wb-particle-3"></div>
      <div class="wb-particle wb-particle-4"></div>
      <div class="wb-particle wb-particle-5"></div>
      <div class="wb-particle wb-particle-6"></div>
      <div class="wb-particle wb-particle-7"></div>
      <div class="wb-particle wb-particle-8"></div>
      <div class="wb-content">
        <div class="wb-header">
          <div class="wb-icon-wrapper">
            <div class="wb-icon-main">
              <i class="fa-solid fa-brain"></i>
            </div>
            <div class="wb-icon-badge">
              <i class="fa-solid fa-microchip"></i>
            </div>
          </div>
          <div class="wb-text">
            <div class="wb-title-row">
              <h2 class="wb-title">
                <span
                  class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">AI</span>
                智能分析
              </h2>
              <span aria-label="人工智能功能" class="wb-badge wb-badge-ai">
                <i aria-hidden="true" class="fa-solid fa-circle-up"></i>PRO
              </span>
            </div>
            <p class="wb-description">
              基于大语言模型的 Listings &amp; Reviews 深度洞察，从标题关键词到用户评论，全方位解构产品竞争力。
            </p>
            <div class="wb-tags">
              <div class="wb-tag">
                <div class="wb-tag-dot"></div>
                <span>支持 Listings &amp; Reviews 分析维度</span>
              </div>
              <div class="wb-tag">
                <div class="wb-tag-dot" style="background-color: var(--wb-tag-dot-2, #a855f7);"></div>
                <span>AI 大模型驱动</span>
              </div>
              <div class="wb-tag">
                <div class="wb-tag-dot" style="background-color: var(--wb-tag-dot-3, #10b981);"></div>
                <span>一键导出报告</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- 主要内容区域 -->
  <div>
    <!-- ASIN 选择和分析目标 -->
    <div class="mb-8">
      <div class="bg-white/90 border border-slate-200/70 rounded-2xl shadow-sm overflow-hidden">
        <button type="button" data-selection-panel-toggle @click="toggleSelectionPanel()"
          class="w-full flex items-center justify-between px-6 py-5 transition-colors hover:bg-slate-50/80"
          :class="selectionPanelButtonClass">
          <div class="flex items-center gap-4">
            <div
              class="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-600 rounded-xl flex items-center justify-center shadow-lg shadow-purple-200">
              <i class="fa-solid fa-sliders text-white"></i>
            </div>
            <div class="text-left">
              <h3 class="text-lg font-semibold text-slate-800">选择 ASIN 与分析目标</h3>
              <p class="text-sm text-slate-500 mt-0.5">展开后可一站式完成产品与分析维度配置</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span x-show="showSelectionSummary"
              class="flex items-center gap-1.5 bg-emerald-50 text-emerald-600 text-xs px-3 py-1.5 rounded-full font-medium border border-emerald-100 inline-flex">
              <i class="fa-solid fa-circle-check"></i>
              已选择 <span x-text="selectedAsins.length"></span> 个产品
            </span>
            <span x-show="showSelectionSummary"
              class="flex items-center gap-1.5 bg-indigo-50 text-indigo-600 text-xs px-3 py-1.5 rounded-full font-medium border border-indigo-100 inline-flex">
              <i class="fa-solid fa-circle-check"></i>
              已选择 <span x-text="selectedTargets.length"></span> / <span x-text="analysisTargets.length"></span> 个分析目标
            </span>
            <i :class="selectionPanelChevronClass"></i>
          </div>
        </button>

        <template x-if="showMissingRealDataNotice &amp;&amp; !showSelectionPanel">
          <div class="mx-6 mt-4 mb-4 rounded-xl border border-amber-200 bg-amber-50 p-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
              <div>
                <h3 class="font-bold text-amber-900 flex items-center gap-2 text-sm">
                  <i class="fa-solid fa-circle-info text-amber-600"></i>
                  还没有可分析的产品数据
                </h3>
                <p class="text-xs text-amber-800/80 mt-1">
                  先去数据采集页导入 JSON 或采集 ASIN，再回到这里选择产品和分析目标。
                </p>
              </div>
              <button type="button" data-action="switch-tab" data-tab="scraper"
                class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold transition-colors">
                <i class="fa-solid fa-spider mr-1"></i>去数据采集
              </button>
            </div>
          </div>
        </template>

        <div x-show="showSelectionPanel" x-transition:enter="transition ease-out duration-200"
          x-transition:enter-start="opacity-0 transform -translate-y-2"
          x-transition:enter-end="opacity-100 transform translate-y-0"
          x-transition:leave="transition ease-in duration-150"
          x-transition:leave-start="opacity-100 transform translate-y-0"
          x-transition:leave-end="opacity-0 transform -translate-y-2"
          class="px-6 pb-6 pt-5 bg-gradient-to-b from-slate-50/80 via-white to-white" data-selection-panel-content>
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- ASIN 输入区 -->
            <div class="lg:col-span-4">
              <div class="bg-white/95 rounded-2xl shadow-sm border border-slate-200/80 p-6 h-full ring-1 ring-white/70">
                <div class="flex items-start justify-between gap-4 mb-5">
                  <div class="flex items-center gap-4">
                    <div
                      class="w-12 h-12 bg-indigo-50 border border-indigo-100 rounded-xl flex items-center justify-center shadow-sm shadow-indigo-100/60">
                      <i class="fa-solid fa-barcode text-indigo-600"></i>
                    </div>
                    <div>
                      <h2 class="text-lg font-semibold text-slate-800"> 选择 ASIN</h2>
                      <p class="text-sm text-slate-500">选择或输入产品标识符</p>
                    </div>
                  </div>
                  <span data-asin-selected-count
                    class="flex items-center gap-1.5 bg-emerald-50 text-emerald-600 text-xs px-3 py-1.5 rounded-full font-medium border border-emerald-100 inline-flex mt-1">
                    <i class="fa-solid fa-circle-check"></i>
                    已选择 <span x-text="selectedAsins.length"></span> 个产品
                  </span>
                </div>
                <div>
                  <!-- ASIN 选择区域 -->
                  <div class="relative">
                    <div class="flex items-center justify-end mb-3">
                      <!-- <label class="text-sm font-semibold text-slate-700">选择产品 ASIN</label> -->
                      <div class="flex items-center gap-2">
                        <button :disabled="isAnalyzing" @click="selectAllAsins()"
                          class="flex items-center gap-1.5 text-sm text-indigo-600 hover:text-indigo-700 font-medium transition-colors">
                          <i class="fa-solid fa-check-double"></i>
                          全选
                        </button>
                        <span class="text-slate-300">|</span>
                        <button :disabled="isAnalyzing" @click="clearAllAsins()"
                          class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 font-medium transition-colors">
                          <i class="fa-solid fa-xmark"></i>
                          清空
                        </button>
                      </div>
                    </div>
                    <!-- 可用 ASIN 列表（复选框） -->
                    <template x-if="hasAvailableAsins">
                      <div class="mt-3">
                        <!-- <p class="text-xs text-slate-500 mb-3 font-medium">已加载的产品（<span x-text="availableAsins.length"></span> 个）：
                </p> -->
                        <div class="space-y-2 max-h-48 overflow-y-auto">
                          <template :key="asinItem" x-for="asinItem in availableAsins">
                            <label
                              :class="getAsinOptionClass(asinItem)"
                              class="flex items-center gap-3 p-3 rounded-lg border-2 transition-all cursor-pointer hover:bg-indigo-50">
                              <input :checked="selectedAsins.includes(asinItem)" :disabled="isAnalyzing"
                                @change="toggleAsin(asinItem)"
                                class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500"
                                type="checkbox" />
                              <span :class="getAsinTextClass(asinItem)"
                                class="flex-1 font-mono text-sm font-semibold" x-text="asinItem"></span>
                              <i class="fa-solid fa-check text-indigo-600"
                                x-show="selectedAsins.includes(asinItem)"></i>
                            </label>
                          </template>
                        </div>
                      </div>
                    </template>
                  </div>
                  <!-- 产品信息摘要 -->
                  <template x-if="hasCurrentProducts">
                    <div
                      class="mt-4 p-4 bg-gradient-to-r from-slate-50 to-indigo-50/50 rounded-xl border border-slate-100">
                      <h4
                        class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                        <i class="fa-solid fa-box-open"></i>
                        已加载产品信息
                      </h4>
                      <div class="space-y-2">
                        <template :key="product.asin" x-for="product in currentProducts.slice(0, 2)">
                          <div class="text-xs">
                            <span class="font-mono text-indigo-600 font-semibold" x-text="product.asin"></span>
                            <p class="text-slate-600 line-clamp-1 mt-0.5" x-text="product.productTitle"></p>
                          </div>
                        </template>
                        <template x-if="hasMoreCurrentProducts">
                          <p class="text-xs text-slate-500 italic">
                            还有 <span x-text="currentProducts.length - 2"></span> 个产品...
                          </p>
                        </template>
                      </div>
                      <div class="flex items-center gap-4 mt-3 text-xs text-slate-500 pt-2 border-t border-slate-200">
                        <span class="flex items-center gap-1">
                          <i class="fa-solid fa-list text-blue-500"></i>
                          <span
                            x-text="totalFeatureBulletCount"></span>
                          个卖点
                        </span>
                        <span class="flex items-center gap-1">
                          <i class="fa-solid fa-comments text-amber-500"></i>
                          <span
                            x-text="totalCustomerReviewCount"></span>
                          条评论
                        </span>
                        <div class="relative ml-auto">
                          <i @mouseenter="showProductSummaryTooltip()" @mouseleave="hideProductSummaryTooltip()"
                            class="fa-solid fa-circle-exclamation text-indigo-500 cursor-help"></i>
                          <div x-show="productSummaryTooltipVisible" x-transition:enter="transition ease-out duration-200"
                            x-transition:enter-start="opacity-0 transform scale-95"
                            x-transition:enter-end="opacity-100 transform scale-100"
                            x-transition:leave="transition ease-in duration-150"
                            x-transition:leave-start="opacity-100 transform scale-100"
                            x-transition:leave-end="opacity-0 transform scale-95"
                            class="absolute left-0 bottom-full mb-2 w-72 p-3 bg-slate-800 text-white rounded-lg shadow-xl z-50"
                            style="display: none;">
                            <div class="text-xs space-y-2">
                              <template x-if="hasScraperData">
                                <div>
                                  <p class="font-semibold mb-1">数据源已加载</p>
                                  <p
                                    x-text="productSummaryText">
                                  </p>
                                  <p class="text-slate-300 mt-1.5 flex items-center gap-1">
                                    <i class="fa-solid fa-globe"></i>
                                    <span
                                      x-text="dataSourceMetaText"></span>
                                  </p>
                                </div>
                              </template>
                              <template x-if="hasNoScraperData">
                                <div>
                                  <p class="font-semibold mb-1">数据源已加载</p>
                                  <p>包含产品数据和评论</p>
                                  <p class="text-slate-300 mt-1.5 flex items-center gap-1">
                                    <i class="fa-solid fa-globe"></i>
                                    可从"数据采集"模块获取真实产品数据
                                  </p>
                                </div>
                              </template>
                            </div>
                            <div
                              class="absolute left-4 top-full w-0 h-0 border-l-4 border-r-4 border-t-4 border-transparent border-t-slate-800">
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
                <!-- 无数据提示 -->
                <template x-if="hasNoAvailableAsins">
                  <div class="mt-4 pt-4 border-t border-slate-100">
                    <div class="bg-amber-50 border-2 border-amber-200 rounded-xl p-4">
                      <div class="flex items-start gap-3">
                        <div class="w-10 h-10 bg-amber-100 rounded-lg flex items-center justify-center flex-shrink-0">
                          <i class="fa-solid fa-exclamation-triangle text-amber-600"></i>
                        </div>
                        <div class="flex-1">
                          <h4 class="text-sm font-bold text-amber-800 mb-1">暂无产品数据</h4>
                          <p class="text-xs text-amber-700 leading-relaxed mb-3">
                            请先从"数据采集"模块抓取产品数据，或从"数据管理"导入历史数据。
                          </p>
                          <div class="flex items-center gap-2">
                            <a @click.prevent="$dispatch('navigate-to-scraper')"
                              class="inline-flex items-center gap-1.5 text-xs font-semibold text-amber-700 hover:text-amber-800 bg-amber-100 hover:bg-amber-200 px-3 py-1.5 rounded-lg transition-colors"
                              href="#">
                              <i class="fa-solid fa-arrow-right"></i>
                              前往数据采集
                            </a>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
            <!-- 分析目标选择区 -->
            <div class="lg:col-span-8">
              <div class="bg-white/95 rounded-2xl shadow-sm border border-slate-200/80 p-6 h-full ring-1 ring-white/70">
                <div class="flex items-start justify-between gap-4 mb-6">
                  <div class="flex items-center gap-4 flex-1">
                    <div
                      class="w-12 h-12 bg-violet-50 border border-violet-100 rounded-xl flex items-center justify-center shadow-sm shadow-violet-100/60">
                      <!-- <i class="fa-solid fa-check-double text-violet-600"></i> -->
                      <i class="fa-solid fa-users-viewfinder text-violet-600"></i>
                    </div>
                    <div class="flex items-start justify-between gap-4 w-full">
                      <div>
                        <h2 class="text-lg font-semibold text-slate-800">选择分析目标</h2>
                        <p class="text-sm text-slate-500">选择需要执行的 AI 分析维度</p>
                      </div>
                      <span
                        class="flex items-center gap-1.5 bg-indigo-50 text-indigo-600 text-xs px-3 py-1.5 rounded-full font-medium border border-indigo-100 inline-flex mt-1">
                        <i class="fa-solid fa-circle-check"></i>
                        已选择 <span data-targets-selected-count class="font-bold text-indigo-600"
                          x-text="selectedTargets.length"></span> / <span x-text="analysisTargets.length"></span> 个分析目标
                      </span>
                    </div>
                  </div>
                </div>
                <div>
                  <div class="flex items-center justify-end gap-3 mb-6">
                    <button :disabled="isAnalyzing" @click="selectAllTargets()"
                      class="flex items-center gap-1.5 text-sm text-indigo-600 hover:text-indigo-700 font-medium transition-colors">
                      <i class="fa-solid fa-check-double"></i>
                      全选
                    </button>
                    <span class="text-slate-300">|</span>
                    <button :disabled="isAnalyzing" @click="clearAllTargets()"
                      class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 font-medium transition-colors">
                      <i class="fa-solid fa-xmark"></i>
                      清空
                    </button>
                  </div>
                  <!-- Listings 分析 -->
                  <div class="mb-6">
                    <div class="flex items-center gap-2 mb-4">
                      <div
                        class="flex items-center gap-2 bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1.5 rounded-full border border-blue-100">
                        <i class="fa-solid fa-box-open"></i>
                        Listings 分析
                      </div>
                      <span class="text-xs text-slate-400">基于标题与五点描述</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <template :key="target.id" x-for="target in listingAnalysisTargets">
                        <button
                          :class="getListingTargetCardClass(target.id)"
                          :disabled="isAnalyzing" @click="toggleTarget(target.id)"
                          class="relative p-4 rounded-xl border-2 text-left transition-all duration-200 group hover:shadow-md">
                          <div class="flex items-start gap-3">
                            <div
                              :class="getListingTargetIconWrapClass(target.id)"
                              class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 transition-all">
                              <i :class="getListingTargetIconClass(target.id)"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                              <h4 class="font-semibold text-sm text-slate-800" x-text="target.name"></h4>
                              <p class="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed"
                                x-text="target.description">
                              </p>
                            </div>
                            <div
                              :class="getTargetCheckClass(target.id)"
                              class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all mt-0.5">
                              <i class="fa-solid fa-check text-white text-[10px]"
                                x-show="selectedTargets.includes(target.id)"></i>
                            </div>
                          </div>
                        </button>
                      </template>
                    </div>
                  </div>
                  <!-- Reviews 分析 -->
                  <div>
                    <div class="flex items-center gap-2 mb-4">
                      <div
                        class="flex items-center gap-2 bg-amber-50 text-amber-700 text-xs font-semibold px-3 py-1.5 rounded-full border border-amber-100">
                        <i class="fa-solid fa-star"></i>
                        Reviews 分析
                      </div>
                      <span class="text-xs text-slate-400">基于用户评论数据</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                      <template :key="target.id" x-for="target in reviewAnalysisTargets">
                        <button
                          :class="getReviewTargetCardClass(target.id)"
                          :disabled="isAnalyzing" @click="toggleTarget(target.id)"
                          class="relative p-4 rounded-xl border-2 text-left transition-all duration-200 group hover:shadow-md">
                          <div class="flex items-start gap-3">
                            <div
                              :class="getReviewTargetIconWrapClass(target.id)"
                              class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 transition-all">
                              <i :class="getReviewTargetIconClass(target.id)"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                              <h4 class="font-semibold text-sm text-slate-800" x-text="target.name"></h4>
                              <p class="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed"
                                x-text="target.description">
                              </p>
                            </div>
                            <div
                              :class="getTargetCheckClass(target.id)"
                              class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all mt-0.5">
                              <i class="fa-solid fa-check text-white text-[10px]"
                                x-show="selectedTargets.includes(target.id)"></i>
                            </div>
                          </div>
                        </button>
                      </template>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <template x-if="hasSelectedAnalysisInput">
              <div class="lg:col-span-12">
                <div
                  class="rounded-2xl border border-slate-200/80 bg-gradient-to-b from-white via-slate-50/30 to-white p-5 shadow-sm ring-1 ring-white/70">
                  <button @click="togglePromptPanel()"
                    class="w-full flex items-center justify-between gap-4 rounded-xl border border-slate-200/80 bg-slate-50/80 px-4 py-4 text-sm text-slate-600 transition-all hover:border-indigo-200 hover:bg-white hover:text-indigo-600">
                    <div class="flex items-center gap-3 min-w-0">
                      <div
                        class="w-10 h-10 bg-indigo-50 border border-indigo-100 rounded-xl flex items-center justify-center shadow-sm shadow-indigo-100/60 flex-shrink-0">
                        <i class="fa-solid fa-code text-indigo-600"></i>
                      </div>
                      <div class="text-left min-w-0">
                        <h3 class="text-sm font-semibold text-slate-800">任务预览</h3>
                        <p class="text-xs text-slate-500 mt-0.5">在执行分析前预览各任务 Prompt 内容</p>
                      </div>
                    </div>
                    <div class="flex items-center gap-3 flex-wrap justify-end">
                      <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-semibold"
                        x-text="selectedTaskCountText"></span>
                      <template x-if="hasTotalTokenCount">
                        <span
                          class="flex items-center gap-1.5 text-xs bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded-full font-semibold border border-emerald-200">
                          <i class="fa-solid fa-calculator"></i>
                          <span x-text="formattedTotalTokenCount"></span>
                          <span class="text-emerald-600">tokens</span>
                        </span>
                      </template>
                      <span class="font-medium" x-text="promptPanelToggleText"></span>
                      <i :class="promptPanelChevronClass"></i>
                    </div>
                  </button>
                  <template x-if="showPromptPanel">
                    <div class="mt-4 space-y-3 border-t border-slate-200/70 pt-4">
                      <template :key="targetId" x-for="(targetId, index) in selectedTargets">
                        <div class="bg-slate-900 rounded-xl overflow-hidden border border-slate-700">
                          <button @click="togglePromptItem(index)"
                            class="w-full flex items-center justify-between p-4 hover:bg-slate-800/50 transition-colors">
                            <div class="flex items-center gap-3">
                              <div class="w-8 h-8 bg-emerald-500/20 rounded-lg flex items-center justify-center">
                                <!-- <i class="fa-solid fa-terminal text-emerald-400"></i> -->
                                <span class="text-xs font-mono font-semibold text-emerald-400" x-text="getPromptNumber(index)">TASK</span>
                              </div>
                              <div class="text-left">
                                <!-- <h4 class="text-sm font-semibold text-white">AI 分析提示词</h4> -->
                                <h4 class="text-sm font-semibold text-white" x-text="getTargetName(targetId)"></h4>
                                <p class="text-xs text-slate-400" x-text="getTargetDescription(targetId)">
                                </p>
                              </div>
                            </div>
