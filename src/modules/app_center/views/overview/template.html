<div class="module-container app-overview-container">
  <div
    class="wb-container wb-container--simple wb-container--decorative app-overview-hero"
    aria-labelledby="app-overview-title"
  >
    <div class="wb-content">
      <div class="app-overview-hero-main">
        <div class="wb-icon" aria-hidden="true">
          <i class="fas fa-cubes"></i>
        </div>
        <div class="app-overview-hero-copy">
          <div class="wb-title-row">
            <h1 id="app-overview-title" class="wb-title">应用中心</h1>
            <span aria-label="应用中心工作台" class="wb-badge">
              <i class="fas fa-bolt"></i><span>工作台</span>
            </span>
          </div>
          <p class="wb-description">
            面向亚马逊运营的工具工作台，集中承载数据采集、AI 分析、关键词处理、PPC
            搜索词分析和对话实验。
          </p>
          <div class="wb-tags" aria-label="应用中心能力标签">
            <div class="wb-tag">
              <span class="wb-tag-dot app-dot-primary" aria-hidden="true"></span>
              <span>数据采集</span>
            </div>
            <div class="wb-tag">
              <span class="wb-tag-dot app-dot-primary" aria-hidden="true"></span>
              <span>关键词增长</span>
            </div>
            <div class="wb-tag">
              <span class="wb-tag-dot app-dot-primary" aria-hidden="true"></span>
              <span>PPC 优化</span>
            </div>
            <div class="wb-tag">
              <span class="wb-tag-dot app-dot-primary" aria-hidden="true"></span>
              <span>AI 对话</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section class="app-overview-flow" aria-label="任务路径">
    <details class="app-overview-collapsible">
      <summary class="app-overview-section-heading app-overview-collapsible-summary">
        <div>
          <h2 class="app-overview-section-title">任务路径</h2>
          <p class="app-overview-eyebrow">按竞品与 Listing 样板流推进输入、产物和人工复核点。</p>
        </div>
        <span class="app-overview-collapsible-controls">
          <span class="app-overview-mini-badge">作业系统</span>
          <span class="app-overview-collapsible-action" aria-hidden="true">
            <i class="fas fa-chevron-down"></i>
          </span>
        </span>
      </summary>
      <div class="app-overview-collapsible-body">
        <div class="app-overview-flow-grid app-overview-flow-grid--tasks"></div>
      </div>
    </details>
  </section>

  <section class="app-overview-recent-panel" aria-label="最近作业">
    <div class="app-overview-section-heading">
      <div>
        <h2 class="app-overview-section-title">
          <i class="fa-solid fa-clock-rotate-left app-overview-section-icon" aria-hidden="true"></i>
          最近作业
        </h2>
        <p class="app-overview-eyebrow">
          查看上次生成的结果，或进入明确的下一步。需要人工复核的项目会优先显示。
        </p>
      </div>
      <div class="app-overview-recent-heading-actions">
        <button class="app-overview-recent-group-btn hidden" type="button" data-recent-undo-remove>
          <i class="fas fa-rotate-left" aria-hidden="true"></i>
          <span>撤销移除</span>
        </button>
        <span class="app-overview-mini-badge app-overview-recent-count-badge">显示 0 项</span>
      </div>
    </div>

    <div class="app-overview-recent-toolbar">
      <label class="app-overview-recent-search-label" for="app-overview-recent-search">
        <i class="fas fa-search" aria-hidden="true"></i>
        <span class="sr-only">搜索最近作业</span>
        <input
          id="app-overview-recent-search"
          class="app-overview-recent-search"
          type="search"
          placeholder="搜索站点、ASIN 或负责人"
          autocomplete="off"
        />
      </label>
      <div class="app-overview-recent-type-filters" role="group" aria-label="按当前阶段筛选"></div>
      <div
        class="app-overview-recent-status-filters"
        role="group"
        aria-label="按作业状态筛选"
      ></div>
      <div class="app-overview-recent-sort" role="group" aria-label="最近作业排序"></div>
      <div class="app-overview-recent-columns-toggle" role="group" aria-label="最近作业列数">
        <button
          class="app-overview-recent-columns-btn"
          type="button"
          data-recent-columns="1"
          aria-pressed="false"
          title="单列"
        >
          <i class="fas fa-bars" aria-hidden="true"></i>
          <span>1 列</span>
        </button>
        <button
          class="app-overview-recent-columns-btn"
          type="button"
          data-recent-columns="2"
          aria-pressed="true"
          title="双列"
        >
          <i class="fas fa-table-columns" aria-hidden="true"></i>
          <span>2 列</span>
        </button>
        <button
          class="app-overview-recent-columns-btn"
          type="button"
          data-recent-columns="3"
          aria-pressed="false"
          title="三列"
        >
          <i class="fas fa-table-cells" aria-hidden="true"></i>
          <span>3 列</span>
        </button>
      </div>
    </div>

    <div class="app-overview-recent-shell" data-recent-columns="2">
      <div class="app-overview-recent-list" role="list" aria-label="最近作业"></div>

      <div class="app-overview-recent-empty hidden" aria-live="polite">
        <div class="app-overview-recent-empty-icon" aria-hidden="true">
          <i class="fas fa-clock-rotate-left"></i>
        </div>
        <div class="app-overview-recent-empty-copy">
          <div class="app-overview-empty-title" data-recent-empty-title>暂无最近作业</div>
          <p data-recent-empty-description>
            完成采集、AI 分析、关键词处理或 PPC 导出后，可从这里查看结果或进入下一步。
          </p>
        </div>
        <div class="app-overview-recent-empty-actions">
          <button
            class="app-card-primary-link"
            type="button"
            data-action="switch-tab"
            data-tab="scraper"
            data-recent-empty-start
          >
            <span>开始采集</span>
            <i class="fas fa-arrow-right" aria-hidden="true"></i>
          </button>
          <button
            class="app-child-link app-overview-recent-empty-secondary"
            type="button"
            data-action="switch-tab"
            data-tab="keyword_hunter_input"
            data-recent-empty-start
          >
            <i class="fas fa-key" aria-hidden="true"></i>
            <span>关键词输入</span>
          </button>
          <button
            class="app-child-link app-overview-recent-empty-secondary"
            type="button"
            data-action="switch-tab"
            data-tab="ppc_search_terms"
            data-recent-empty-start
          >
            <i class="fas fa-list-check" aria-hidden="true"></i>
            <span>PPC 搜索词</span>
          </button>
          <button
            class="app-child-link app-overview-recent-empty-secondary hidden"
            type="button"
            data-recent-empty-clear
          >
            <i class="fas fa-filter-circle-xmark" aria-hidden="true"></i>
            <span>清除搜索和筛选</span>
          </button>
        </div>
      </div>
      <button class="app-overview-recent-load-more hidden" type="button" data-recent-load-more>
        <i class="fas fa-chevron-down" aria-hidden="true"></i>
        <span>显示更多</span>
      </button>
    </div>
  </section>

  <section class="app-overview-filter-panel" aria-label="分类筛选">
    <div class="app-overview-section-heading">
      <div>
        <h2 class="app-overview-section-title">
          <i class="fa-solid fa-table-cells-large app-overview-section-icon" aria-hidden="true"></i>
          应用矩阵
        </h2>
        <p class="app-overview-eyebrow">按应用类型筛选入口，快速定位工具分组。</p>
      </div>
      <p id="app-overview-visible-count" class="app-overview-count" aria-live="polite">
        显示 4 个应用
      </p>
    </div>
    <div class="app-overview-toolbar">
      <div class="app-overview-filter-row" role="group" aria-label="应用分类"></div>
      <div class="app-overview-view-toggle" role="group" aria-label="应用显示模式">
        <button
          class="app-overview-view-btn active"
          type="button"
          data-view-mode="grid"
          aria-pressed="true"
        >
          <i class="fas fa-table-cells-large" aria-hidden="true"></i><span>卡片</span>
        </button>
        <button
          class="app-overview-view-btn"
          type="button"
          data-view-mode="list"
          aria-pressed="false"
        >
          <i class="fas fa-list" aria-hidden="true"></i><span>列表</span>
        </button>
      </div>
    </div>
  </section>

  <section id="app-module-apps" class="app-overview-apps" data-category="all">
    <div class="app-center-card-grid app-overview-grid"></div>

    <div class="app-overview-list hidden" role="list" aria-label="应用紧凑列表"></div>

    <div id="app-overview-empty" class="app-overview-empty hidden" aria-live="polite">
      <i class="fas fa-layer-group" aria-hidden="true"></i>
      <div class="app-overview-empty-title">当前分类暂无应用</div>
      <p>切回全部应用查看完整矩阵。</p>
    </div>
  </section>
</div>
