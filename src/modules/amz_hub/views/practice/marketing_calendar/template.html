<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.3.2/css/flag-icons.min.css" />

<div class="module-container">
    <!-- Welcome Banner -->
    <div class="wb-container wb-container--simple wb-theme-growth">
        <div class="wb-content">
            <div class="wb-icon">
                <i class="fas fa-calendar-alt"></i>
            </div>
            <div class="wb-title-row">
                <h1 class="wb-title">EU营销日历</h1>
                <span aria-label="促销活动" class="wb-badge wb-badge-hub">
                    <i class="fa-solid fa-gifts"></i>流量涌入
                </span>
            </div>
            <p class="wb-description">
                欧洲全年营销节点、促销时机、备货计划 - 把握每个营销机会
            </p>

            <div class="wb-tags">
                <div class="wb-tag">
                    <div class="wb-tag-dot" style="background-color: #10b981"></div>
                    <span>EU营销日历</span>
                </div>
                <div class="wb-tag">
                    <div class="wb-tag-dot" style="background-color: #f59e0b"></div>
                    <span>按国家/地区</span>
                </div>
                <div class="wb-tag">
                    <div class="wb-tag-dot" style="background-color: #3b82f6"></div>
                    <span>按活动</span>
                </div>
            </div>
        </div>
                <!-- 统计卡片 -->
        <div class="amzf_stats justify-end" id="amzf_stats" style="margin-bottom: 0 !important"></div>
    </div>

    <div class="amzf_controls">

        <!-- 搜索框 -->
        <div class="amzf_search_wrapper">
            <div class="amzf_search_box" id="amzf_search_box">
                <span class="amzf_search_icon"><i class="fas fa-search"></i></span>
                <input type="text" class="amzf_search_input" id="amzf_search" aria-label="搜索节日、国家或关键词"
                    placeholder="搜索节日、国家或关键词... (如: 圣诞, Prime, 德国)" autocomplete="off" />
                <button class="amzf_search_clear" id="amzf_clear" data-action="amzf_clearSearch">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <!-- 搜索历史下拉框 -->
            <div class="amzf_search_history" id="amzf_search_history"></div>
        </div>

        <div class="amzf_view_toggle">
            <button class="amzf_view_btn amzf_active" id="amzf_btn_country" data-action="amzf_switchView"
                data-param="country">
                <i class="fa-solid fa-location-dot"></i> 按国家/地区
            </button>
            <button class="amzf_view_btn" id="amzf_btn_event" data-action="amzf_switchView" data-param="event">
                <i class="fas fa-gifts"></i> 按活动
            </button>
        </div>



        <div class="amzf_country_tabs" id="amzf_country_tabs"></div>
    </div>
    <main class="amzf_main" id="amzf_main"></main>

    <!-- 实操指引：关键动作清单 + 常见误区 -->
    <section class="bg-white rounded-xl border border-emerald-200 p-6 mt-8 mb-6">
        <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
            <i class="fas fa-list-check text-emerald-500"></i>关键动作清单
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm text-slate-700">
            <label class="flex items-start gap-2"><input type="checkbox" class="mt-1 accent-emerald-600"><span>每月初扫描本月营销节点，标记与本品类相关的节日（至少提前4周）。</span></label>
            <label class="flex items-start gap-2"><input type="checkbox" class="mt-1 accent-emerald-600"><span>按国家筛选，重点核对德国/英国/法国三大主力市场节日。</span></label>
            <label class="flex items-start gap-2"><input type="checkbox" class="mt-1 accent-emerald-600"><span>节前6周完成备货入仓（海运周期+清关缓冲）。</span></label>
            <label class="flex items-start gap-2"><input type="checkbox" class="mt-1 accent-emerald-600"><span>节前2周启动Coupon/LD提报，确认促销折后利润≥0。</span></label>
            <label class="flex items-start gap-2"><input type="checkbox" class="mt-1 accent-emerald-600"><span>节前1周加大PPC预算（建议+30%），主推节日关联词。</span></label>
            <label class="flex items-start gap-2"><input type="checkbox" class="mt-1 accent-emerald-600"><span>节后1周内复盘：实际销量 vs 预期、库存周转、ACOS。</span></label>
        </div>
    </section>
    <section class="bg-gradient-to-r from-red-50 to-rose-50 rounded-xl border border-red-200 p-6 mb-6">
        <h2 class="text-lg font-bold text-red-900 mb-4 flex items-center gap-2">
            <i class="fas fa-triangle-exclamation"></i>常见误区
        </h2>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">
            <div class="bg-white p-3 rounded-lg border border-red-200">
                <div class="flex items-start gap-2">
                    <i class="fas fa-xmark text-red-600 text-lg mt-0.5"></i>
                    <div><h4 class="font-bold text-slate-800 text-sm mb-1">全站点统一营销节奏</h4><p class="text-xs text-slate-600">→ 各国节日不同（如母亲节日期差异大），需按国家单独规划广告投放。</p></div>
                </div>
            </div>
            <div class="bg-white p-3 rounded-lg border border-red-200">
                <div class="flex items-start gap-2">
                    <i class="fas fa-xmark text-red-600 text-lg mt-0.5"></i>
                    <div><h4 class="font-bold text-slate-800 text-sm mb-1">节前才备货</h4><p class="text-xs text-slate-600">→ 海运周期4-6周+清关1-2周，必须提前6周完成入仓，否则断货。</p></div>
                </div>
            </div>
            <div class="bg-white p-3 rounded-lg border border-red-200">
                <div class="flex items-start gap-2">
                    <i class="fas fa-xmark text-red-600 text-lg mt-0.5"></i>
                    <div><h4 class="font-bold text-slate-800 text-sm mb-1">忽视小语种节日文案本地化</h4><p class="text-xs text-slate-600">→ 节日关键词必须用目标市场母语，机翻会严重拉低转化率。</p></div>
                </div>
            </div>
            <div class="bg-white p-3 rounded-lg border border-red-200">
                <div class="flex items-start gap-2">
                    <i class="fas fa-xmark text-red-600 text-lg mt-0.5"></i>
                    <div><h4 class="font-bold text-slate-800 text-sm mb-1">把所有节日都当大促做</h4><p class="text-xs text-slate-600">→ 区分"购物类节日"（黑五/Prime Day）与"文化类节日"（圣尼古拉斯节），后者重在场景化文案而非折扣。</p></div>
                </div>
            </div>
        </div>
    </section>
</div>
