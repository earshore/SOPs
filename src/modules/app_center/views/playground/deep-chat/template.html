<div class="playground-page">
  <aside class="playground-thread-rail" aria-label="Deep Chat threads">
    <div class="playground-rail-brand">
      <!-- <span class="playground-logo">
        <i class="far fa-comments"></i>
      </span>
      <span>Deep Chat</span> -->

      <h2 class="text-base font-bold text-slate-800 flex items-center gap-2.5">
        <div
          class="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-500 to-blue-500 flex items-center justify-center shadow-sm shadow-purple-500/20">
          <i class="fa-solid far fa-comments text-white text-xs"></i>
        </div>
        Deep Chat
      </h2>

    </div>

    <button id="playground-clear-chat" class="playground-new-thread" type="button">
      <i class="fas fa-plus"></i>
      <span>New Thread</span>
    </button>

    <div class="playground-thread-list-wrap">
      <div class="playground-thread-list-title">History</div>
      <div id="playground-thread-list" class="playground-thread-list" aria-label="历史会话"></div>
    </div>

    <p id="playground-provider-status" class="playground-provider-status">读取模型配置中...</p>

  </aside>

  <section class="playground-main" aria-label="Deep Chat">
    <header class="playground-topbar">
      <div class="playground-model-area">
        <button class="playground-top-icon" type="button" title="Deep Chat">
          <i class="far fa-window-maximize"></i>
        </button>
        <select id="playground-model-select" class="playground-select" disabled>
          <option value="">default</option>
        </select>
      </div>

      <div class="playground-top-actions">
        <button id="playground-refresh-config" class="playground-top-icon" type="button" title="刷新模型配置">
          <i class="fas fa-rotate"></i>
        </button>
        <details class="playground-tuning-panel">
          <summary title="调试参数">
            <i class="fas fa-sliders"></i>
          </summary>
          <div class="playground-tuning">
            <label class="playground-field playground-field-system" for="playground-system-prompt">
              <span>System</span>
              <textarea id="playground-system-prompt" rows="3"
                placeholder="Optional system prompt for this Deep Chat session"></textarea>
            </label>
            <label class="playground-field playground-field-temperature" for="playground-temperature">
              <span>Temperature <output id="playground-temperature-value">0.3</output></span>
              <input id="playground-temperature" type="range" min="0" max="1" step="0.1" value="0.3">
            </label>
            <button id="playground-reset-tuning" class="playground-reset-tuning" type="button">
              Reset tuning
            </button>
          </div>
        </details>
      </div>
    </header>

    <div class="playground-stage">
      <div class="playground-hero">
        <h2>Hello there!</h2>
        <p>How can I help you today?</p>
      </div>

      <div class="playground-chat-wrap">
        <deep-chat id="playground-chat" class="playground-chat"></deep-chat>
      </div>
    </div>
  </section>
</div>
