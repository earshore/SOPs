<!-- Analysis Module Template -->

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<section class="flex-1 overflow-y-auto pb-20">
    <div class="app-center-container">
        <!-- Analysis Module Welcome -->
        <div class="mb-8">
            <div class="relative rounded-2xl border border-slate-200/60 overflow-hidden bg-white">
                <!-- 背景装饰 -->
                <div class="absolute inset-0 bg-gradient-to-br from-slate-50 via-purple-50/40 to-pink-50/40"></div>
                <div class="absolute top-0 right-0 w-96 h-96 bg-gradient-to-br from-purple-100/30 to-pink-200/25 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>
                <div class="absolute bottom-0 left-0 w-72 h-72 bg-gradient-to-tr from-fuchsia-100/30 to-purple-100/20 rounded-full blur-3xl translate-y-1/2 -translate-x-1/4"></div>
                <div class="absolute inset-0 opacity-[0.02]" style="background-image: radial-gradient(circle, #9333ea 1px, transparent 1px); background-size: 24px 24px;"></div>

                <!-- 浮动粒子 -->
                <div class="absolute top-8 right-24 w-2 h-2 rounded-full bg-purple-300/50 animate-pulse"></div>
                <div class="absolute top-20 right-52 w-1.5 h-1.5 rounded-full bg-pink-300/40 animate-pulse" style="animation-delay: 0.5s;"></div>
                <div class="absolute bottom-10 right-36 w-1 h-1 rounded-full bg-fuchsia-400/50 animate-pulse" style="animation-delay: 1s;"></div>
                <div class="absolute top-14 left-1/4 w-1.5 h-1.5 rounded-full bg-purple-300/30 animate-pulse" style="animation-delay: 1.4s;"></div>

                <div class="relative z-10 p-8 md:p-10">
                    <div class="flex items-start gap-5">
                        <!-- Icon -->
                        <div class="relative flex-shrink-0">
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-600 flex items-center justify-center shadow-lg shadow-purple-500/25">
                                <i class="fas fa-chart-line text-[22px] text-white"></i>
                            </div>
                            <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-indigo-500 border-2 border-white flex items-center justify-center">
                                <i class="fas fa-magic text-[7px] text-white"></i>
                            </div>
                        </div>

                        <!-- Content -->
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-3 mb-2">
                                <h2 class="text-xl font-bold text-slate-800 tracking-tight">深度分析评审Listing文案</h2>
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-gradient-to-r from-emerald-500 to-teal-500 text-white shadow-sm">
                                    <i class="fas fa-microchip mr-1 text-[8px]"></i>STEP 3
                                </span>
                            </div>
                            <p class="text-slate-500 text-sm leading-relaxed">
                                基于大模型的多维分析,生成包含SEO覆盖、COSMO意图和 Rufus AI 预判 的评审的专业报告,指出文案致命问题,提出 Top 3 改写建议,助您通过数据驱动决策。
                            </p>

                            <!-- Quick Tags -->
                            <div class="flex items-center gap-5 mt-4">
                                <div class="flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 rounded-full bg-purple-400"></div>
                                    <span class="text-xs text-slate-400">SEO 覆盖</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 rounded-full bg-pink-400"></div>
                                    <span class="text-xs text-slate-400">COSMO 意图</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 rounded-full bg-fuchsia-400"></div>
                                    <span class="text-xs text-slate-400">Rufus AI</span>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <div class="w-1.5 h-1.5 rounded-full bg-indigo-400"></div>
                                    <span class="text-xs text-slate-400">改写建议</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI 深度诊断 -->
        <div class="app-center-card mb-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-user-doctor text-purple-500"></i> 
                    AI 评审
                    <span class="text-xs bg-purple-100 text-purple-600 px-2 py-1 rounded-full ml-2">仅供参考</span>
                </h2>

                <button id="kt-analyze-btn" onclick="window.kt_runLLMAnalysis()" disabled
                    class="px-4 py-2 bg-purple-600 text-white hover:bg-purple-700 rounded-lg text-sm font-medium transition-all shadow-sm flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fas fa-magic"></i> 
                    生成报告
                </button>
            </div>

            <div id="kt-llm-analysis-result"
                class="min-h-[200px] bg-slate-50 rounded-xl p-6 markdown-content border border-slate-200">
                <div class="flex flex-col items-center justify-center py-12 text-slate-400 gap-3">
                    <i class="fas fa-sparkles text-4xl opacity-30"></i>
                    <p class="text-sm">点击上方按钮，让 AI 为您生成深度诊断报告</p>
                </div>
            </div>
        </div>
    </div>
</section>
