<!-- AI智能分析模块 -->

  <!-- Welcome Banner -->

    <div class="relative rounded-2xl border border-slate-200/60 overflow-hidden bg-white">

      <div class="absolute bottom-0 left-0 w-72 h-72 bg-gradient-to-tr from-purple-100/40 to-indigo-100/20 rounded-full blur-3xl translate-y-1/2 -translate-x-1/4"></div>
      
      <!-- 动态网格装饰 -->

      <div class="absolute top-16 right-48 w-1.5 h-1.5 rounded-full bg-purple-300/50 animate-pulse" style="animation-delay: 0.5s;"></div>
      <div class="absolute bottom-12 right-36 w-1 h-1 rounded-full bg-pink-300/60 animate-pulse" style="animation-delay: 1s;"></div>

      <div class="relative z-10 p-8 md:p-10">
        <div class="flex items-start gap-5">
          <!-- Icon -->
          <div class="relative flex-shrink-0">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25">
              <i class="fa-solid fa-brain text-[22px] text-white"></i>
            </div>
            <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-emerald-400 border-2 border-white flex items-center justify-center">
              <i class="fa-solid fa-microchip text-[8px] text-white"></i>
            </div>
          </div>
          <!-- Content -->
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-3 mb-2">
              <h2 class="text-xl font-bold text-slate-800 tracking-tight">
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">AI</span> 
                智能分析</h2>
              <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold bg-gradient-to-r from-indigo-500 to-purple-500 text-white shadow-sm">
                <i class="fa-solid fa-circle-up mr-1 text-[8px]"></i>PRO
              </span>
            </div>
            <p class="text-slate-500 text-sm leading-relaxed max-w-2xl">
              基于大语言模型的 Listings & Reviews 深度洞察，从标题关键词到用户评论，全方位解构产品竞争力。
            </p>
            
            <!-- Quick Stats -->
            <div class="flex items-center gap-5 mt-4">
              <div class="flex items-center gap-1.5">
                <div class="w-1.5 h-1.5 rounded-full bg-indigo-400"></div>
                <span class="text-xs text-slate-400">支持 <span class="font-semibold text-slate-600">Listings & Reviews</span> 分析维度</span>
              </div>
              <div class="flex items-center gap-1.5">
                <div class="w-1.5 h-1.5 rounded-full bg-purple-400"></div>
                <span class="text-xs text-slate-400">AI 大模型驱动</span>
              </div>
              <div class="flex items-center gap-1.5">
                <div class="w-1.5 h-1.5 rounded-full bg-emerald-400"></div>
                <span class="text-xs text-slate-400">一键导出报告</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="ai-main-content">

    <!-- 数据源横幅 -->
    <div class="mb-6 flex items-center gap-4 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 rounded-xl border border-indigo-100">
      <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center">
        <i class="fa-solid fa-database text-indigo-600"></i>
      </div>
      <div class="flex-1">
        <template x-if="hasScraperData">
          <div>
            <p class="text-sm text-slate-700">
              <span class="font-semibold">数据源已加载：</span>
              <span x-text="'包含 ' + currentProducts.length + ' 个产品，共 ' + currentProducts.reduce((sum, p) => sum + p.customer_reviews.length, 0) + ' 条评论'"></span>
            </p>
            <p class="text-xs text-slate-500 mt-0.5">
              <i class="fa-solid fa-globe"></i>
              <span x-text="'市场: ' + dataSourceMarketplace + ' · 抓取时间: ' + dataSourceTimestamp"></span>
            </p>
          </div>
        </template>
        <template x-if="!hasScraperData">
          <div>
            <p class="text-sm text-slate-700">
              <span class="font-semibold">数据源已加载：</span>
              <span>包含产品数据和评论</span>
            </p>
            <p class="text-xs text-slate-500 mt-0.5">
              <i class="fa-solid fa-globe"></i>
              可从"数据采集"模块获取真实产品数据
            </p>
          </div>
        </template>
      </div>
    </div>

    <!-- ASIN 选择和分析目标 -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-8">
      
      <!-- ASIN 输入区 -->
      <div class="lg:col-span-4">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 h-full">
          <div class="flex items-center gap-4 mb-5">
            <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
              <i class="fa-solid fa-barcode text-white"></i>
            </div>
            <div>
              <h2 class="text-lg font-semibold text-slate-800">产品 ASIN</h2>
              <p class="text-sm text-slate-500">选择或输入产品标识符</p>
            </div>
          </div>

          <!-- ASIN 选择区域 -->
          <div class="relative">
            <div class="flex items-center justify-between mb-3">
              <label class="text-sm font-semibold text-slate-700">选择产品 ASIN</label>
              <div class="flex items-center gap-2">
                <button @click="selectAllAsins()" :disabled="isAnalyzing" class="text-xs text-indigo-600 hover:text-indigo-700 font-medium">全选</button>
                <span class="text-slate-300">|</span>
                <button @click="clearAllAsins()" :disabled="isAnalyzing" class="text-xs text-slate-500 hover:text-slate-700 font-medium">清空</button>
              </div>
            </div>
            <div x-show="hasData" class="mb-2">
              <span class="flex items-center gap-1.5 bg-emerald-50 text-emerald-600 text-xs px-3 py-1.5 rounded-full font-medium border border-emerald-100 inline-flex">
                <i class="fa-solid fa-circle-check"></i>
                已选择 <span x-text="selectedAsins.length"></span> 个产品
              </span>
            </div>
          </div>

          <!-- 产品信息摘要 -->
          <template x-if="currentProducts.length > 0">
            <div class="mt-4 p-4 bg-gradient-to-r from-slate-50 to-indigo-50/50 rounded-xl border border-slate-100">
              <h4 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
                <i class="fa-solid fa-box-open"></i>
                已选产品信息
              </h4>
              <div class="space-y-2">
                <template x-for="product in currentProducts.slice(0, 2)" :key="product.asin">
                  <div class="text-xs">
                    <span class="font-mono text-indigo-600 font-semibold" x-text="product.asin"></span>
                    <p class="text-slate-600 line-clamp-1 mt-0.5" x-text="product.productTitle"></p>
                  </div>
                </template>
                <template x-if="currentProducts.length > 2">
                  <p class="text-xs text-slate-500 italic">
                    还有 <span x-text="currentProducts.length - 2"></span> 个产品...
                  </p>
                </template>
              </div>
              <div class="flex items-center gap-4 mt-3 text-xs text-slate-500 pt-2 border-t border-slate-200">
                <span class="flex items-center gap-1">
                  <i class="fa-solid fa-list text-blue-500"></i>
                  <span x-text="currentProducts.reduce((sum, p) => sum + p.feature_bullets.length, 0)"></span> 个卖点
                </span>
                <span class="flex items-center gap-1">
                  <i class="fa-solid fa-comments text-amber-500"></i>
                  <span x-text="currentProducts.reduce((sum, p) => sum + p.customer_reviews.length, 0)"></span> 条评论
                </span>
              </div>
            </div>
          </template>

          <!-- 可用 ASIN 列表（复选框） -->
          <template x-if="availableAsins.length > 0">
            <div class="mt-4 pt-4 border-t border-slate-100">
              <p class="text-xs text-slate-500 mb-3 font-medium">已加载的产品（<span x-text="availableAsins.length"></span> 个）：</p>
              <div class="space-y-2 max-h-48 overflow-y-auto">
                <template x-for="asinItem in availableAsins" :key="asinItem">
                  <label class="flex items-center gap-3 p-3 rounded-lg border-2 transition-all cursor-pointer hover:bg-indigo-50"
                         :class="selectedAsins.includes(asinItem) ? 'bg-indigo-50 border-indigo-300' : 'bg-slate-50 border-slate-200 hover:border-indigo-200'">
                    <input 
                      type="checkbox" 
                      :checked="selectedAsins.includes(asinItem)"
                      @change="toggleAsin(asinItem)"
                      :disabled="isAnalyzing"
                      class="w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500"
                    />
                    <span class="flex-1 font-mono text-sm font-semibold"
                          :class="selectedAsins.includes(asinItem) ? 'text-indigo-700' : 'text-slate-700'"
                          x-text="asinItem"></span>
                    <i x-show="selectedAsins.includes(asinItem)" class="fa-solid fa-check text-indigo-600"></i>
                  </label>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>

      <!-- 分析目标选择区 -->
      <div class="lg:col-span-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/60 p-6 h-full">
          <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-600 rounded-xl flex items-center justify-center shadow-lg shadow-purple-200">
                <i class="fa-solid fa-check-double text-white"></i>
              </div>
              <div>
                <h2 class="text-lg font-semibold text-slate-800">选择分析目标</h2>
                <p class="text-sm text-slate-500">选择需要执行的 AI 分析维度</p>
              </div>
            </div>
            <div class="flex gap-3">
              <button @click="selectAllTargets()" :disabled="isAnalyzing" class="flex items-center gap-1.5 text-sm text-indigo-600 hover:text-indigo-700 font-medium transition-colors">
                <i class="fa-solid fa-check-double"></i>
                全选
              </button>
              <span class="text-slate-300">|</span>
              <button @click="clearAllTargets()" :disabled="isAnalyzing" class="flex items-center gap-1.5 text-sm text-slate-500 hover:text-slate-700 font-medium transition-colors">
                <i class="fa-solid fa-xmark"></i>
                清空
              </button>
            </div>
          </div>

          <!-- Listings 分析 -->
          <div class="mb-6">
            <div class="flex items-center gap-2 mb-4">
              <div class="flex items-center gap-2 bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1.5 rounded-full border border-blue-100">
                <i class="fa-solid fa-box-open"></i>
                Listings 分析
              </div>
              <span class="text-xs text-slate-400">基于标题与五点描述</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <template x-for="target in analysisTargets.filter(t => t.source === 'Listings')" :key="target.id">
                <button
                  @click="toggleTarget(target.id)"
                  :disabled="isAnalyzing"
                  class="relative p-4 rounded-xl border-2 text-left transition-all duration-200 group hover:shadow-md"
                  :class="selectedTargets.includes(target.id) ? 'border-blue-300 bg-blue-50 shadow-sm' : 'border-slate-100 bg-slate-50/50 hover:border-slate-200 hover:bg-white'"
                >
                  <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 transition-all"
                         :class="selectedTargets.includes(target.id) ? 'bg-blue-50' : 'bg-slate-100 group-hover:bg-slate-200'">
                      <i :class="target.icon + ' text-blue-600'"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <h4 class="font-semibold text-sm text-slate-800" x-text="target.name"></h4>
                      <p class="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed" x-text="target.description"></p>
                    </div>
                    <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all mt-0.5"
                         :class="selectedTargets.includes(target.id) ? 'border-indigo-500 bg-indigo-500' : 'border-slate-300 group-hover:border-slate-400'">
                      <i x-show="selectedTargets.includes(target.id)" class="fa-solid fa-check text-white text-[10px]"></i>
                    </div>
                  </div>
                </button>
              </template>
            </div>
          </div>

          <!-- Reviews 分析 -->
          <div>
            <div class="flex items-center gap-2 mb-4">
              <div class="flex items-center gap-2 bg-amber-50 text-amber-700 text-xs font-semibold px-3 py-1.5 rounded-full border border-amber-100">
                <i class="fa-solid fa-star"></i>
                Reviews 分析
              </div>
              <span class="text-xs text-slate-400">基于用户评论数据</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              <template x-for="target in analysisTargets.filter(t => t.source === 'Reviews')" :key="target.id">
                <button
                  @click="toggleTarget(target.id)"
                  :disabled="isAnalyzing"
                  class="relative p-4 rounded-xl border-2 text-left transition-all duration-200 group hover:shadow-md"
                  :class="selectedTargets.includes(target.id) ? 'border-amber-300 bg-amber-50 shadow-sm' : 'border-slate-100 bg-slate-50/50 hover:border-slate-200 hover:bg-white'"
                >
                  <div class="flex items-start gap-3">
                    <div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0 transition-all"
                         :class="selectedTargets.includes(target.id) ? 'bg-amber-50' : 'bg-slate-100 group-hover:bg-slate-200'">
                      <i :class="target.icon + ' text-amber-600'"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                      <h4 class="font-semibold text-sm text-slate-800" x-text="target.name"></h4>
                      <p class="text-xs text-slate-500 mt-1 line-clamp-2 leading-relaxed" x-text="target.description"></p>
                    </div>
                    <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 transition-all mt-0.5"
                         :class="selectedTargets.includes(target.id) ? 'border-indigo-500 bg-indigo-500' : 'border-slate-300 group-hover:border-slate-400'">
                      <i x-show="selectedTargets.includes(target.id)" class="fa-solid fa-check text-white text-[10px]"></i>
                    </div>
                  </div>
                </button>
              </template>
            </div>
          </div>

          <!-- 选择摘要 -->
          <div class="mt-6 pt-5 border-t border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <span class="text-sm text-slate-500">
                已选择 <span class="font-bold text-indigo-600 text-base" x-text="selectedTargets.length"></span> / <span x-text="analysisTargets.length"></span> 个分析目标
              </span>
            </div>
            <template x-if="selectedTargets.length > 0">
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">已选：</span>
                <div class="flex -space-x-2">
                  <template x-for="(targetId, index) in selectedTargets.slice(0, 5)" :key="targetId">
                    <div class="w-8 h-8 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-full flex items-center justify-center border-2 border-white shadow-sm">
                      <i :class="analysisTargets.find(t => t.id === targetId).icon + ' text-indigo-600 text-xs'"></i>
                    </div>
                  </template>
                  <template x-if="selectedTargets.length > 5">
                    <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center border-2 border-white text-xs font-medium text-slate-600">
                      +<span x-text="selectedTargets.length - 5"></span>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <!-- 提示词预览面板 -->
    <template x-if="selectedTargets.length > 0 && currentProducts.length > 0">
      <div class="mb-8">
        <button @click="togglePromptPanel()" class="flex items-center gap-2 text-sm text-slate-600 hover:text-indigo-600 transition-colors mb-4">
          <i class="fa-solid fa-code"></i>
          <span class="font-medium" x-text="(showPromptPanel ? '隐藏' : '查看') + ' AI 提示词模板'"></span>
          <span class="text-xs bg-slate-100 px-2 py-0.5 rounded-full text-slate-500" x-text="selectedTargets.length + ' 个任务'"></span>
          <i :class="'fa-solid fa-chevron-' + (showPromptPanel ? 'up' : 'down')"></i>
        </button>
        
        <template x-if="showPromptPanel">
          <div class="space-y-3 animate-fade-in-up">
            <template x-for="(targetId, index) in selectedTargets" :key="targetId">
              <div class="bg-slate-900 rounded-xl overflow-hidden border border-slate-700">
                <button @click="togglePromptItem(index)" class="w-full flex items-center justify-between p-4 hover:bg-slate-800/50 transition-colors">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-emerald-500/20 rounded-lg flex items-center justify-center">
                      <i class="fa-solid fa-terminal text-emerald-400"></i>
                    </div>
                    <div class="text-left">
                      <h4 class="text-sm font-semibold text-white">AI 分析提示词</h4>
                      <p class="text-xs text-slate-400" x-text="analysisTargets.find(t => t.id === targetId).name"></p>
                    </div>
                  </div>
                  <div class="flex items-center gap-3">
                    <i :class="'fa-solid fa-chevron-' + (expandedPromptIndex === index ? 'up' : 'down') + ' text-slate-400'"></i>
                  </div>
                </button>
                <template x-if="expandedPromptIndex === index">
                  <div class="border-t border-slate-700">
                    <div class="flex items-center justify-between px-4 py-2 bg-slate-800/50">
                      <div class="flex items-center gap-2 text-xs text-slate-400">
                        <i class="fa-solid fa-file-code"></i>
                        <span>Prompt Template</span>
                      </div>
                      <button @click.stop="copyPrompt(index)" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-700 text-slate-300 hover:bg-slate-600 transition-all">
                        <i class="fa-solid fa-copy"></i>
                        复制
                      </button>
                    </div>
                    <div class="p-4 max-h-96 overflow-auto">
                      <pre class="text-xs text-slate-300 font-mono whitespace-pre-wrap leading-relaxed" x-text="getPromptText(targetId)"></pre>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </template>
      </div>
    </template>

    <!-- 数据源切换 - 已隐藏，强制使用真实数据 -->
    <div class="mb-6 hidden">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center">
          <i class="fa-solid fa-toggle-on text-white"></i>
        </div>
        <div>
          <h3 class="text-sm font-semibold text-slate-800">分析模式</h3>
          <p class="text-xs text-slate-500">
            <span x-show="useRealData">使用真实数据调用 AI 分析</span>
            <span x-show="!useRealData">使用示例数据模拟分析</span>
          </p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 text-xs">
          <span class="text-slate-500" :class="!useRealData ? 'font-semibold text-slate-700' : ''">示例数据</span>
          <button
            @click="toggleDataSource()"
            :disabled="isAnalyzing"
            class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
            :class="useRealData ? 'bg-indigo-600' : 'bg-slate-300'"
          >
            <span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform"
                  :class="useRealData ? 'translate-x-6' : 'translate-x-1'"></span>
          </button>
          <span class="text-slate-500" :class="useRealData ? 'font-semibold text-slate-700' : ''">真实数据</span>
        </div>
        <template x-if="useRealData && !hasScraperData">
          <div class="flex items-center gap-1.5 text-xs text-amber-600 bg-amber-50 px-3 py-1.5 rounded-full border border-amber-200">
            <i class="fa-solid fa-exclamation-triangle"></i>
            <span>请先从数据采集导入数据</span>
          </div>
        </template>
        <template x-if="useRealData && hasScraperData">
          <div class="flex items-center gap-1.5 text-xs text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200">
            <i class="fa-solid fa-check-circle"></i>
            <span x-text="'数据源: ' + dataSourceLabel"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- 分析按钮 -->
    <div class="mb-10">
      <div class="relative overflow-hidden rounded-2xl shadow-xl">
        <div class="absolute inset-0 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600"></div>
        <div class="absolute inset-0 overflow-hidden">
          <div class="absolute top-0 left-1/4 w-80 h-80 bg-white/20 rounded-full filter blur-[80px] animate-pulse"></div>
          <div class="absolute bottom-0 right-1/4 w-64 h-64 bg-pink-300/20 rounded-full filter blur-[60px]"></div>
        </div>
        <div class="absolute inset-0 opacity-5" style="background-image: linear-gradient(rgba(255,255,255,.2) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.2) 1px, transparent 1px); background-size: 30px 30px;"></div>
        
        <div class="relative p-8">
          <div class="flex items-center justify-between gap-8">
            <div class="flex items-center gap-5 text-white">

                  <!-- 核心发现 -->

                    <div class="flex items-center gap-2 mb-4">
                      <div class="w-6 h-6 bg-amber-100 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-lightbulb text-amber-600"></i>
                      </div>
                      <span class="text-xs font-bold text-slate-600 uppercase tracking-wider">核心发现</span>
                    </div>
                    <div class="space-y-2.5">
                      <template x-for="highlight in result.highlights" :key="highlight.text">
                        <div class="relative flex items-start gap-3 px-4 py-3 rounded-xl text-sm font-medium border transition-all hover:shadow-md"
                             :class="{
                               'bg-gradient-to-r from-red-50 to-rose-50 text-red-700 border-red-200': highlight.type === 'danger',
                               'bg-gradient-to-r from-emerald-50 to-green-50 text-emerald-700 border-emerald-200': highlight.type === 'success',
                               'bg-gradient-to-r from-amber-50 to-orange-50 text-amber-700 border-amber-200': highlight.type === 'warning',
                               'bg-gradient-to-r from-blue-50 to-indigo-50 text-blue-700 border-blue-200': highlight.type === 'info'
                             }">
                          <i class="fa-solid mt-0.5 flex-shrink-0"
                             :class="{
                               'fa-circle-exclamation text-red-500': highlight.type === 'danger',
                               'fa-circle-check text-emerald-500': highlight.type === 'success',
                               'fa-triangle-exclamation text-amber-500': highlight.type === 'warning',
                               'fa-circle-info text-blue-500': highlight.type === 'info'
                             }"></i>
                          <span class="leading-relaxed" x-text="highlight.text"></span>
                        </div>
                      </template>
                    </div>
                  </div>
                  
                  <!-- 详细分析 -->
                  <div class="p-5">
                    <div class="flex items-center gap-2 mb-4">
                      <div class="w-6 h-6 bg-slate-100 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-list text-slate-600"></i>
                      </div>
                      <span class="text-xs font-bold text-slate-600 uppercase tracking-wider">详细分析</span>
                    </div>
                    <div class="space-y-5">
                      <template x-for="detail in result.details" :key="detail.category">
                        <div>
                          <span class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-full mb-3"
                                :class="'bg-' + result.color + '-50 text-' + result.color + '-700'">
                            <i class="fa-solid fa-quote-left opacity-60"></i>
                            <span x-text="detail.category"></span>
                          </span>
                          <div class="flex flex-wrap gap-2">
                            <template x-for="item in detail.items" :key="item">
                              <span class="inline-block px-3 py-2 bg-slate-50 text-slate-700 text-xs rounded-lg hover:bg-indigo-50 hover:text-indigo-700 transition-colors cursor-default border border-slate-100 hover:border-indigo-200 font-medium"
                                    x-text="item"></span>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- 空状态 -->
    <template x-if="results.length === 0 && !isAnalyzing">
      <div class="text-center py-20">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-gradient-to-br from-slate-100 to-slate-200 rounded-2xl mb-8 shadow-inner">
          <i class="fa-solid fa-lightbulb text-slate-400 text-4xl"></i>
        </div>
        <h3 class="text-2xl font-bold text-slate-700 mb-3">准备开始智能分析</h3>
        <p class="text-slate-500 max-w-lg mx-auto leading-relaxed">
          选择分析目标并确认 ASIN，点击"开始分析"按钮，<br />
          AI 将自动提取 Listings 和 Reviews 中的关键洞察
        </p>
        <div class="mt-10 flex items-center justify-center gap-8">
          <div class="flex items-center gap-3 text-slate-500">
            <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center border border-blue-200">
              <i class="fa-solid fa-box-open text-blue-600"></i>
            </div>
            <div class="text-left">
              <div class="font-semibold text-slate-700">Listings 分析</div>
              <div class="text-xs text-slate-400">标题与卖点洞察</div>
            </div>
          </div>
          <div class="w-px h-10 bg-slate-200"></div>
          <div class="flex items-center gap-3 text-slate-500">
            <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center border border-amber-200">
              <i class="fa-solid fa-star text-amber-600"></i>
            </div>
            <div class="text-left">
              <div class="font-semibold text-slate-700">Reviews 分析</div>
              <div class="text-xs text-slate-400">用户评论深度挖掘</div>
            </div>
          </div>
        </div>
      </div>
    </template>

  </main>

</div>
