<!-- Input Module Template -->

<section id="kt-module-input" class="flex-1 overflow-y-auto pb-20">
    <div class="app-center-container">
        <!-- Input Module Welcome -->
        <div class="mb-6">
            <div
                class="bg-gradient-to-br from-slate-50 via-blue-50/30 to-purple-50/30 rounded-2xl border border-slate-200/60 p-8 relative overflow-hidden">
                <div
                    class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-blue-100/30 to-purple-100/40 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2">
                </div>
                <div
                    class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-indigo-100/30 to-blue-100/30 rounded-full blur-2xl translate-y-1/3 -translate-x-1/3">
                </div>
                <div class="relative z-10">
                    <div class="flex items-start gap-6">
                        <div
                            class="app-center-icon-container bg-gradient-to-br from-blue-500 to-indigo-600 shadow-lg shadow-blue-500/20">
                            <i class="fas fa-keyboard text-white"></i>
                        </div>
                        <div class="flex-1">
                            <h2 class="text-xl font-bold text-slate-800 mb-2">关键词提取与管理</h2>
                            <p class="text-slate-600 text-sm leading-relaxed max-w-xl">
                                输入或粘贴关键词,系统将自动进行去重、格式化处理,为您准备高质量的分析数据源。
                            </p>
                        </div>
                    </div>
                    <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div
                            class="flex items-center gap-3 bg-white/60 backdrop-blur-sm rounded-xl px-4 py-3 border border-slate-200/50">
                            <span
                                class="w-7 h-7 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center text-xs font-bold">1</span>
                            <span class="text-sm text-slate-600">输入关键词、目标Listing文案</span>
                        </div>
                        <div
                            class="flex items-center gap-3 bg-white/60 backdrop-blur-sm rounded-xl px-4 py-3 border border-slate-200/50">
                            <span
                                class="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs font-bold">2</span>
                            <span class="text-sm text-slate-600">清理格式</span>
                        </div>
                        <div
                            class="flex items-center gap-3 bg-white/60 backdrop-blur-sm rounded-xl px-4 py-3 border border-slate-200/50">
                            <span
                                class="w-7 h-7 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-xs font-bold">3</span>
                            <span class="text-sm text-slate-600">开始分析</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 kt-input-grid">
            <!-- Keywords Input (1/3) -->
            <div class="lg:col-span-1 kt-input-card">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                    </svg>
                    关键词列表
                </h2>
                <button id="kt-btn-clean-kw"
                    class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-sm font-medium smooth-transition">
                    <i class="fas fa-broom mr-1"></i> 清理格式
                </button>
            </div>
            <div class="relative kt-textarea-container">
                <div class="keyword-input-wrapper">
                    <div id="kt-keyword-highlight-layer" class="keyword-input-highlight"></div>
                    <textarea id="kt-keywords-input"
                        class="keyword-input-textarea w-full p-4 pb-10 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm scrollbar-thin"
                        placeholder="请输入关键词列表，每行一个关键词&#10;支持欧洲全语种（DE/FR/IT/ES/NL/PL/SE等）&#10;示例：&#10;wireless earbuds&#10;bluetooth headphones&#10;noise cancelling earphones"></textarea>
                </div>
                <div class="absolute bottom-3 right-3 z-10 flex gap-2">
                    <span class="px-2 py-1 bg-blue-100 text-blue-700 rounded-full font-medium text-xs">
                        Total: <span id="kt-keyword-count">0</span>
                    </span>
                    <span id="kt-duplicate-badge"
                        class="px-2 py-1 bg-amber-100 text-amber-700 rounded-full font-medium text-xs hidden">
                        Repeat: <span id="kt-duplicate-count">0</span>
                    </span>
                </div>
            </div>
        </div>

            <!-- Copy Input (2/3) -->
            <div class="lg:col-span-2 kt-input-card">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-800 flex items-center gap-2">
                    <i class="fas fa-file-alt text-green-500"></i> 目标Listing文案
                </h2>
                <div class="flex items-center gap-2">
                    <button id="kt-btn-clean-copy"
                        class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-sm font-medium smooth-transition">
                        <i class="fas fa-broom mr-1"></i> 清理格式
                    </button>
                    <button id="kt-btn-paste"
                        class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-sm font-medium smooth-transition">
                        <i class="fas fa-paste mr-1"></i> 从剪贴板粘贴
                    </button>
                    <button id="kt-btn-clear-copy"
                        class="px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg text-sm font-medium smooth-transition">
                        <i class="fa-solid fa-trash-can"></i> 清空
                    </button>
                    <button id="kt-btn-start-analysis"
                        class="px-4 py-2 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white rounded-xl text-sm font-medium shadow-md hover:shadow-lg smooth-transition flex items-center gap-2">
                        <i class="fas fa-play text-xs"></i> 开始分析
                    </button>
                </div>
            </div>
            <div class="textarea-wrapper relative kt-textarea-container">
                <textarea id="kt-copy-input"
                    class="w-full h-full p-4 pb-10 border border-gray-200 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-transparent text-sm scrollbar-thin"
                    placeholder="请粘贴您的Amazon产品文案&#10;包括标题、五点描述、产品描述等&#10;&#10;示例：&#10;【Premium Wireless Earbuds】Experience crystal-clear sound with our Bluetooth headphones featuring advanced noise cancelling technology..."></textarea>
                <div class="textarea-stats">
                    <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full font-medium text-xs">
                        字符: <span id="copy-char-count">0</span>
                    </span>
                </div>
            </div>
            </div>
        </div>
    </div>
</section>
