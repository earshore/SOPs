name: Quality Gate

on:
  push:
    branches: [main, develop, branch2-21]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: type-check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test type check
        run: npm run type-check:tests

  lint-warning-gate:
    name: lint warning gate
    runs-on: windows-latest
    needs: type-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Test ESLint
        run: npm run lint:tests

      - name: ESLint warning baseline gate
        run: npm run lint:warning-gate

      - name: Format check
        run: npm run format:check

  unit:
    name: unit
    runs-on: windows-latest
    needs: lint-warning-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Check coverage threshold
        shell: pwsh
        run: |
          $coverage = Get-Content './coverage/coverage-summary.json' -Raw | ConvertFrom-Json
          $threshold = 60
          $lines = $coverage.total.lines.pct
          $statements = $coverage.total.statements.pct
          Write-Host "Line coverage: $lines%"
          Write-Host "Statement coverage: $statements%"
          if ($lines -lt $threshold -or $statements -lt $threshold) {
            Write-Error "Coverage is below the $threshold% threshold."
            exit 1
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: build
    runs-on: windows-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/index.html')) {
            Write-Error 'Missing dist/index.html.'
            exit 1
          }
          if (!(Test-Path 'dist/assets')) {
            Write-Error 'Missing dist/assets.'
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          retention-days: 7

  smoke-e2e:
    name: smoke e2e
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run smoke E2E
        run: npx playwright test tests/startup --project=chromium

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-e2e-report
          path: |
            tests/playwright-report/
            test-results/
          retention-days: 30

  performance:
    name: performance
    runs-on: windows-latest
    needs: smoke-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run performance tests
        run: npx playwright test tests/performance/ai-analysis-performance.test.ts tests/performance/promptlab-performance.test.ts tests/performance/scraper-performance.test.ts --project=chromium

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: |
            tests/playwright-report/
            test-results/
            .lighthouseci/
            tests/performance/lighthouse-reports/
            performance-*.json
          retention-days: 30

  npm-audit:
    name: npm audit
    runs-on: windows-latest
    needs: performance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  required:
    name: required
    runs-on: windows-latest
    needs:
      - type-check
      - lint-warning-gate
      - unit
      - build
      - smoke-e2e
      - performance
      - npm-audit
    if: always()

    steps:
      - name: Check required gate results
        shell: pwsh
        run: |
          $results = @{
            'type-check' = '${{ needs['type-check'].result }}'
            'lint warning gate' = '${{ needs['lint-warning-gate'].result }}'
            'unit' = '${{ needs.unit.result }}'
            'build' = '${{ needs.build.result }}'
            'smoke e2e' = '${{ needs['smoke-e2e'].result }}'
            'performance' = '${{ needs.performance.result }}'
            'npm audit' = '${{ needs['npm-audit'].result }}'
          }

          Add-Content $env:GITHUB_STEP_SUMMARY '## Quality Gate'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY '| Check | Result |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| --- | --- |'

          foreach ($entry in ($results.GetEnumerator() | Sort-Object Name)) {
            Write-Host "$($entry.Name): $($entry.Value)"
            Add-Content $env:GITHUB_STEP_SUMMARY "| $($entry.Name) | $($entry.Value) |"
          }

          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -ne 'success' })
          if ($failed.Count -gt 0) {
            $failedNames = ($failed | ForEach-Object { $_.Name }) -join ', '
            Write-Error "Quality gate failed: $failedNames"
            exit 1
          }

          Write-Host 'Quality gate passed.'
