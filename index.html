<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- T1-2: pre-paint color mode (blocking; external for script-src 'self' CSP) -->
    <script src="/theme-bootstrap.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Amazing Amazon Architect 是面向亚马逊运营团队的 SOP 管理与 AI 分析工作台。"
    />
    <title>Amazing Amazon Architect</title>

    <!-- CSP已移至HTTP响应头 (public/_headers) 以避免DOM操作导致的问题 -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234285F4'/%3E%3Cstop offset='50%25' stop-color='%239B72F2'/%3E%3Cstop offset='100%25' stop-color='%23D96570'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='12' cy='12' r='1' stroke='url(%23g)'/%3E%3Cpath stroke='url(%23g)' d='M20.2 20.2c2.04-2.03.02-7.36-4.5-11.9-4.54-4.52-9.87-6.54-11.9-4.5-2.04 2.03-.02 7.36 4.5 11.9 4.54 4.52 9.87 6.54 11.9 4.5Z'/%3E%3Cpath stroke='url(%23g)' d='M15.7 15.7c4.52-4.54 6.54-9.87 4.5-11.9-2.03-2.04-7.36-.02-11.9 4.5-4.52 4.54-6.54 9.87-4.5 11.9 2.03 2.04 7.36.02 11.9-4.5Z'/%3E%3C/svg%3E"
    />

    <!-- 首屏关键样式：必须在 JS 启动前加载，避免导航骨架首帧闪现 -->
    <link rel="stylesheet" href="/src/css/critical.css" />

    <!-- 外部样式由 Vite 通过 /src/main.ts 统一注入 -->
  </head>

  <body>
    <!-- ========== Header ========== -->
    <header class="header">
      <div class="header-inner">
        <!-- ===== Logo ===== -->
        <button type="button" data-action="switch-tab" data-tab="home" class="logo-button">
          <div class="logo-icon-wrapper">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="32"
              height="32"
              viewBox="0 0 24 24"
              fill="none"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <defs>
                <linearGradient id="gemini-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#6366f1" stop-opacity="1" />
                  <stop offset="50%" stop-color="#a855f7" stop-opacity="1" />
                  <stop offset="100%" stop-color="#ec4899" stop-opacity="1" />
                </linearGradient>
              </defs>
              <circle cx="12" cy="12" r="1" stroke="url(#gemini-gradient)"></circle>
              <path
                stroke="url(#gemini-gradient)"
                d="M20.2 20.2c2.04-2.03.02-7.36-4.5-11.9-4.54-4.52-9.87-6.54-11.9-4.5-2.04 2.03-.02 7.36 4.5 11.9 4.54 4.52 9.87 6.54 11.9 4.5Z"
              ></path>
              <path
                stroke="url(#gemini-gradient)"
                d="M15.7 15.7c4.52-4.54 6.54-9.87 4.5-11.9-2.03-2.04-7.36-.02-11.9 4.5-4.52 4.54-6.54 9.87-4.5 11.9 2.03 2.04 7.36.02 11.9-4.5Z"
              ></path>
            </svg>
          </div>

          <div class="logo-text-wrapper">
            <span class="logo-text-main">
              Amazing Amazon
              <span class="logo-text-gradient">Architect</span>
            </span>
            <span class="logo-subtitle">Prompt by Prompt</span>
          </div>
        </button>

        <!-- ===== Navigation ===== -->
        <nav class="nav-wrapper" aria-label="主导航">
          <!-- 工作台 -->
          <div class="nav-group" data-nav-palette="rose">
            <button
              id="nav-apps"
              class="nav-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="apps-mega-menu"
            >
              <i class="fas fa-th-large nav-icon"></i>
              运营工作台
              <i class="fas fa-chevron-down nav-chevron"></i>
            </button>

            <div
              id="apps-mega-menu"
              class="mega-menu"
              aria-labelledby="nav-apps"
              aria-hidden="true"
            >
              <div class="mega-menu-inner">
                <div class="mega-menu-header">
                  <div class="mega-menu-icon mega-menu-icon--apps">
                    <i class="fas fa-rocket"></i>
                  </div>
                  <h3 id="apps-mega-menu-title" class="mega-menu-title">核心应用模块</h3>
                </div>
                <div
                  id="mega-menu-content"
                  class="mega-menu-grid mega-menu-grid--5"
                  aria-labelledby="apps-mega-menu-title"
                >
                  <div class="skeleton skeleton--h-128"></div>
                  <div class="skeleton skeleton--h-128 skeleton--delay-100"></div>
                  <div class="skeleton skeleton--h-128 skeleton--delay-200"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- SOPs 流程中心 -->
          <div class="nav-group" data-nav-palette="indigo">
            <button
              id="nav-sops"
              class="nav-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="sops-mega-menu"
            >
              <i class="fas fa-project-diagram nav-icon"></i>
              SOPs 流程中心
              <i class="fas fa-chevron-down nav-chevron"></i>
            </button>

            <div
              id="sops-mega-menu"
              class="mega-menu"
              aria-labelledby="nav-sops"
              aria-hidden="true"
            >
              <div class="mega-menu-inner">
                <div class="mega-menu-header">
                  <div class="mega-menu-icon mega-menu-icon--sops">
                    <i class="fas fa-layer-group"></i>
                  </div>
                  <h3 id="sops-mega-menu-title" class="mega-menu-title">核心 SOP 体系</h3>
                </div>
                <div
                  id="sops-mega-menu-content"
                  class="mega-menu-grid mega-menu-grid--5"
                  aria-labelledby="sops-mega-menu-title"
                >
                  <div class="skeleton skeleton--h-96"></div>
                  <div class="skeleton skeleton--h-96 skeleton--delay-100"></div>
                  <div class="skeleton skeleton--h-96 skeleton--delay-200"></div>
                  <div class="skeleton skeleton--h-96 skeleton--delay-300"></div>
                  <div class="skeleton skeleton--h-96 skeleton--delay-400"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- Amazon 智库 -->
          <div class="nav-group" data-nav-palette="orange">
            <button
              id="nav-hub"
              class="nav-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="hub-mega-menu"
            >
              <i class="fas fa-book-open nav-icon"></i>
              Amazon 智库
              <i class="fas fa-chevron-down nav-chevron"></i>
            </button>

            <div id="hub-mega-menu" class="mega-menu" aria-labelledby="nav-hub" aria-hidden="true">
              <div class="mega-menu-inner">
                <div class="mega-menu-header">
                  <div class="mega-menu-icon mega-menu-icon--hub">
                    <i class="fas fa-lightbulb"></i>
                  </div>
                  <h3 id="hub-mega-menu-title" class="mega-menu-title">Amazon 智库体系</h3>
                </div>
                <div
                  id="hub-mega-menu-content"
                  class="mega-menu-grid mega-menu-grid--4"
                  aria-labelledby="hub-mega-menu-title"
                >
                  <div class="skeleton skeleton--h-96"></div>
                  <div class="skeleton skeleton--h-96 skeleton--delay-100"></div>
                  <div class="skeleton skeleton--h-96 skeleton--delay-200"></div>
                  <div class="skeleton skeleton--h-96 skeleton--delay-300"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 更多 -->
          <div class="nav-group" data-nav-palette="green">
            <button
              id="nav-more"
              class="nav-trigger"
              type="button"
              aria-expanded="false"
              aria-controls="more-mega-menu"
            >
              <i class="fas fa-ellipsis-h nav-icon"></i>
              更多
              <i class="fas fa-chevron-down nav-chevron"></i>
            </button>

            <div
              id="more-mega-menu"
              class="mega-menu"
              aria-labelledby="nav-more"
              aria-hidden="true"
            >
              <div class="mega-menu-inner">
                <div class="more-menu-layout">
                  <!-- Main Content -->
                  <div>
                    <div class="mega-menu-header">
                      <div class="mega-menu-icon mega-menu-icon--more">
                        <i class="fas fa-compass"></i>
                      </div>
                      <h3 id="more-mega-menu-title" class="mega-menu-title">探索模块</h3>
                    </div>
                    <div
                      id="more-menu-content"
                      class="mega-menu-grid mega-menu-grid--3"
                      aria-labelledby="more-mega-menu-title"
                    >
                      <div class="skeleton skeleton--h-128"></div>
                    </div>
                  </div>

                  <!-- Quick Access Sidebar -->
                  <div class="more-menu-sidebar">
                    <div>
                      <h3 class="quick-access-title">
                        <i class="fas fa-bolt"></i>
                        快速访问
                      </h3>
                      <ul class="quick-access-list">
                        <li>
                          <button
                            type="button"
                            data-action="openSettings"
                            class="quick-access-item"
                          >
                            <div class="quick-access-icon">
                              <i class="fas fa-cog"></i>
                            </div>
                            <span>全局设置</span>
                          </button>
                        </li>
                        <li>
                          <button
                            type="button"
                            data-action="downloadAmazonInsightPlugin"
                            class="quick-access-item"
                            title="前往 GitHub 下载 Amazon Product Insight 插件 Latest 版本"
                          >
                            <div class="quick-access-icon">
                              <i class="fab fa-chrome" aria-hidden="true"></i>
                            </div>
                            <span>采集插件下载（Chrome）</span>
                          </button>
                        </li>
                      </ul>
                    </div>

                    <!-- Version Card -->
                    <div class="tip-card version-card" aria-label="当前版本">
                      <div class="tip-card-icon">
                        <i class="fas fa-code-branch"></i>
                      </div>
                      <div class="version-card-copy">
                        <span class="version-card-label">当前版本</span>
                        <span id="app-version-more" class="version-card-value">V --</span>
                      </div>
                      <a
                        class="version-card-release-link"
                        href="https://github.com/earshore/SOPs/releases"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="打开 GitHub Releases"
                        title="打开 GitHub Releases"
                      >
                        <i class="fab fa-github" aria-hidden="true"></i>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </nav>

        <!-- ===== Right Actions ===== -->
        <div class="header-actions">
          <!-- Model Status -->
          <div id="model-status" class="model-status">
            <span class="status-dot status-pending pulse-dot"></span>
            <span>未配置模型</span>
          </div>
        </div>
      </div>

      <!-- Global Progress Bar -->
      <div
        id="global-progress"
        class="progress-bar hidden"
        role="progressbar"
        aria-label="页面加载进度"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        aria-hidden="true"
      >
        <progress
          id="progress-fill"
          class="progress-fill progress-fill--native"
          value="0"
          max="100"
          aria-hidden="true"
        ></progress>
      </div>
    </header>

    <!-- ========== Main Layout ========== -->
    <div class="flex flex-1 overflow-hidden relative">
      <!-- 装饰性背景 Blobs -->
      <div class="bg-blob bg-blob--1"></div>
      <div class="bg-blob bg-blob--2"></div>
      <div class="bg-blob bg-blob--3"></div>

      <!-- Dynamic Sidebar -->
      <aside
        id="dynamic-sidebar"
        class="w-64 max-md:hidden bg-[var(--surface-panel,#ffffff)] border-r border-[color:var(--border-subtle,rgba(148,163,184,0.24))] flex flex-col transition-all duration-300 -ml-64 hidden"
      ></aside>

      <!-- Main Content -->
      <main
        id="main-content"
        class="app-shell-pending flex-1 overflow-y-auto overflow-x-hidden bg-gradient-to-b from-slate-50/80 to-slate-100/30 p-8 relative scroll-smooth"
      >
        <!-- main content -->
      </main>
    </div>

    <!-- ========== Toast Container ========== -->
    <div
      id="toast-container"
      class="toast-container"
      role="status"
      aria-live="polite"
      aria-atomic="false"
    ></div>

    <!-- ========== Modal Container ========== -->
    <div id="modal-container"></div>

    <!-- ========== User Guide Container ========== -->

    <!-- ========== Global Loading Overlay ========== -->
    <div
      id="global-loading"
      class="global-loading hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      aria-busy="false"
      aria-hidden="true"
    >
      <div class="loading-card">
        <!-- Spinner -->
        <div class="loading-spinner">
          <div class="loading-spinner-track"></div>
          <div class="loading-spinner-fill"></div>
          <div class="loading-spinner-dot"></div>
        </div>
        <div class="loading-text">
          <p data-loading-message class="loading-text-main">加载中</p>
          <div class="loading-text-sub">
            <span>请稍候</span>
            <span class="loading-dots"></span>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
