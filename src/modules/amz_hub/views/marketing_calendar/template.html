<style>
    /* 为了防止污染全局，建议保留原本的类名命名空间 amzf_ */
    :root {
        /* --amzf-primary: #4285f4; */
        --amzf-primary: #667eea; /* 统一主色调 */
        --amzf-secondary: #34a853;
        --amzf-accent: #fbbc04;
        --amzf-danger: #ea4335;
        --amzf-purple: #9c27b0;
        --amzf-bg: #f8f9fa;
        --amzf-card: #ffffff;
        --amzf-text: #202124;
        --amzf-text-secondary: #5f6368;
        --amzf-border: #e8eaed;
        --amzf-shadow: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
        --amzf-shadow-hover: 0 10px 40px rgba(0,0,0,0.15);
        --amzf-radius: 16px;
        --amzf-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 容器微调：移除 min-height: 100vh，因为是嵌入在 Panel 里的 */
/* 1. 修复滚动问题：确保容器撑满并允许内部滚动 */
    .amzf_container {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--amzf-bg);
        color: var(--amzf-text);
        line-height: 1.6;
        width: 100%;
        height: 100%; /* 撑满父容器 */
        overflow-y: auto; /* 允许垂直滚动 */
        padding: 20px;
        /* 隐藏滚动条但保留功能 (可选) */
        scrollbar-width: thin; 
    }

/* Header */
    .amzf_header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: var(--amzf-radius);
        padding: 40px;
        margin-bottom: 30px;
        color: white;
        position: relative;
        overflow: hidden;
        flex-shrink: 0; /* 防止头部在滚动容器中被挤压 */
    }
    .amzf_header::before {
        content: '';
        position: absolute;
        top: -50%;
        right: -20%;
        width: 400px;
        height: 400px;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
    }
    .amzf_header::after {
        content: '';
        position: absolute;
        bottom: -30%;
        left: 10%;
        width: 200px;
        height: 200px;
        background: rgba(255,255,255,0.08);
        border-radius: 50%;
    }
    .amzf_header_content {
        position: relative;
        z-index: 1;
    }
    .amzf_title {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .amzf_title_icon {
        width: 50px;
        height: 50px;
        background: rgba(255,255,255,0.2);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
    }
    .amzf_subtitle {
        font-size: 1.1rem;
        opacity: 0.9;
        max-width: 600px;
    }
    /* Search Bar */
    .amzf_search_wrapper {
        background: var(--amzf-card);
        border-radius: var(--amzf-radius);
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: var(--amzf-shadow);
    }
    .amzf_search_box {
        display: flex;
        align-items: center;
        gap: 15px;
        background: var(--amzf-bg);
        border-radius: 50px;
        padding: 12px 24px;
        border: 2px solid transparent;
        transition: var(--amzf-transition);
    }
    .amzf_search_box:focus-within {
        border-color: var(--amzf-primary);
        background: white;
    }
    .amzf_search_icon {
        color: var(--amzf-text-secondary);
        font-size: 1.2rem;
    }
    .amzf_search_input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 1rem;
        color: var(--amzf-text);
        outline: none;
    }
    .amzf_search_clear {
        background: none;
        border: none;
        color: var(--amzf-text-secondary);
        cursor: pointer;
        padding: 5px;
        border-radius: 50%;
        transition: var(--amzf-transition);
        opacity: 0;
        visibility: hidden;
    }
    .amzf_search_clear.amzf_visible {
        opacity: 1;
        visibility: visible;
    }
    .amzf_search_clear:hover {
        background: var(--amzf-border);
    }
    /* View Toggle */
    .amzf_controls {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 25px;
    }
    .amzf_view_toggle {
        display: flex;
        background: var(--amzf-card);
        border-radius: 50px;
        padding: 5px;
        box-shadow: var(--amzf-shadow);
    }
    .amzf_view_btn {
        padding: 12px 24px;
        border: none;
        background: transparent;
        border-radius: 50px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--amzf-text-secondary);
        cursor: pointer;
        transition: var(--amzf-transition);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .amzf_view_btn.amzf_active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    .amzf_view_btn:hover:not(.amzf_active) {
        background: var(--amzf-bg);
    }
    /* Country Tabs */
    .amzf_country_tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    .amzf_country_tab {
        padding: 10px 18px;
        border: 2px solid var(--amzf-border);
        background: var(--amzf-card);
        border-radius: 50px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: var(--amzf-transition);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .amzf_country_tab:hover {
        border-color: var(--amzf-primary);
        transform: translateY(-2px);
    }
    .amzf_country_tab.amzf_active {
        background: var(--amzf-primary);
        border-color: var(--amzf-primary);
        color: white;
    }
    .amzf_country_flag {
        font-size: 1.2rem;
    }
    /* Stats Bar */
    .amzf_stats {
        display: flex;
        gap: 20px;
        margin-bottom: 25px;
        flex-wrap: wrap;
    }
    .amzf_stat_item {
        background: var(--amzf-card);
        padding: 15px 25px;
        border-radius: var(--amzf-radius);
        box-shadow: var(--amzf-shadow);
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .amzf_stat_icon {
        width: 45px;
        height: 45px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.3rem;
    }
    .amzf_stat_icon.amzf_blue { background: rgba(66, 133, 244, 0.15); }
    .amzf_stat_icon.amzf_green { background: rgba(52, 168, 83, 0.15); }
    .amzf_stat_icon.amzf_orange { background: rgba(251, 188, 4, 0.15); }
    .amzf_stat_value {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--amzf-text);
    }
    .amzf_stat_label {
        font-size: 0.85rem;
        color: var(--amzf-text-secondary);
    }
    /* Timeline View */
    .amzf_timeline {
        display: grid;
        gap: 20px;
    }
    .amzf_month_section {
        background: var(--amzf-card);
        border-radius: var(--amzf-radius);
        overflow: hidden;
        box-shadow: var(--amzf-shadow);
        transition: var(--amzf-transition);
    }
    .amzf_month_section:hover {
        box-shadow: var(--amzf-shadow-hover);
    }
    .amzf_month_header {
        padding: 20px 25px;
        background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        user-select: none;
        transition: var(--amzf-transition);
    }
    .amzf_month_header:hover {
        background: linear-gradient(135deg, #e8ecf0 0%, #d8dce0 100%);
    }
    .amzf_month_info {
        display: flex;
        align-items: center;
        gap: 15px;
    }
    .amzf_month_name {
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--amzf-text);
    }
    .amzf_month_badge {
        background: var(--amzf-primary);
        color: white;
        padding: 4px 12px;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: 500;
    }
    /* 箭头旋转动画 */
    .amzf_month_toggle {
        transition: transform 0.3s ease;
    }
    /* 旋转动画 */
    .amzf_expanded .amzf_month_toggle {
        transform: rotate(180deg);
    }
    .amzf_month_section.amzf_expanded .amzf_month_toggle {
        transform: rotate(180deg);
    }
    /* 3. 展开/收起的核心过渡 (保持你原有的逻辑，稍作参数优化) */
    .amzf_month_content, .amzf_comparison_content {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        /* 贝塞尔曲线优化，让展开动作更有弹性 */
        transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease-in-out;
        will-change: max-height, opacity; /* 性能优化：告诉浏览器这俩属性会变 */
    }
    /* 展开状态 */
    .amzf_expanded .amzf_month_content, 
    .amzf_expanded .amzf_comparison_content {
        max-height: 3000px; /* 稍微给大一点，防止内容截断 */
        opacity: 1;
    }
    
    .amzf_month_content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .amzf_month_section.amzf_expanded .amzf_month_content {
        max-height: 2000px;
    }
    .amzf_events_grid {
        padding: 20px;
        display: grid;
        gap: 15px;
    }
    /* Event Card */
    .amzf_event_card {
        background: var(--amzf-bg);
        border-radius: 12px;
        padding: 20px;
        border-left: 4px solid var(--amzf-primary);
        transition: var(--amzf-transition);
        cursor: pointer;
    }
    .amzf_event_card:hover {
        transform: translateX(5px);
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .amzf_event_card.amzf_type_holiday { border-left-color: var(--amzf-danger); }
    .amzf_event_card.amzf_type_shopping { border-left-color: var(--amzf-secondary); }
    .amzf_event_card.amzf_type_cultural { border-left-color: var(--amzf-purple); }
    .amzf_event_card.amzf_type_season { border-left-color: var(--amzf-accent); }
    .amzf_event_header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 12px;
    }
    .amzf_event_title_wrapper {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .amzf_event_emoji {
        font-size: 1.5rem;
    }
    .amzf_event_title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--amzf-text);
    }
    .amzf_event_date {
        font-size: 0.85rem;
        color: var(--amzf-text-secondary);
        background: white;
        padding: 5px 12px;
        border-radius: 20px;
        font-weight: 500;
    }
    .amzf_event_countries {
        display: flex;
        gap: 5px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }
    .amzf_country_badge {
        font-size: 1.1rem;
        background: white;
        padding: 3px 8px;
        border-radius: 6px;
    }
    .amzf_event_strategy {
        background: white;
        border-radius: 8px;
        padding: 15px;
        margin-top: 10px;
    }
    .amzf_strategy_title {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--amzf-primary);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .amzf_strategy_content {
        font-size: 0.9rem;
        color: var(--amzf-text-secondary);
        line-height: 1.7;
    }
    .amzf_strategy_tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
    }
    .amzf_tag {
        background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
        color: #667eea;
        padding: 4px 10px;
        border-radius: 15px;
        font-size: 0.75rem;
        font-weight: 500;
    }
    /* Event View Cards */
    .amzf_event_view {
        display: grid;
        gap: 20px;
    }
    .amzf_event_comparison {
        background: var(--amzf-card);
        border-radius: var(--amzf-radius);
        overflow: hidden;
        box-shadow: var(--amzf-shadow);
    }
    .amzf_comparison_header {
        padding: 20px 25px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .amzf_comparison_title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 1.2rem;
        font-weight: 600;
    }
    .amzf_comparison_content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .amzf_event_comparison.amzf_expanded .amzf_comparison_content {
        max-height: 1500px;
    }
    .amzf_country_list {
        padding: 20px;
        display: grid;
        gap: 15px;
    }
.amzf_country_event {
        display: flex;
        /* ✅ 修改：改为 flex-start (顶对齐)，这样内容变高时，图标和日期固定在顶部，不会跑偏 */
        align-items: flex-start; 
        gap: 15px;
        padding: 15px;
        background: var(--amzf-bg);
        border-radius: 12px;
        transition: var(--amzf-transition);
    }
    /* 增加一点上边距，让单行时图标也能和文字第一行对齐 */
    .amzf_country_info, .amzf_country_date {
        margin-top: 2px;
    }
    .amzf_country_event:hover {
        background: #e8ecf0;
    }
    .amzf_country_info {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 150px;
    }
    .amzf_country_name {
        font-weight: 600;
        color: var(--amzf-text);
    }
    .amzf_country_date {
        flex: 1;
        color: var(--amzf-text-secondary);
    }
    .amzf_country_strategy_brief {
        flex: 2;
        font-size: 0.9rem;
        color: var(--amzf-text-secondary);
    }
    /* Empty State */
    .amzf_empty {
        text-align: center;
        padding: 60px 20px;
        background: var(--amzf-card);
        border-radius: var(--amzf-radius);
    }
    .amzf_empty_icon {
        font-size: 4rem;
        margin-bottom: 20px;
    }
    .amzf_empty_text {
        font-size: 1.1rem;
        color: var(--amzf-text-secondary);
    }
    /* Animations */
    /* 1. 进场动画：只在列表初次加载或筛选时使用 */
    @keyframes amzf_fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .amzf_animate {
        animation: amzf_fadeIn 0.4s ease-out forwards;
    }
        /* 2. 移除全局通用的 .amzf_animate，改为由 JS 控制 */
    .amzf_list_entering .amzf_month_section,
    .amzf_list_entering .amzf_event_comparison {
        animation: amzf_fadeIn 0.4s ease-out forwards;
    }
    /* Responsive */
    @media (max-width: 768px) {
        .amzf_title { font-size: 1.8rem; }
        .amzf_controls { flex-direction: column; align-items: stretch; }
        .amzf_view_toggle { width: 100%; justify-content: center; }
        .amzf_country_tabs { justify-content: center; }
        .amzf_stats { flex-direction: column; }
        .amzf_event_header { flex-direction: column; gap: 10px; }
        .amzf_country_event { flex-direction: column; align-items: flex-start; }
    }
</style>

<div class="amzf_container fade-in">
    <header class="amzf_header">
        <div class="amzf_header_content">
            <h1 class="amzf_title">
                <span class="amzf_title_icon">📅</span>
                亚马逊欧洲站实战营销日历
            </h1>
            <p class="amzf_subtitle">覆盖德国、意大利、法国、荷兰、西班牙、波兰、英国、瑞典八大站点，精准把握全年营销节点</p>
        </div>
    </header>
    <div class="amzf_search_wrapper">
        <div class="amzf_search_box">
            <span class="amzf_search_icon">🔍</span>
            <input type="text" class="amzf_search_input" id="amzf_search" placeholder="搜索节日、活动或关键词...">
            <button class="amzf_search_clear" id="amzf_clear" onclick="amzf_clearSearch()">✕</button>
        </div>
    </div>
    <div class="amzf_controls">
        <div class="amzf_view_toggle">
            <button class="amzf_view_btn amzf_active" id="amzf_btn_country" onclick="amzf_switchView('country')">
                🌍 按国家/地区
            </button>
            <button class="amzf_view_btn" id="amzf_btn_event" onclick="amzf_switchView('event')">
                🎉 按活动
            </button>
        </div>
        <div class="amzf_country_tabs" id="amzf_country_tabs"></div>
    </div>
    <div class="amzf_stats" id="amzf_stats"></div>
    <main class="amzf_main" id="amzf_main"></main>
</div>
