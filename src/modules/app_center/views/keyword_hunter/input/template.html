<!-- Input Module Template -->

<section id="kt-module-input" class="flex-1 overflow-y-auto pb-20">
    <div class="app-center-container">

        <!-- ========== Welcome Banner ========== -->
        <div class="wb-container mb-8" style="--wb-gradient-1: #3b82f6; --wb-gradient-2: #6366f1;">
            <div class="wb-card">
                <div class="wb-bg-gradient"></div>
                <div class="wb-orb wb-orb-1"></div>
                <div class="wb-orb wb-orb-2"></div>
                <div class="wb-grid-pattern"></div>
                <div class="wb-particle wb-particle-1"></div>
                <div class="wb-particle wb-particle-2"></div>
                <div class="wb-particle wb-particle-3"></div>
                <div class="wb-particle wb-particle-4"></div>

                <div class="wb-content">
                    <div class="wb-header">
                        <div class="wb-icon-wrapper">
                            <div class="wb-icon-main" aria-label="关键词输入功能图标">
                                <i class="fas fa-keyboard" aria-hidden="true"></i>
                            </div>
                            <div class="wb-icon-badge" aria-label="完成状态">
                                <i class="fas fa-check" aria-hidden="true"></i>
                            </div>
                        </div>

                        <div class="wb-text">
                            <div class="wb-title-row">
                                <h2 class="wb-title">关键词与 Listing 文案输入</h2>
                                <span class="wb-badge wb-badge-service" aria-label="服务功能">
                                    <i class="fas fa-keyboard" aria-hidden="true"></i>STEP 1
                                </span>
                            </div>
                            <p class="wb-description">
                                输入或粘贴关键词与目标 Listing 文案，一键去重、格式化处理，为您准备高质量的分析数据源。
                            </p>

                            <ul class="wb-tags" role="list">
                                <li class="wb-tag" role="listitem">
                                    <div class="wb-tag-dot" aria-hidden="true"></div>
                                    <span>多语种支持</span>
                                </li>
                                <li class="wb-tag" role="listitem">
                                    <div class="wb-tag-dot" style="background-color: var(--wb-tag-dot-2, #6366f1);" aria-hidden="true"></div>
                                    <span>智能去重</span>
                                </li>
                                <li class="wb-tag" role="listitem">
                                    <div class="wb-tag-dot" style="background-color: var(--wb-tag-dot-3, #10b981);" aria-hidden="true"></div>
                                    <span>格式清洗</span>
                                </li>
                                <li class="wb-tag" role="listitem">
                                    <div class="wb-tag-dot" style="background-color: var(--wb-tag-dot-4, #8b5cf6);" aria-hidden="true"></div>
                                    <span>一键分析</span>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== Input Cards Grid ========== -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 kt-input-grid">

            <!-- ===== Keywords Input (1/3) ===== -->
            <div class="lg:col-span-1 kt-input-card rounded-2xl shadow-sm shadow-slate-200/50 border border-slate-200/80 bg-white overflow-hidden">
                <!-- Card Header -->
                <div class="px-5 pt-5 pb-4 border-b border-slate-100">
                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
                                <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
                                </svg>
                            </div>
                            关键词列表
                        </h2>
                        <button id="kt-btn-clean-kw"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-lg text-xs font-semibold transition-all border border-slate-200 hover:border-slate-300 hover:shadow-sm active:scale-95">
                            <i class="fas fa-broom text-[10px]"></i> 清理格式
                        </button>
                    </div>
                </div>

                <!-- Card Body -->
                <div class="p-5">
                    <div class="relative kt-textarea-container">
                        <div class="keyword-input-wrapper rounded-xl overflow-hidden border-2 border-slate-200 focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-all duration-200">
                            <div id="kt-keyword-highlight-layer" class="keyword-input-highlight"></div>
                            <textarea id="kt-keywords-input"
                                class="keyword-input-textarea w-full p-4 border-0 focus:ring-0 text-sm scrollbar-thin bg-slate-50/50 focus:bg-white transition-colors placeholder:text-slate-300 leading-relaxed"
                                placeholder="请输入关键词列表，每行一个&#10;&#10;支持全语种 (DE/FR/IT/ES/NL 等)&#10;&#10;示例：&#10;wireless earbuds&#10;bluetooth headphones&#10;noise cancelling earphones"></textarea>
                        </div>

                        <!-- Stats Bar -->
                        <div class="absolute bottom-4 left-4 right-4 z-10 flex items-center justify-between">
                            <div class="flex gap-2">
                                <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-blue-50 text-blue-700 rounded-full font-semibold text-[11px] border border-blue-100">
                                    <i class="fas fa-hashtag text-[8px] text-blue-400"></i>
                                    <span id="kt-keyword-count">0</span>
                                    <span class="text-blue-400 font-normal">词</span>
                                </span>
                                <span id="kt-duplicate-badge"
                                    class="inline-flex items-center gap-1 px-2.5 py-1 bg-amber-50 text-amber-700 rounded-full font-semibold text-[11px] border border-amber-100 hidden">
                                    <i class="fas fa-copy text-[8px] text-amber-400"></i>
                                    <span id="kt-duplicate-count">0</span>
                                    <span class="text-amber-400 font-normal">重复</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== Listing Copy Input (2/3) ===== -->
            <div class="lg:col-span-2 kt-input-card rounded-2xl shadow-sm shadow-slate-200/50 border border-slate-200/80 bg-white overflow-hidden">
                <!-- Card Header -->
                <div class="px-5 pt-5 pb-4 border-b border-slate-100">
                    <div class="flex items-center justify-between">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-emerald-50 flex items-center justify-center">
                                <i class="fas fa-file-alt text-emerald-500 text-sm"></i>
                            </div>
                            目标 Listing 文案
                        </h2>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-2">
                            <button id="kt-btn-clean-copy"
                                class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-lg text-xs font-semibold transition-all border border-slate-200 hover:border-slate-300 hover:shadow-sm active:scale-95">
                                <i class="fas fa-broom text-[10px]"></i> 清理格式
                            </button>
                            <button id="kt-btn-paste"
                                class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-lg text-xs font-semibold transition-all border border-slate-200 hover:border-slate-300 hover:shadow-sm active:scale-95">
                                <i class="fas fa-paste text-[10px]"></i> 粘贴
                            </button>
                            <button id="kt-btn-clear-copy"
                                class="inline-flex items-center gap-1 px-2.5 py-1.5 bg-white hover:bg-rose-50 text-slate-400 hover:text-rose-500 rounded-lg text-xs font-semibold transition-all border border-slate-200 hover:border-rose-200 active:scale-95">
                                <i class="fa-solid fa-trash-can text-[10px]"></i> 清空文案
                            </button>

                            <!-- Divider -->
                            <div class="w-px h-6 bg-slate-200 mx-0.5"></div>

                            <!-- Start Analysis Button -->
                            <button id="kt-btn-start-analysis"
                                class="relative inline-flex items-center gap-2 px-5 py-2 bg-gradient-to-r from-blue-600 via-blue-500 to-indigo-600 hover:from-blue-500 hover:via-blue-400 hover:to-indigo-500 text-white rounded-xl text-sm font-bold shadow-md shadow-blue-500/20 hover:shadow-lg hover:shadow-blue-500/30 transition-all duration-300 transform hover:scale-[1.02] hover:-translate-y-0.5 group cursor-pointer overflow-hidden active:scale-[0.98]">
                                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-700"></div>
                                <i class="fas fa-play text-[10px] relative z-10"></i>
                                <span class="relative z-10">开始分析</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Card Body -->
                <div class="p-5">
                    <div class="textarea-wrapper relative kt-textarea-container">
                        <div class="rounded-xl overflow-hidden border-2 border-slate-200 focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-500/20 transition-all duration-200">
                            <textarea id="kt-copy-input"
                                class="w-full p-4 border-0 focus:ring-0 text-sm scrollbar-thin bg-slate-50/50 focus:bg-white transition-colors placeholder:text-slate-300 leading-relaxed"
                                placeholder="请粘贴您的 Amazon 产品文案&#10;包括标题、五点描述、产品描述等&#10;&#10;示例：&#10;【Premium Wireless Earbuds】Experience crystal-clear sound&#10;with our Bluetooth headphones featuring advanced noise&#10;cancelling technology..."></textarea>
                        </div>

                        <!-- Stats Bar -->
                        <div class="textarea-stats absolute bottom-4 left-4 right-4 z-10 flex items-center justify-between">
                            <span class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-full font-semibold text-[11px] border border-emerald-100">
                                <i class="fas fa-font text-[8px] text-emerald-400"></i>
                                <span id="copy-char-count">0</span>
                                <span class="text-emerald-400 font-normal">字符</span>
                            </span>

                            <!-- Quick tip -->
                            <span class="text-[10px] text-slate-300 font-medium hidden sm:flex items-center gap-1">
                                <i class="fas fa-lightbulb text-[9px]"></i>
                                Tip: 包含完整 Listing 内容可提升分析精度
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
