name: Quality Gate

on:
  push:
    branches: [main, develop, branch2-21]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test type check
        run: npm run type-check:tests

  lint-warning-gate:
    name: lint warning gate
    runs-on: ubuntu-latest
    needs: type-check

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Test ESLint
        run: npm run lint:tests

      - name: ESLint warning baseline gate
        run: npm run lint:warning-gate

      - name: Format check
        run: npm run format:check

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs: lint-warning-gate

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:coverage

      - name: Check coverage threshold
        shell: pwsh
        run: |
          # Keep CI floors aligned with vite.config.js test.coverage.thresholds
          $lineThreshold = 82
          $statementThreshold = 80
          $functionThreshold = 82
          $branchThreshold = 65
          $coverage = Get-Content './coverage/coverage-summary.json' -Raw | ConvertFrom-Json
          $lines = $coverage.total.lines.pct
          $statements = $coverage.total.statements.pct
          $functions = $coverage.total.functions.pct
          $branches = $coverage.total.branches.pct
          Write-Host "Line coverage: $lines% (min $lineThreshold%)"
          Write-Host "Statement coverage: $statements% (min $statementThreshold%)"
          Write-Host "Function coverage: $functions% (min $functionThreshold%)"
          Write-Host "Branch coverage: $branches% (min $branchThreshold%)"
          if (
            $lines -lt $lineThreshold -or
            $statements -lt $statementThreshold -or
            $functions -lt $functionThreshold -or
            $branches -lt $branchThreshold
          ) {
            Write-Error "Coverage is below the configured thresholds (lines $lineThreshold / statements $statementThreshold / functions $functionThreshold / branches $branchThreshold)."
            exit 1
          }

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  build:
    name: build
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/index.html')) {
            Write-Error 'Missing dist/index.html.'
            exit 1
          }
          if (!(Test-Path 'dist/assets')) {
            Write-Error 'Missing dist/assets.'
            exit 1
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifact
          path: dist/
          retention-days: 7

  smoke-e2e:
    name: smoke e2e
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: build-artifact
          path: dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release smoke E2E against dist
        run: npm run test:e2e:smoke:release

      - name: Upload E2E report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-e2e-report
          path: |
            tests/playwright-report/
            test-results/
          retention-days: 30

  performance:
    name: performance
    runs-on: ubuntu-latest
    needs: smoke-e2e

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: build-artifact
          path: dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run performance gate
        run: npm run test:performance:gate

      - name: Upload performance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: performance-report
          path: |
            tests/playwright-report/
            test-results/
            .lighthouseci/
            tests/performance/lighthouse-reports/
            performance-*.json
          retention-days: 30

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  required:
    name: required
    runs-on: ubuntu-latest
    needs:
      - type-check
      - lint-warning-gate
      - unit
      - build
      - smoke-e2e
      - performance
      - npm-audit
    if: always()

    steps:
      - name: Check required gate results
        shell: pwsh
        run: |
          $results = @{
            'type-check' = '${{ needs['type-check'].result }}'
            'lint warning gate' = '${{ needs['lint-warning-gate'].result }}'
            'unit' = '${{ needs.unit.result }}'
            'build' = '${{ needs.build.result }}'
            'smoke e2e' = '${{ needs['smoke-e2e'].result }}'
            'performance' = '${{ needs.performance.result }}'
            'npm audit' = '${{ needs['npm-audit'].result }}'
          }

          Add-Content $env:GITHUB_STEP_SUMMARY '## Quality Gate'
          Add-Content $env:GITHUB_STEP_SUMMARY ''
          Add-Content $env:GITHUB_STEP_SUMMARY '| Check | Result |'
          Add-Content $env:GITHUB_STEP_SUMMARY '| --- | --- |'

          foreach ($entry in ($results.GetEnumerator() | Sort-Object Name)) {
            Write-Host "$($entry.Name): $($entry.Value)"
            Add-Content $env:GITHUB_STEP_SUMMARY "| $($entry.Name) | $($entry.Value) |"
          }

          $failed = @($results.GetEnumerator() | Where-Object { $_.Value -ne 'success' })
          if ($failed.Count -gt 0) {
            $failedNames = ($failed | ForEach-Object { $_.Name }) -join ', '
            Write-Error "Quality gate failed: $failedNames"
            exit 1
          }

          Write-Host 'Quality gate passed.'
