<link rel="stylesheet" href="./src/modules/home/homeDisplay.css">
<div id="panel-home" class="panel w-full h-full absolute top-0 left-0 overflow-hidden hidden z-10">

    <div id="home-splash-container">
        <div class="static-bg-layer"></div>
        <div class="light-orb orb-purple"></div>
        <div class="light-orb orb-cyan"></div>

        <canvas id="particles-canvas"></canvas>

        <header class="top-bar">
            <div class="time-display" id="time-display"></div>
            <div class="logo-section">
                <div class="logo-text">AMAZON SOP</div>
                <div class="logo-sub">Standard Operating Procedure</div>
            </div>
            <div class="version">V 3.0.1</div>
        </header>

        <main class="splash-content-wrapper">
            <div class="hero-container" id="magnetic-hero">
                <h1 class="slogan-main">
                    <div class="slogan-line highlight" data-text="规范流程">规范流程</div>
                    <div class="slogan-line outline" data-text="无限可能">无限可能</div>
                </h1>

                <p class="slogan-sub">
                    把<span>混乱</span>变成<span>秩序</span>，
                    把<span>经验</span>变成<span>指令</span>。
                </p>

                <div class="ai-status">
                    <div class="status-dot-inner"></div>
                    <span class="status-text">AI SYSTEM ONLINE · READY TO TRANSFORM</span>
                </div>
            </div>
        </main>

        <footer class="brand-footer">
            <div class="brand-line"></div>
            <span class="brand-text">AI DRIVEN | HUMAN CENTERED | PROCESS AS CODE | DECISION AT SPEED</span>
            <div class="brand-line"></div>
        </footer>

        <svg class="neural-network" viewBox="0 0 800 800">
            <defs>
                <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#00F3FF; stop-opacity:0.3" />
                    <stop offset="100%" style="stop-color:#BC13FE; stop-opacity:0.3" />
                </linearGradient>
            </defs>
            <g id="neural-lines"></g>
            <g id="neural-nodes"></g>
        </svg>

        <div id="cursor-follower"></div>
    </div>
</div>
