name = "sops"
pages_build_output_dir = "dist"
compatibility_date = "2024-01-01"

# ============================================================
# 部署前请在 Cloudflare Pages 控制台 → Settings → Environment Variables
# 添加以下生产环境变量：
#
#   AUTH_PASSWORD                = <your-secure-password>
#   GATEWAY_NEW_API_BASE_URL     = https://new.hongecb.store/v1
#   GATEWAY_NEW_API_API_KEY      = <your-api-key>
#
# 或使用 Wrangler CLI 批量上传：
#   npx wrangler pages secret bulk secrets.json --project-name sops
#
# 详细说明请参考: docs/DEPLOYMENT.md
# ============================================================
