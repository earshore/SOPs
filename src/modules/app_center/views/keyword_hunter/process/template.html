<section class="flex-1 overflow-y-auto pb-20 w-full" id="kt-module-process">
    <div class="module-container">
        <!-- ========== Welcome Banner ========== -->
        <div class="wb-container mb-8" style="--wb-gradient-1: #10b981; --wb-gradient-2: #14b8a6;">
            <div class="wb-card">
                <div class="wb-bg-gradient"></div>
                <div class="wb-orb wb-orb-1"></div>
                <div class="wb-orb wb-orb-2"></div>
                <div class="wb-grid-pattern"></div>
                <div class="wb-particle wb-particle-1"></div>
                <div class="wb-particle wb-particle-2"></div>
                <div class="wb-particle wb-particle-3"></div>
                <div class="wb-particle wb-particle-4"></div>
                <div class="wb-content">
                    <div class="wb-header">
                        <div class="wb-icon-wrapper">
                            <div class="wb-icon-main">
                                <i class="fas fa-tasks"></i>
                            </div>
                            <div class="wb-icon-badge">
                                <i class="fas fa-cogs"></i>
                            </div>
                        </div>
                        <div class="wb-text">
                            <div class="wb-title-row">
                                <h2 class="wb-title">SEO 处理中心</h2>
                                <span aria-label="专业功能" class="wb-badge wb-badge-pro">
                                    <i aria-hidden="true" class="fas fa-microchip"></i>STEP 2
                                </span>
                            </div>
                            <p class="wb-description">
                                自动化 SEO 覆盖标注、高频词云分析与快速定位，结合 AI 逐行翻译服务，方便审核、补充和优化，确保最大化 SEO 覆盖率与语义丰富度。
                            </p>
                            <div class="wb-tags">
                                <div class="wb-tag">
                                    <div class="wb-tag-dot"></div>
                                    <span>覆盖标注</span>
                                </div>
                                <div class="wb-tag">
                                    <div class="wb-tag-dot" style="background-color: var(--wb-tag-dot-2, #14b8a6);">
                                    </div>
                                    <span>词云分析</span>
                                </div>
                                <div class="wb-tag">
                                    <div class="wb-tag-dot" style="background-color: var(--wb-tag-dot-3, #8b5cf6);">
                                    </div>
                                    <span>关键词定位</span>
                                </div>
                                <div class="wb-tag">
                                    <div class="wb-tag-dot" style="background-color: var(--wb-tag-dot-4, #3b82f6);">
                                    </div>
                                    <span>AI 沉浸翻译</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- ========== Main Listing Editor Card ========== -->
        <div class="rounded-2xl shadow-sm shadow-slate-200/50 border border-slate-200/80 bg-white overflow-hidden">
            <!-- Card Header -->
            <div class="px-6 pt-5 pb-4 border-b border-slate-100">
                <div class="flex items-center justify-between flex-wrap gap-3">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg bg-emerald-50 flex items-center justify-center">
                            <i class="fa-solid fa-list-check text-emerald-500 text-sm"></i>
                        </div>
                        待处理 Listing 文案
                    </h2>
                    <!-- Action Bar -->
                    <div class="flex items-center gap-2 flex-wrap">
                        <!-- Translation Toggle -->
                        <label
                            class="inline-flex items-center gap-2.5 cursor-pointer group px-3 py-2 rounded-xl border-2 border-slate-200 hover:border-violet-300 bg-white transition-all duration-200">
                            <span
                                class="text-xs font-semibold text-slate-600 group-hover:text-violet-600 transition-colors whitespace-nowrap">原文</span>
                            <div class="relative flex-shrink-0">
                                <input checked="" class="sr-only peer" id="kt-show-translation" type="checkbox" />
                                <div
                                    class="w-9 h-5 bg-slate-200 rounded-full peer peer-checked:bg-violet-500 transition-colors duration-200 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all after:duration-200 after:shadow-sm peer-checked:after:translate-x-4">
                                </div>
                            </div>
                            <span
                                class="text-xs font-semibold text-slate-600 group-hover:text-violet-600 transition-colors whitespace-nowrap">译文</span>
                        </label>
                        <div class="w-px h-7 bg-slate-200 mx-0.5"></div>
                        <!-- Sync Back -->
                        <button
                            class="inline-flex items-center gap-1.5 px-3 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl text-xs font-semibold transition-all border border-emerald-200 hover:border-emerald-300 hover:shadow-sm active:scale-95"
                            onclick="window.kt_syncToInput()">
                            <i class="fas fa-reply text-[10px]"></i> 同步回输入
                        </button>
                        <!-- AI Translate -->
                        <button
                            class="relative overflow-hidden inline-flex items-center gap-2 px-4 py-2 rounded-xl font-semibold text-sm transition-all duration-300 cursor-not-allowed bg-slate-100 text-slate-400 border-2 border-slate-200 disabled:opacity-50"
                            id="kt-translate-btn" onclick="window.kt_translateCopyImmersive()">
                            <!-- Progress Bar -->
                            <div class="absolute left-0 top-0 bottom-0 bg-gradient-to-r from-violet-500 to-pink-500 opacity-20 hidden transition-all duration-300"
                                id="kt-translate-progress" style="width:0%"></div>
                            <i class="fas fa-language relative z-10 text-sm"></i>
                            <span class="relative z-10 text-xs" id="kt-translate-btn-text">AI 沉浸式翻译</span>
                            <span
                                class="hidden relative z-10 text-[10px] font-bold bg-white/20 px-1.5 py-0.5 rounded-full"
                                id="translate-btn-percent">0%</span>
                        </button>
                    </div>
                </div>
            </div>
            <!-- Editor Body -->
            <div class="p-6">
                <div
                    class="relative rounded-xl border-2 border-slate-200 focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-500/20 transition-all duration-200 overflow-hidden bg-slate-50/30">
                    <div class="copy-content p-5 min-h-[420px] text-slate-800 text-sm leading-relaxed focus:outline-none focus:bg-white transition-colors"
                        contenteditable="true" data-placeholder="请先在 输入模块 点击 开始分析!" id="kt-copy-display">
                    </div>
                    <!-- Editor Status Bar -->
                    <div
                        class="absolute bottom-0 left-0 right-0 px-5 py-2.5 bg-gradient-to-t from-white via-white/95 to-transparent flex items-center justify-between pointer-events-none">
                        <div class="flex items-center gap-2 pointer-events-auto">
                            <div class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></div>
                            <span class="text-[10px] text-slate-400 font-medium">可编辑</span>
                        </div>
                        <span class="text-[10px] text-slate-300 font-medium hidden sm:flex items-center gap-1">
                            <i class="fas fa-pencil-alt text-[8px]"></i>
                            直接编辑文案以补充关键词
                        </span>
                    </div>
                </div>
            </div>
        </div>
        <!-- ========== Statistics + Word Frequency ========== -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start mt-6">
            <!-- ===== Word Frequency Cloud (2/3) ===== -->
            <div
                class="lg:col-span-2 rounded-2xl shadow-sm shadow-slate-200/50 border border-slate-200/80 bg-white overflow-hidden">
                <!-- Card Header -->
                <div class="px-6 pt-5 pb-4 border-b border-slate-100">
                    <div class="flex items-center justify-between">
                        <h3 class="text-base font-bold text-slate-800 flex items-center gap-2.5">
                            <div class="w-8 h-8 rounded-lg bg-indigo-50 flex items-center justify-center">
                                <i class="fas fa-cloud text-indigo-500 text-sm"></i>
                            </div>
                            高频词云
                            <span
                                class="text-[10px] text-slate-400 font-normal ml-1 bg-slate-50 px-2 py-0.5 rounded-full border border-slate-100">Top
                                50</span>
                        </h3>
                        <!-- Legend -->
                        <div class="flex items-center gap-3">
                            <div class="flex items-center gap-1.5 text-[10px] text-slate-400">
                                <!-- <div class="w-4 h-2 rounded-sm bg-gradient-to-r from-indigo-400 to-indigo-500"></div> -->
                                <div class="w-4 h-2 rounded-sm bg-gradient-to-r from-green-400 to-green-500"></div>
                                已匹配词根
                            </div>
                            <div class="flex items-center gap-1.5 text-[10px] text-slate-400">
                                <!-- <div class="w-4 h-2 rounded-sm bg-gradient-to-r from-indigo-400 to-indigo-500"></div> -->
                                <div class="w-4 h-2 rounded-sm bg-gradient-to-r from-red-400 to-red-500"></div>
                                未匹配词根
                            </div>
                            <div class="flex items-center gap-1.5 text-[10px] text-slate-400">
                                <div class="w-4 h-2 rounded-sm bg-slate-200"></div>
                                其他词根
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Word Cloud Body -->
                <div class="p-6">
                    <div class="max-h-96 overflow-y-auto scrollbar-thin leading-relaxed pr-1"
                        id="kt-word-frequency-list">
                        <!-- Empty State -->
                        <div class="flex flex-col items-center justify-center py-16 text-center">
                            <div
                                class="w-14 h-14 rounded-2xl bg-indigo-50 flex items-center justify-center mb-4 border border-indigo-100">
                                <i class="fas fa-cloud text-indigo-200 text-xl"></i>
                            </div>
                            <p class="text-sm font-semibold text-slate-400">暂无词频数据</p>
                            <p class="text-[11px] text-slate-300 mt-1">完成分析后将自动生成词云</p>
                        </div>
                    </div>
                </div>
            </div>
            <!-- ===== Coverage Stats (1/3) ===== -->
            <div class="rounded-2xl shadow-sm shadow-slate-200/50 border border-slate-200/80 bg-white overflow-hidden">
                <!-- Card Header -->
                <div class="px-5 pt-5 pb-4 border-b border-slate-100">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-lg bg-blue-50 flex items-center justify-center">
                            <i class="fas fa-chart-pie text-blue-500 text-sm"></i>
                        </div>
                        覆盖率
                    </h2>
                </div>
                <!-- Card Body -->
                <div class="p-5 space-y-5">
                    <!-- Progress Ring / Bar -->
                    <div
                        class="relative bg-gradient-to-br from-blue-50/80 to-indigo-50/50 rounded-xl p-5 border border-blue-100/60">
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Coverage</span>
                            <span
                                class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600"
                                id="kt-coverage-rate">0%</span>
                        </div>
                        <div class="w-full bg-slate-200/80 rounded-full h-2.5 overflow-hidden">
                            <div class="bg-gradient-to-r from-blue-500 via-indigo-500 to-violet-500 h-2.5 rounded-full transition-all duration-700 ease-out relative"
                                id="kt-coverage-bar" style="width: 0%">
                                <!-- Shimmer on bar -->
                                <div
                                    class="absolute inset-0 bg-gradient-to-r from-transparent via-white/30 to-transparent animate-pulse">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Stats Cards -->
                    <div class="space-y-2.5">
                        <!-- Matched -->
                        <div
                            class="group flex items-center justify-between p-3.5 rounded-xl border-2 border-emerald-100 bg-gradient-to-r from-emerald-50/80 to-white hover:border-emerald-200 hover:shadow-sm transition-all duration-200">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-9 h-9 rounded-lg bg-emerald-100 flex items-center justify-center group-hover:bg-emerald-500 transition-colors duration-200">
                                    <i
                                        class="fas fa-check text-emerald-600 text-xs group-hover:text-white transition-colors"></i>
                                </div>
                                <div class="flex flex-col">
                                    <span
                                        class="text-[10px] text-emerald-600 font-semibold uppercase tracking-wide">已匹配</span>
                                    <span class="text-[10px] text-slate-400">Matched</span>
                                </div>
                            </div>
                            <span class="text-2xl font-black text-emerald-600 tabular-nums"
                                id="kt-stat-matched">0</span>
                        </div>
                        <!-- Unmatched -->
                        <div
                            class="group flex items-center justify-between p-3.5 rounded-xl border-2 border-rose-100 bg-gradient-to-r from-rose-50/80 to-white hover:border-rose-200 hover:shadow-sm transition-all duration-200">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-9 h-9 rounded-lg bg-rose-100 flex items-center justify-center group-hover:bg-rose-500 transition-colors duration-200">
                                    <i
                                        class="fas fa-times text-rose-500 text-xs group-hover:text-white transition-colors"></i>
                                </div>
                                <div class="flex flex-col">
                                    <span
                                        class="text-[10px] text-rose-600 font-semibold uppercase tracking-wide">未匹配</span>
                                    <span class="text-[10px] text-slate-400">Unmatched</span>
                                </div>
                            </div>
                            <span class="text-2xl font-black text-rose-600 tabular-nums" id="kt-stat-unmatched">0</span>
                        </div>
                        <!-- Total -->
                        <div
                            class="group flex items-center justify-between p-3.5 rounded-xl border-2 border-slate-150 bg-gradient-to-r from-slate-50/80 to-white hover:border-slate-200 hover:shadow-sm transition-all duration-200">
                            <div class="flex items-center gap-3">
                                <div
                                    class="w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center group-hover:bg-slate-600 transition-colors duration-200">
                                    <i
                                        class="fas fa-hashtag text-slate-500 text-xs group-hover:text-white transition-colors"></i>
                                </div>
                                <div class="flex flex-col">
                                    <span
                                        class="text-[10px] text-slate-600 font-semibold uppercase tracking-wide">总词数</span>
                                    <span class="text-[10px] text-slate-400">Total</span>
                                </div>
                            </div>
                            <span class="text-2xl font-black text-slate-600 tabular-nums" id="kt-stat-total">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- ========== Floating Keywords Window ========== -->
<div class="kt-floating-window" id="kt-keywords-floating">
    <div class="floating-header bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-t-xl">
        <h3 class="font-semibold text-sm flex items-center gap-2.5">
            <div class="w-6 h-6 rounded-md bg-white/20 flex items-center justify-center">
                <i class="fas fa-list text-[10px]"></i>
            </div>
            关键词监控
        </h3>
        <div class="flex items-center gap-1.5">
            <button class="w-7 h-7 flex items-center justify-center hover:bg-white/20 rounded-lg transition-colors"
                onclick="window.kt_minimizeKeywordsWindow()" title="最小化">
                <i class="fas fa-minus text-xs"></i>
            </button>
        </div>
    </div>
    <div class="kt-floating-content p-4">
        <!-- Legend -->
        <div class="flex items-center justify-start gap-5 mb-3.5 pb-3.5 border-b border-slate-100">
            <div class="flex items-center gap-2 text-xs">
                <span
                    class="w-3 h-3 rounded-md bg-gradient-to-br from-emerald-400 to-emerald-500 shadow-sm shadow-emerald-200"></span>
                <span class="text-slate-600 font-semibold">已匹配 <span class="text-emerald-600 font-bold">(<span
                            id="kt-tab-matched-count">0</span>)</span></span>
            </div>
            <div class="flex items-center gap-2 text-xs">
                <span
                    class="w-3 h-3 rounded-md bg-gradient-to-br from-rose-400 to-rose-500 shadow-sm shadow-rose-200"></span>
                <span class="text-slate-600 font-semibold">未匹配 <span class="text-rose-600 font-bold">(<span
                            id="kt-tab-unmatched-count">0</span>)</span></span>
            </div>
        </div>
        <div class="kt-keyword-list-wrapper">
            <div class="kt-keyword-list space-y-1.5 scrollbar-thin" id="kt-all-keywords"></div>
        </div>
    </div>
</div>
<!-- ========== Minimized Keywords Button ========== -->
<button
    class="kt-minimized-btn fixed bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-5 py-3 rounded-2xl shadow-xl shadow-blue-500/30 hover:shadow-2xl hover:shadow-blue-500/40 hover:scale-105 transition-all duration-300 items-center gap-2.5 border border-blue-400/30"
    id="kt-keywords-minimized" onclick="window.kt_restoreKeywordsWindow()">
    <div class="w-7 h-7 rounded-lg bg-white/20 flex items-center justify-center">
        <i class="fas fa-list text-xs"></i>
    </div>
    <span class="text-sm font-bold">关键词</span>
    <span
        class="bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm min-w-[20px] text-center"
        id="kt-minimized-badge">0</span>
</button>
