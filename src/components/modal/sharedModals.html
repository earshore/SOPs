<!--JSON导入提醒模态框-->
<app-modal id="import-conflict-modal" size="lg" title="数据冲突确认" no-header>
    <div slot="body" class="overflow-hidden">
        <!-- 顶部警告横幅 - 增加渐变背景和装饰元素 -->
        <div class="relative bg-gradient-to-r from-amber-50 via-amber-50 to-orange-50 px-6 py-5 border-b border-amber-100/80">
            <!-- 背景装饰纹理 -->
            <div class="absolute inset-0 opacity-[0.03]" style="background-image: url('data:image/svg+xml,%3Csvg width=&quot;20&quot; height=&quot;20&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Ccircle cx=&quot;1&quot; cy=&quot;1&quot; r=&quot;1&quot; fill=&quot;%23f59e0b&quot;/%3E%3C/svg%3E'); background-size: 20px 20px;"></div>
            <!-- 顶部警告色条 -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-amber-400 via-orange-400 to-amber-400"></div>
            
            <div class="relative flex items-center gap-4">
                <!-- 图标 - 增加双层光晕效果 -->
                <div class="relative flex-shrink-0">
                    <div class="absolute inset-0 w-12 h-12 rounded-full bg-amber-200/50 animate-ping" style="animation-duration: 3s;"></div>
                    <div class="relative w-12 h-12 rounded-full bg-gradient-to-br from-amber-100 to-orange-100 flex items-center justify-center text-amber-600 shadow-sm shadow-amber-200/50 ring-4 ring-amber-50">
                        <i class="fas fa-exclamation-triangle text-xl drop-shadow-sm"></i>
                    </div>
                </div>
                <div class="min-w-0">
                    <h3 class="text-lg font-bold text-slate-800 tracking-tight">数据冲突确认</h3>
                    <p class="text-sm text-slate-500 mt-0.5">
                        检测到 
                        <span id="conflict-count" class="inline-flex items-center justify-center min-w-[1.75rem] h-6 px-2 rounded-full bg-amber-500 text-white text-xs font-bold shadow-sm shadow-amber-300/50">0</span>
                        个已存在的 ASIN
                    </p>
                </div>
            </div>
        </div>

        <!-- 主体内容区 -->
        <div class="p-6 space-y-5">
            <!-- 说明文字 - 增加信息卡片样式 -->
            <div class="flex items-start gap-2.5 px-4 py-3 bg-slate-50/80 rounded-lg border border-slate-100">
                <i class="fas fa-info-circle text-slate-400 mt-0.5 flex-shrink-0"></i>
                <p class="text-sm text-slate-600 leading-relaxed">
                    导入文件中包含部分已在当前列表中的商品。请选择如何处理这些重复项：
                </p>
            </div>

            <!-- 操作选项卡片 -->
            <div class="grid grid-cols-1 gap-3">
                <!-- 智能合并选项 - 推荐 -->
                <button id="btn-resolve-merge"
                    class="group relative flex items-center justify-between p-5 rounded-2xl border-2 border-blue-200 bg-blue-50/30 hover:border-blue-500 hover:bg-blue-50 hover:shadow-lg hover:shadow-blue-100/50 transition-all duration-300 text-left w-full">
                    <!-- 推荐标签 -->
                    <div class="absolute -top-2.5 left-5">
                        <span class="inline-flex items-center gap-1 px-2.5 py-0.5 bg-gradient-to-r from-blue-500 to-indigo-500 text-white text-[10px] font-bold rounded-full shadow-md shadow-blue-300/40 uppercase tracking-wider">
                            <i class="fas fa-star text-[8px]"></i>
                            推荐
                        </span>
                    </div>
                    
                    <div class="flex items-center gap-4 mt-1">
                        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-100 to-indigo-100 text-blue-600 flex items-center justify-center group-hover:from-blue-500 group-hover:to-indigo-500 group-hover:text-white transition-all duration-300 shadow-sm group-hover:shadow-md group-hover:shadow-blue-300/40 group-hover:scale-110">
                            <i class="fas fa-code-branch rotate-90 text-lg"></i>
                        </div>
                        <div>
                            <div class="font-bold text-slate-700 group-hover:text-blue-700 transition-colors">智能合并</div>
                            <div class="text-xs text-slate-400 group-hover:text-blue-500/70 mt-0.5 transition-colors">保留旧数据，合并新评论，自动去重</div>
                        </div>
                    </div>
                    
                    <!-- 右侧箭头指示 -->
                    <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-all duration-300 translate-x-2 group-hover:translate-x-0">
                        <span class="text-xs text-blue-500 font-medium hidden sm:inline">选择此项</span>
                        <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center shadow-md shadow-blue-300/40">
                            <i class="fas fa-arrow-right text-sm"></i>
                        </div>
                    </div>
                </button>

                <!-- 覆盖旧版选项 -->
                <button id="btn-resolve-overwrite"
                    class="group relative flex items-center justify-between p-5 rounded-2xl border-2 border-slate-150 border-dashed hover:border-red-300 hover:border-solid hover:bg-red-50/50 hover:shadow-lg hover:shadow-red-100/30 transition-all duration-300 text-left w-full">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-gradient-to-br group-hover:from-red-100 group-hover:to-orange-100 group-hover:text-red-500 transition-all duration-300 group-hover:shadow-sm group-hover:scale-110">
                            <i class="fas fa-sync-alt text-lg"></i>
                        </div>
                        <div>
                            <div class="font-bold text-slate-600 group-hover:text-red-700 transition-colors">覆盖旧版</div>
                            <div class="text-xs text-slate-400 group-hover:text-red-400 mt-0.5 transition-colors">完全使用新导入的数据替换现有记录</div>
                        </div>
                    </div>
                    
                    <!-- 右侧警告指示 -->
                    <div class="flex items-center gap-2 opacity-0 group-hover:opacity-100 transition-all duration-300 translate-x-2 group-hover:translate-x-0">
                        <div class="w-8 h-8 rounded-full bg-red-100 text-red-500 flex items-center justify-center group-hover:bg-red-500 group-hover:text-white transition-colors">
                            <i class="fas fa-arrow-right text-sm"></i>
                        </div>
                    </div>
                </button>
            </div>
        </div>

        <!-- 底部操作栏 -->
        <div class="px-6 py-4 bg-gradient-to-r from-slate-50 to-gray-50 border-t border-slate-100/80">
            <div class="flex items-center justify-between">
                <!-- 左侧快捷键提示（可选） -->
                <div class="hidden sm:flex items-center gap-1.5 text-[10px] text-slate-400">
                    <kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded text-slate-500 font-mono shadow-sm">Esc</kbd>
                    <span>跳过重复项</span>
                </div>
                
                <button id="btn-resolve-skip"
                    class="group inline-flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-slate-500 hover:text-slate-700 bg-white hover:bg-slate-100 border border-slate-200 hover:border-slate-300 rounded-xl transition-all duration-200 shadow-sm hover:shadow active:scale-[0.98]">
                    <i class="fas fa-forward text-xs text-slate-400 group-hover:text-slate-500 transition-colors"></i>
                    跳过重复项
                </button>
            </div>
        </div>
    </div>
</app-modal>

<!--dataDisplay删除确认模态框-->
<app-modal id="delete-confirm-modal" size="sm" title="确认删除" no-header>
    <div slot="body" class="overflow-hidden">
        <!-- 顶部危险色条 -->
        <div class="h-1.5 bg-gradient-to-r from-red-400 via-rose-500 to-red-400"></div>
        
        <div class="p-7 text-center">
            <!-- 图标区域 - 增加多层涟漪效果 -->
            <div class="relative mx-auto w-16 h-16 mb-5">
                <!-- 外层脉冲 -->
                <div class="absolute inset-0 rounded-full bg-red-100 animate-ping opacity-20" style="animation-duration: 2s;"></div>
                <!-- 中间光环 -->
                <div class="absolute inset-[-4px] rounded-full border-4 border-red-100/60 border-dashed animate-spin" style="animation-duration: 12s;"></div>
                <!-- 主图标 -->
                <div class="relative w-16 h-16 rounded-full bg-gradient-to-br from-red-50 to-rose-100 flex items-center justify-center ring-4 ring-red-50 shadow-lg shadow-red-100/40">
                    <i class="fas fa-trash-alt text-red-500 text-2xl drop-shadow-sm"></i>
                </div>
            </div>

            <!-- 标题 -->
            <h3 id="del-modal-title" class="text-xl font-bold text-slate-900 mb-2 tracking-tight">
                确认删除
            </h3>

            <!-- 描述文字 -->
            <div id="del-modal-desc" class="text-sm text-slate-500 mb-6 leading-relaxed max-w-[280px] mx-auto">
                确认要执行此操作吗？此操作将无法撤销。
            </div>

            <!-- 警告提示条 -->
            <div class="flex items-center gap-2 px-4 py-2.5 bg-red-50/80 rounded-lg border border-red-100 mb-6 text-left">
                <i class="fas fa-exclamation-circle text-red-400 text-sm flex-shrink-0"></i>
                <span class="text-xs text-red-500/80">删除后数据将无法恢复，请谨慎操作</span>
            </div>

            <!-- 不再提醒 -->
            <div class="flex justify-center mb-6">
                <label class="inline-flex items-center gap-2.5 cursor-pointer group select-none px-3 py-1.5 rounded-lg hover:bg-slate-50 transition-colors">
                    <div class="relative">
                        <input type="checkbox" id="del-dont-ask"
                            class="peer sr-only">
                        <div class="w-4 h-4 border-2 border-slate-300 rounded peer-checked:border-red-500 peer-checked:bg-red-500 transition-all duration-200 flex items-center justify-center">
                            <i class="fas fa-check text-white text-[8px] opacity-0 peer-checked:opacity-100 transition-opacity"></i>
                        </div>
                    </div>
                    <span class="text-xs text-slate-400 group-hover:text-slate-600 transition-colors select-none">下次不再提醒</span>
                </label>
            </div>

            <!-- 操作按钮 -->
            <div class="grid grid-cols-2 gap-3">
                <button id="btn-del-cancel"
                    class="group w-full px-4 py-3 bg-white border-2 border-slate-200 text-slate-600 hover:bg-slate-50 hover:border-slate-300 hover:text-slate-700 text-sm font-semibold rounded-xl transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-200 active:scale-[0.97]">
                    <span class="inline-flex items-center gap-1.5">
                        <i class="fas fa-times text-xs text-slate-400 group-hover:text-slate-500 transition-colors"></i>
                        取消
                    </span>
                </button>
                <button id="btn-del-confirm"
                    class="group w-full px-4 py-3 bg-gradient-to-r from-red-500 to-rose-600 hover:from-red-600 hover:to-rose-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-red-200/60 transition-all duration-200 hover:shadow-xl hover:shadow-red-300/50 active:scale-[0.97] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                    <span class="inline-flex items-center gap-1.5">
                        <i class="fas fa-trash-alt text-xs text-red-200 group-hover:text-white transition-colors"></i>
                        确认删除
                    </span>
                </button>
            </div>
        </div>
    </div>
</app-modal>
