<!-- Master Prompt Modal -->
<div id="prompt-modal" class="hidden relative z-[100]" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Backdrop -->
    <div id="prompt-modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity opacity-0">
    </div>

    <div class="fixed inset-0 z-10 overflow-y-auto">
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
            <!-- Modal Panel -->
            <div id="prompt-modal-panel"
                class="relative transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-4xl opacity-0 scale-95 border border-slate-100">

                <!-- Header -->
                <div class="bg-gradient-to-r from-blue-600 to-indigo-600 px-6 py-4 flex items-center justify-between">
                    <h3 class="text-lg font-bold text-white flex items-center gap-2" id="modal-title">
                        <i class="fas fa-terminal"></i>
                        Generated Prompt Strategy
                    </h3>
                    <div class="flex items-center gap-2">
                        <span class="text-xs text-blue-100 bg-white/10 px-2 py-1 rounded">Read-Only Preview</span>
                        <button type="button" onclick="document.getElementById('prompt-modal').classList.add('hidden')"
                            class="text-blue-100 hover:text-white transition-colors focus:outline-none">
                            <i class="fas fa-times text-lg"></i>
                        </button>
                    </div>
                </div>

                <!-- Content -->
                <div class="px-6 py-6 bg-slate-50">
                    <div class="relative">
                        <textarea id="current-prompt-display"
                            class="w-full h-[60vh] p-5 text-sm font-mono text-slate-700 bg-white border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none leading-relaxed custom-scrollbar shadow-inner"
                            readonly></textarea>

                        <div class="absolute top-4 right-4 flex flex-col gap-2">
                            <button
                                onclick="navigator.clipboard.writeText(document.getElementById('current-prompt-display').value); window.showToast('已复制到剪贴板', 'success')"
                                class="bg-white/80 hover:bg-white text-slate-500 hover:text-blue-600 p-2 rounded-lg shadow-sm border border-slate-200 transition-all backdrop-blur-sm"
                                title="Copy">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="bg-white px-6 py-4 flex flex-row-reverse gap-3 border-t border-slate-100">
                    <button type="button" onclick="document.getElementById('prompt-modal').classList.add('hidden')"
                        class="inline-flex w-full justify-center rounded-xl bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 shadow-sm ring-1 ring-inset ring-slate-300 hover:bg-slate-50 sm:mt-0 sm:w-auto transition-all">
                        Close
                    </button>
                    <button type="button"
                        onclick="navigator.clipboard.writeText(document.getElementById('current-prompt-display').value); window.showToast('Copied!', 'success')"
                        class="inline-flex w-full justify-center rounded-xl bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 sm:w-auto transition-all">
                        <i class="fas fa-copy mr-2 mt-0.5"></i> Copy Prompt
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
