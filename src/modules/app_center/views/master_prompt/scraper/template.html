<!-- Scraper 子模块模板 (Alpine.js) -->
<div x-data="scraperPanel">

    <!-- Welcome Banner -->
    <div class="mb-6">
        <div
            class="bg-gradient-to-br from-slate-50 via-cyan-50/30 to-blue-50/30 rounded-2xl border border-slate-200/60 p-8 relative overflow-hidden">
            <div
                class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-cyan-100/30 to-blue-100/40 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2">
            </div>
            <div
                class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-sky-100/30 to-cyan-100/30 rounded-full blur-2xl translate-y-1/3 -translate-x-1/3">
            </div>

            <div class="relative z-10 flex items-start gap-6">
                <div
                    class="w-14 h-14 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 flex-shrink-0">
                    <i class="fas fa-globe-americas text-2xl text-white"></i>
                </div>
                <div class="flex-1">
                    <h2 class="text-xl font-bold text-slate-800 mb-2">亚马逊全球数据采集</h2>
                    <p class="text-slate-500 text-sm leading-relaxed max-w-2xl">
                        一键连接亚马逊全球10+站点，深度抓取 ASIN标题、Listing 详情与详情页Review。
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Left: Configuration & Status -->
        <div class="lg:col-span-2 space-y-6">

            <!-- Config Card -->
            <div class="glass-card rounded-2xl shadow-lg border border-slate-200 p-6 bg-white">
                <h2 class="text-lg font-semibold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fas fa-crosshairs text-blue-500"></i> 采集配置
                </h2>

                <!-- Site Selection -->
                <div class="mb-6">
                    <label class="flex items-center text-sm font-bold text-slate-800 mb-3">目标站点</label>
                    <div class="grid grid-cols-5 2xl:grid-cols-10 gap-2">
                        <template x-for="site in sites" :key="site">
                            <button @click="selectSite(site)"
                                class="site-btn flex flex-col items-center p-3 rounded-xl transition-all border-2"
                                :class="selectedSite === site ? 'border-blue-500 bg-blue-50 ring-1 ring-blue-500' : 'border-slate-200 hover:border-blue-300'">
                                <span class="text-2xl" x-text="getFlag(site)"></span>
                                <span class="text-xs font-medium mt-1" x-text="getSiteName(site)"></span>
                            </button>
                        </template>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="flex flex-col md:flex-row items-start gap-8 mb-6">
                    <div class="flex-1 flex flex-col w-full">
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            ASIN列表 <span class="text-slate-400 font-normal">(逗号或换行分隔)</span>
                        </label>
                        <textarea x-model="inputAsins" rows="4"
                            class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all resize-none shadow-sm font-mono text-sm"
                            placeholder="B0FMGTGMK4&#10;B09XBHXKKL"></textarea>

                        <div class="flex items-center justify-between mt-2 px-1">
                            <span class="text-xs"
                                :class="validAsins.length > 0 ? 'text-emerald-700 font-bold' : 'text-slate-500'">
                                <span
                                    x-text="validAsins.length > 0 ? `已识别 ${validAsins.length} 个 ASIN` : '等待输入...'"></span>
                            </span>

                            <span x-show="invalidCount > 0" class="text-xs text-rose-500 font-medium">
                                <i class="fas fa-filter"></i> 自动过滤 <span x-text="invalidCount"></span> 个无效项
                            </span>

                            <button @click="clearAsins()" class="text-xs text-blue-600 hover:text-blue-700 font-medium"
                                x-show="inputAsins.length > 0">
                                清空
                            </button>
                        </div>
                    </div>

                    <div class="flex-1 w-full md:pt-[28px]">
                        <div class="space-y-4">
                            <!-- Review Toggle -->
                            <label class="flex items-center gap-2 cursor-pointer group">
                                <div class="relative flex items-center">
                                    <input type="checkbox" x-model="scrapeReviews"
                                        class="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500 cursor-pointer" />
                                </div>
                                <span
                                    class="text-sm text-slate-700 group-hover:text-blue-600 transition-colors">采集评论</span>
                            </label>

                            <!-- Network Status Card -->
                            <div>
                                <h4 class="text-sm font-semibold text-slate-600 mb-2">网络状态</h4>
                                <div @click="$dispatch('open-settings')"
                                    class="flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all border group shadow-sm"
                                    :class="proxyConfigStatus.ready ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200'">

                                    <div class="flex items-center gap-3 overflow-hidden">
                                        <div class="w-9 h-9 rounded-lg flex-shrink-0 flex items-center justify-center"
                                            :class="proxyConfigStatus.ready ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'">
                                            <i class="fas fa-network-wired text-sm"></i>
                                        </div>
                                        <div class="flex flex-col min-w-0 justify-center">
                                            <span class="text-xs font-bold truncate mb-0.5"
                                                :class="proxyConfigStatus.ready ? 'text-slate-700' : 'text-slate-800'"
                                                x-text="proxyConfigStatus.name"></span>
                                            <div class="flex items-center gap-1.5">
                                                <span class="relative flex h-2 w-2">
                                                    <span
                                                        class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75"
                                                        :class="proxyConfigStatus.ready ? 'bg-emerald-400' : 'bg-rose-500'"></span>
                                                    <span class="relative inline-flex rounded-full h-2 w-2"
                                                        :class="proxyConfigStatus.ready ? 'bg-emerald-500' : 'bg-rose-600'"></span>
                                                </span>
                                                <span class="text-[10px] font-mono truncate"
                                                    :class="proxyConfigStatus.ready ? 'text-emerald-600' : 'text-rose-500 font-bold'"
                                                    x-text="proxyConfigStatus.ready ? 'Ready' : '需配置'"></span>
                                            </div>
                                        </div>
                                    </div>
                                    <i
                                        class="fas fa-chevron-right text-xs text-slate-400 group-hover:text-slate-600 ml-2"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Start Button -->
                <button @click="startScrape()" :disabled="!canStart"
                    class="w-full py-3 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-400 hover:to-purple-500 text-white font-bold rounded-lg shadow-md transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2 group cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed disabled:grayscale">
                    <i class="fas" :class="isScraping ? 'fa-circle-notch fa-spin' : 'fa-rocket'"></i>
                    <span x-text="isScraping ? '正在采集...' : '开始采集'"></span>
                </button>
            </div>

            <!-- Task Status Panel -->
            <div x-show="tasks.length > 0" x-transition
                class="glass-card rounded-2xl shadow-lg border border-slate-200 p-6 bg-white">
                <h3 class="text-lg font-semibold text-slate-800 mb-4">
                    <i class="fas fa-map-marker-alt fa-fw mr-2 text-slate-400"></i>采集状态
                </h3>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 max-h-72 overflow-y-auto pr-1 custom-scrollbar">
                    <template x-for="task in tasks" :key="task.asin">
                        <div class="p-3.5 rounded-xl border transition-all duration-300 bg-white shadow-sm hover:shadow-md"
                            :class="{
                                'border-slate-200 bg-slate-50': task.status === 'pending',
                                'border-indigo-200 bg-indigo-50 shadow-indigo-50': task.status === 'scraping',
                                'border-emerald-200 bg-emerald-50 shadow-emerald-50': task.status === 'success',
                                'border-rose-200 bg-rose-50 shadow-rose-50': task.status === 'failed'
                             }">
                            <div class="flex items-center justify-between mb-2 pb-2 border-b border-dashed"
                                :class="task.status === 'pending' ? 'border-slate-200' : 'border-slate-100'">
                                <span class="font-mono font-bold text-base text-slate-800" x-text="task.asin"></span>
                                <div class="w-6 h-6 rounded-full flex items-center justify-center" :class="{
                                        'bg-slate-200 text-slate-500': task.status === 'pending',
                                        'bg-indigo-100 text-indigo-600': task.status === 'scraping',
                                        'bg-emerald-100 text-emerald-600': task.status === 'success',
                                        'bg-rose-100 text-rose-600': task.status === 'failed'
                                     }">
                                    <i class="fas text-sm" :class="{
                                        'fa-circle': task.status === 'pending',
                                        'fa-circle-notch fa-spin': task.status === 'scraping',
                                        'fa-check-circle': task.status === 'success',
                                        'fa-times-circle': task.status === 'failed'
                                    }"></i>
                                </div>
                            </div>

                            <div class="text-xs text-slate-600 min-h-[2rem] flex items-center justify-center w-full">
                                <template x-if="task.status === 'success'">
                                    <div x-html="task.message"></div>
                                </template>
                                <template x-if="task.status !== 'success'">
                                    <div class="flex items-center gap-1.5 opacity-90 w-full justify-center">
                                        <span x-text="task.message" class="truncate font-medium"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>

        <!-- Right: History & Tools -->
        <div class="space-y-6">
            <!-- History Card -->
            <div class="glass-card rounded-2xl shadow-lg border border-slate-200 p-6 bg-white">
                <div class="flex items-center justify-between w-full border-b border-slate-100 pb-3 mb-4">
                    <span class="flex items-center gap-2 text-slate-800 font-bold text-base">
                        <i class="fas fa-history text-indigo-500"></i>
                        历史快照
                    </span>
                    <button @click="clearAllHistory()" x-show="history.length > 0"
                        class="text-xs text-slate-500 hover:text-rose-600 transition-colors flex items-center gap-1 px-2 py-1 rounded hover:bg-rose-50">
                        <i class="fas fa-trash-alt"></i> 清空
                    </button>
                </div>

                <div class="space-y-2 max-h-112 overflow-y-auto custom-scrollbar">
                    <template x-for="item in history" :key="item.id">
                        <div class="relative p-3 rounded-xl border bg-white mb-2 group transition-all hover:border-indigo-200 hover:shadow-sm border-slate-200 cursor-pointer"
                            @click="loadHistoryItem(item)">

                            <!-- Header -->
                            <div class="flex items-start justify-between mb-2 relative z-10">
                                <div class="flex items-center gap-2">
                                    <span
                                        class="text-lg flex items-center justify-center w-7 h-7 rounded-lg bg-gray-50 border border-gray-100 shrink-0"
                                        x-text="getFlag(item.site)"></span>
                                    <div class="flex flex-col">
                                        <div class="flex items-center gap-1.5">
                                            <span class="text-sm font-bold text-gray-800 tracking-tight leading-none"
                                                x-text="getSiteName(item.site) + '站'"></span>
                                            <template x-if="item.report">
                                                <span
                                                    class="inline-flex items-center px-1.5 py-[1px] rounded-md text-[9px] font-bold bg-indigo-50 text-indigo-600 border border-indigo-100">
                                                    <i class="fas fa-magic mr-1"></i>已分析
                                                </span>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1">
                                    <span
                                        class="text-[10px] text-gray-400 font-mono bg-gray-50 px-1.5 py-0.5 rounded border border-gray-100"
                                        x-text="formatDate(item.timestamp)"></span>
                                    <button @click.stop="deleteHistoryItem(item.id)"
                                        class="w-5 h-5 flex items-center justify-center rounded text-gray-300 hover:text-rose-500 hover:bg-rose-50 transition-colors opacity-0 group-hover:opacity-100"
                                        title="删除">
                                        <i class="fas fa-times text-[10px]"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Tags -->
                            <div class="flex flex-wrap gap-1.5 mb-2 relative z-10 pl-0.5">
                                <template x-for="asin in item.asins.slice(0,3)" :key="asin">
                                    <span
                                        class="text-[10px] font-mono font-medium text-gray-600 bg-gray-50 border border-gray-100 px-1.5 py-0.5 rounded"
                                        x-text="asin"></span>
                                </template>
                                <template x-if="item.asins.length > 3">
                                    <span class="text-[10px] text-gray-400 font-medium px-1"
                                        x-text="'+' + (item.asins.length - 3)"></span>
                                </template>
                            </div>

                            <!-- Footer Stats -->
                            <div class="flex items-center justify-between pt-2 border-t border-gray-50">
                                <div class="flex gap-4">
                                    <div class="flex items-center gap-1.5">
                                        <span class="text-[9px] text-gray-400">商品</span>
                                        <span class="text-[11px] font-bold font-mono text-gray-700"
                                            x-text="item.asins.length"></span>
                                    </div>
                                </div>
                                <div
                                    class="w-6 h-6 flex items-center justify-center rounded-full bg-slate-100 text-slate-400 hover:bg-indigo-600 hover:text-white transition-all">
                                    <i class="fas fa-arrow-right text-[9px]"></i>
                                </div>
                            </div>
                        </div>
                    </template>

                    <div x-show="history.length === 0"
                        class="flex flex-col items-center justify-center py-12 text-slate-300 border-2 border-dashed border-slate-100 rounded-2xl bg-slate-50/30">
                        <i class="far fa-folder-open text-4xl mb-3 opacity-40"></i>
                        <p class="text-sm font-medium">暂无历史数据</p>
                    </div>
                </div>
            </div>

            <!-- Plugin Download Card -->
            <div class="glass-card rounded-2xl shadow-lg border border-slate-200 p-6 bg-white">
                <h3 class="text-sm font-semibold text-slate-800 mb-4 flex items-center justify-between">
                    <span class="flex items-center gap-2">
                        <i class="fas fa-puzzle-piece text-indigo-500"></i> 插件/工具下载
                    </span>
                </h3>
                <div class="space-y-3">
                    <div
                        class="group flex items-center justify-between p-3 bg-white rounded-xl border border-slate-100 hover:border-indigo-200 hover:shadow-md transition-all duration-300">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-500 flex items-center justify-center group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                                <i class="fab fa-chrome text-xl"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-sm font-medium text-slate-700">Amazon Scraper插件</span>
                                <span class="text-[10px] text-slate-400 font-mono">v1.3.1</span>
                            </div>
                        </div>
                        <a href="/downloads/Amazon-Scraper-v1.3.1.zip" download
                            class="w-8 h-8 flex items-center justify-center rounded-lg bg-slate-50 text-slate-400 hover:bg-indigo-600 hover:text-white hover:shadow-lg transition-all active:scale-95">
                            <i class="fa-solid fa-download"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
