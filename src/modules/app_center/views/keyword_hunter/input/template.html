<!-- Input Module Template -->

<section id="keyword-hunter-module-input" class="flex-1 overflow-y-auto pb-20">
  <div class="module-container">
    <!-- ========== Welcome Banner ========== -->
    <div class="wb-container wb-container--card wb-theme-cyan mb-8">
      <div class="wb-card">
        <div class="wb-bg-gradient"></div>
        <div class="wb-grid-pattern"></div>

        <div class="wb-content">
          <div class="wb-header">
            <div class="wb-icon-wrapper">
              <div class="wb-icon-main" aria-label="关键词输入功能图标">
                <i class="fas fa-keyboard" aria-hidden="true"></i>
              </div>
              <div class="wb-icon-badge" aria-label="完成状态">
                <i class="fas fa-check" aria-hidden="true"></i>
              </div>
            </div>

            <div class="wb-text">
              <div class="wb-title-row">
                <h1 class="wb-title">关键词与 Listing 文案输入</h1>
                <span class="wb-badge wb-badge-service badge badge--service" aria-label="服务功能">
                  <i class="fas fa-keyboard" aria-hidden="true"></i>STEP 1
                </span>
              </div>
              <p class="wb-description">
                输入或粘贴关键词与目标 Listing
                文案，一键去重、格式化处理，为您准备高质量的分析数据源。
              </p>

              <ul class="wb-tags" role="list">
                <li class="wb-tag" role="listitem">
                  <div class="wb-tag-dot" aria-hidden="true"></div>
                  <span>多语种支持</span>
                </li>
                <li class="wb-tag" role="listitem">
                  <div class="wb-tag-dot wb-tag-dot--indigo" aria-hidden="true"></div>
                  <span>智能去重</span>
                </li>
                <li class="wb-tag" role="listitem">
                  <div class="wb-tag-dot wb-tag-dot--green" aria-hidden="true"></div>
                  <span>格式清洗</span>
                </li>
                <li class="wb-tag" role="listitem">
                  <div class="wb-tag-dot wb-tag-dot--rose" aria-hidden="true"></div>
                  <span>一键分析</span>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ========== Input Workspace ========== -->
    <div class="keyword-hunter-input-workspace">
      <!-- ========== Input Cards Grid ========== -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 keyword-hunter-input-grid">
        <!-- ===== Keywords Input (1/3) ===== -->
        <div
          class="lg:col-span-1 keyword-hunter-input-card rounded-2xl shadow-sm shadow-slate-200/50 border border-slate-200/80 bg-white overflow-hidden"
        >
          <!-- Card Header -->
          <div class="px-5 pt-5 pb-4 border-b border-slate-100">
            <div class="flex items-center justify-between">
              <h2
                id="keyword-hunter-keywords-input-label"
                class="text-base font-bold text-slate-800 flex items-center gap-2.5"
              >
                <div
                  class="keyword-hunter-keywords-icon w-8 h-8 rounded-lg flex items-center justify-center"
                >
                  <svg
                    class="w-4 h-4"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"
                    />
                  </svg>
                </div>
                关键词列表
              </h2>
              <div class="flex items-center gap-1.5">
                <button
                  id="keyword-hunter-btn-clean-kw"
                  type="button"
                  class="keyword-hunter-title-icon-btn"
                  title="清理格式"
                  aria-label="清理格式"
                >
                  <i class="fas fa-broom" aria-hidden="true"></i>
                </button>
                <button
                  id="keyword-hunter-btn-undo-kw-clean"
                  type="button"
                  class="keyword-hunter-title-icon-btn"
                  title="撤回上一步"
                  aria-label="撤回上一步"
                  disabled
                >
                  <i class="fas fa-rotate-left" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>

          <!-- Card Body -->
          <div class="p-5">
            <div class="relative keyword-hunter-textarea-container">
              <div
                class="keyword-input-wrapper keyword-hunter-editor-shell keyword-hunter-editor-shell--primary rounded-xl overflow-hidden border-2 border-slate-200 transition duration-200"
              >
                <div
                  id="keyword-hunter-keyword-highlight-layer"
                  class="keyword-input-highlight"
                ></div>
                <textarea
                  id="keyword-hunter-keywords-input"
                  class="keyword-input-textarea w-full p-4 border-0 focus:ring-0 text-sm scrollbar-thin transition-colors placeholder:text-slate-300 leading-relaxed"
                  aria-label="关键词列表"
                  aria-labelledby="keyword-hunter-keywords-input-label"
                  aria-describedby="keyword-hunter-keywords-input-helper keyword-hunter-keyword-count-label keyword-hunter-duplicate-badge"
                  placeholder="请输入关键词列表，每行一个&#10;&#10;支持全语种 (DE/FR/IT/ES/NL 等)&#10;&#10;示例：&#10;wireless earbuds&#10;bluetooth headphones&#10;noise cancelling earphones"
                ></textarea>
              </div>
              <p id="keyword-hunter-keywords-input-helper" class="mt-2 text-[11px] text-slate-400">
                每行一个关键词，支持多语种；清理格式会自动去重。
              </p>

              <!-- Stats Bar -->
              <div class="keyword-hunter-editor-meta keyword-hunter-editor-meta--right">
                <span
                  id="keyword-hunter-keyword-count-label"
                  class="keyword-hunter-keyword-count-badge inline-flex items-center gap-1 px-2.5 py-1 rounded-full font-semibold text-[11px]"
                >
                  <i
                    class="fas fa-hashtag text-[8px] keyword-hunter-keyword-count-badge__muted"
                    aria-hidden="true"
                  ></i>
                  <span id="keyword-hunter-keyword-count">0</span>
                  <span class="keyword-hunter-keyword-count-badge__muted font-normal">词</span>
                </span>
                <span
                  id="keyword-hunter-duplicate-badge"
                  class="keyword-hunter-duplicate-badge inline-flex items-center gap-1 px-2.5 py-1 rounded-full font-semibold text-[11px] border hidden"
                >
                  <i class="fas fa-copy text-[8px] text-amber-400"></i>
                  <span id="keyword-hunter-duplicate-count">0</span>
                  <span class="text-amber-400 font-normal">重复</span>
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- ===== Listing Copy Input (2/3) ===== -->
        <div
          class="lg:col-span-2 keyword-hunter-input-card rounded-2xl shadow-sm shadow-slate-200/50 border border-slate-200/80 bg-white overflow-hidden"
        >
          <!-- Card Header -->
          <div class="px-5 pt-5 pb-4 border-b border-slate-100">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-bold text-slate-800 flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-emerald-50 flex items-center justify-center">
                  <i class="fas fa-file-alt text-emerald-500 text-sm"></i>
                </div>
                <span id="keyword-hunter-copy-input-label">目标 Listing 文案</span>
              </h2>

              <!-- Action Buttons -->
              <div class="flex items-center gap-2">
                <button
                  id="keyword-hunter-btn-clean-copy"
                  type="button"
                  class="keyword-hunter-title-icon-btn"
                  title="清理文案格式"
                  aria-label="清理文案格式"
                >
                  <i class="fas fa-broom" aria-hidden="true"></i>
                </button>
                <button
                  id="keyword-hunter-btn-paste"
                  type="button"
                  class="keyword-hunter-title-icon-btn"
                  title="粘贴文案"
                  aria-label="粘贴文案"
                >
                  <i class="fas fa-paste" aria-hidden="true"></i>
                </button>
                <button
                  id="keyword-hunter-btn-clear-copy"
                  type="button"
                  class="keyword-hunter-title-icon-btn keyword-hunter-title-icon-btn--danger"
                  title="清空文案"
                  aria-label="清空文案"
                >
                  <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                </button>
                <!-- Divider -->
                <div class="w-px h-6 bg-slate-200 mx-0.5"></div>

                <!-- Start Analysis Button -->
                <button
                  id="keyword-hunter-btn-start-analysis"
                  type="button"
                  class="keyword-hunter-title-icon-btn keyword-hunter-title-icon-btn--primary keyword-hunter-title-action-btn"
                  title="开始分析"
                  aria-label="开始分析"
                >
                  <i class="fas fa-play" aria-hidden="true"></i>
                  <span>开始分析</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Card Body -->
          <div class="p-5">
            <div class="relative keyword-hunter-textarea-container">
              <div
                class="keyword-hunter-editor-shell rounded-xl overflow-hidden border-2 border-slate-200 focus-within:border-emerald-500 focus-within:ring-2 focus-within:ring-emerald-500/20 transition duration-200"
              >
                <textarea
                  id="keyword-hunter-copy-input"
                  class="w-full p-4 border-0 focus:ring-0 text-sm scrollbar-thin transition-colors placeholder:text-slate-300 leading-relaxed"
                  aria-label="Amazon 产品文案"
                  aria-labelledby="keyword-hunter-copy-input-label"
                  aria-describedby="keyword-hunter-copy-input-helper copy-char-count-label"
                  placeholder="请粘贴您的 Amazon 产品文案&#10;包括标题、五点描述、产品描述等&#10;&#10;示例：&#10;【Premium Wireless Earbuds】Experience crystal-clear sound&#10;with our Bluetooth headphones featuring advanced noise&#10;cancelling technology..."
                ></textarea>
              </div>

              <!-- Stats Bar -->
              <div class="keyword-hunter-editor-meta keyword-hunter-editor-meta--right">
                <!-- Quick tip -->
                <span
                  id="keyword-hunter-copy-input-helper"
                  class="keyword-hunter-editor-tip text-[10px] text-slate-300 font-medium hidden sm:flex items-center gap-1"
                >
                  <i class="fas fa-lightbulb text-[9px]"></i>
                  Tip: 包含完整 Listing 内容可提升分析精度
                </span>
                <span
                  id="copy-char-count-label"
                  class="inline-flex items-center gap-1 px-2.5 py-1 bg-emerald-50 text-emerald-700 rounded-full font-semibold text-[11px] border border-emerald-100"
                >
                  <i class="fas fa-font text-[8px] text-emerald-600"></i>
                  <span id="copy-char-count">0</span>
                  <span class="text-emerald-700 font-normal">字符</span>
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ========== History Snapshots ========== -->
      <aside class="keyword-hunter-input-snapshot-panel" aria-label="Keyword Hunter 历史快照">
        <div class="keyword-hunter-input-snapshot-head">
          <div class="keyword-hunter-input-snapshot-title">
            <div class="keyword-hunter-input-snapshot-icon">
              <i class="fas fa-history" aria-hidden="true"></i>
            </div>
            <div class="keyword-hunter-input-snapshot-copy">
              <div class="keyword-hunter-input-snapshot-title-row">
                <h3>历史快照</h3>
                <p
                  id="keyword-hunter-input-snapshot-count"
                  class="keyword-hunter-input-snapshot-count"
                >
                  0 个快照
                </p>
              </div>
              <div
                id="keyword-hunter-input-draft-status"
                class="keyword-hunter-input-draft-status idle"
                role="status"
                aria-live="polite"
                aria-atomic="true"
              >
                <span class="keyword-hunter-input-draft-dot" aria-hidden="true"></span>
                <span id="keyword-hunter-input-draft-label" class="keyword-hunter-input-draft-label"
                  >空白</span
                >
                <span
                  id="keyword-hunter-input-draft-detail"
                  class="keyword-hunter-input-draft-detail"
                  >本机草稿为空</span
                >
              </div>
            </div>
          </div>
          <button
            id="keyword-hunter-input-snapshot-save"
            type="button"
            class="keyword-hunter-input-snapshot-save"
            title="保存当前快照"
            aria-label="保存当前快照"
          >
            <i class="fas fa-floppy-disk" aria-hidden="true"></i>
          </button>
        </div>

        <div
          id="keyword-hunter-input-snapshot-loading"
          class="keyword-hunter-input-snapshot-loading hidden"
          role="status"
          aria-live="polite"
        >
          <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i>
          <span>正在加载快照</span>
        </div>

        <div
          id="keyword-hunter-input-snapshot-empty"
          class="keyword-hunter-input-snapshot-empty hidden"
          role="status"
          aria-live="polite"
        >
          <i class="far fa-folder-open" aria-hidden="true"></i>
          <strong>还没有历史快照</strong>
          <span>当前没有可恢复的关键词与文案记录。</span>
          <span><b>推荐操作：</b>填写关键词和 Listing 文案后，点击右上角保存快照。</span>
        </div>

        <div
          id="keyword-hunter-input-snapshot-list"
          class="keyword-hunter-input-snapshot-list"
        ></div>
      </aside>
    </div>
  </div>
</section>
