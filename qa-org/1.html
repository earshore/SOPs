<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Rufus AI 预研生成器 (8维分析版)</title>
    <style>
        :root {
            --amazon-dark: #232f3e;
            --amazon-light: #37475a;
            --amazon-orange: #ff9900;
            --bg-color: #f3f3f3;
            --text-color: #333;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; }
        
        /* Layout */
        .container { display: flex; width: 100%; height: 100%; }
        .panel { flex: 1; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .left-panel { background-color: #fff; border-right: 1px solid #ddd; max-width: 40%; }
        .right-panel { background-color: #fafafa; }

        /* Components */
        h2 { color: var(--amazon-dark); border-bottom: 3px solid var(--amazon-orange); padding-bottom: 10px; display: inline-block; }
        .label { font-weight: bold; margin-top: 15px; display: block; font-size: 0.9em; color: var(--amazon-light); }
        
        textarea { width: 100%; height: 400px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 14px; resize: vertical; }
        
        button { background-color: var(--amazon-orange); color: var(--amazon-dark); border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 20px; transition: background 0.3s; }
        button:hover { background-color: #e88b00; }

        /* Cards */
        .qa-card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 5px solid var(--amazon-orange); position: relative; }
        .qa-card .tag { position: absolute; top: 10px; right: 10px; font-size: 10px; text-transform: uppercase; background: #eee; padding: 4px 8px; border-radius: 4px; color: #666; }
        .question { font-weight: bold; font-size: 1.1em; color: var(--amazon-dark); margin-bottom: 10px; display: flex; align-items: center; }
        .question::before { content: "Q:"; margin-right: 8px; color: var(--amazon-orange); font-weight: 900; }
        .answer { color: #555; line-height: 1.6; }
        .answer::before { content: "A:"; margin-right: 8px; color: var(--amazon-light); font-weight: 900; }
        .seo-highlight { background-color: rgba(255, 153, 0, 0.2); border-bottom: 2px solid var(--amazon-orange); font-weight: 600; padding: 0 2px; cursor: help; }
        
        .stats { margin-bottom: 20px; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="panel left-panel">
        <h2>竞品分析报告输入</h2>
        <p>输入您的8维分析JSON数据，系统将自动解析维度并生成Rufus Q&A。</p>
        
        <label class="label">分析报告 JSON</label>
        <textarea id="jsonInput"></textarea>
        
        <button onclick="app.generate()">生成 Rufus 预研 Q&A</button>
    </div>

    <div class="panel right-panel">
        <h2>Rufus AI 预研结果</h2>
        <div class="stats" id="statsOutput">等待生成...</div>
        <div id="outputContainer">
            </div>
    </div>
</div>

<script>
    /**
     * 模拟 TS 接口结构
     * interface AnalysisReport {
     * dimensions: {
     * core_roots: string[];
     * hesitations: string[];
     * personas_scenarios: Array<{persona: string, scenario: string}>;
     * vocabulary_gap: Array<{user_term: string, expert_term: string}>;
     * deal_breakers: string[];
     * aha_moments: string[];
     * promise_reality_gap: string[];
     * }
     * }
     */

    // 默认数据示例
    const DEFAULT_DATA = {
        "dimensions": {
            "core_roots": ["Ergonomic Office Chair", "Lumbar Support", "Breathable Mesh", "Home Office"],
            "selling_points_structure": ["Adaptive Lumbar Support", "4D Adjustable Armrests", "135-degree Recline"],
            "deal_breakers": ["Difficult assembly process", "Seat cushion flattening"],
            "aha_moments": ["Headrest fits tall people over 6ft", "Silent wheels for hardwood"],
            "hesitations": ["Will it fit a small room?", "Is the mesh too rough?", "Can I sit for 10+ hours?"],
            "personas_scenarios": [
                {"persona": "Programmer", "scenario": "coding sessions"},
                {"persona": "Gamer", "scenario": "console gaming"}
            ],
            "vocabulary_gap": [
                {"user_term": "Back pain stopper", "expert_term": "Lumbar Lordosis Support"},
                {"user_term": "Sweaty back", "expert_term": "High-Tensile Breathable Mesh"}
            ],
            "promise_reality_gap": ["Promise: 5-min assembly -> Reality: 20 mins"]
        }
    };

    /**
     * 核心逻辑类：RufusBuilder
     * 负责解析维度，应用SEO策略，生成自然语言
     */
    class RufusBuilder {
        constructor(reportData) {
            this.data = reportData.dimensions;
            this.qaPairs = [];
        }

        // 主执行函数
        build() {
            this.qaPairs = []; // Reset
            
            // 1. 处理“词汇鸿沟”：生成教育型 Q&A (SEO 权重极高)
            this.processVocabularyGaps();

            // 2. 处理“购买前犹豫”：生成转化型 Q&A
            this.processHesitations();

            // 3. 处理“画像与场景”：生成场景型 Q&A
            this.processScenarios();

            // 4. 处理“惊喜顿悟”：生成功能亮点 Q&A
            this.processAhaMoments();
            
            // 5. 处理“劝退点/现实断层”：生成诚实防御型 Q&A
            this.processDefense();

            return this.qaPairs;
        }

        // 辅助：从核心词根中随机选取一个用于SEO植入
        getSEOKeyword() {
            const roots = this.data.core_roots || [];
            if (roots.length === 0) return "product";
            return roots[Math.floor(Math.random() * roots.length)];
        }

        // 逻辑实现：词汇鸿沟 -> Q&A
        processVocabularyGaps() {
            if (!this.data.vocabulary_gap) return;
            
            this.data.vocabulary_gap.forEach(gap => {
                const seoWord = this.getSEOKeyword();
                // 逻辑：用户搜通俗词，Rufus用专业词回答并带上核心词
                this.qaPairs.push({
                    type: "SEO/Education",
                    q: `Does this help with ${gap.user_term}?`,
                    a: `Yes, this <span class="seo-highlight">${seoWord}</span> is specifically designed with <b>${gap.expert_term}</b> to address exactly that issue, ensuring long-term comfort.`
                });
            });
        }

        // 逻辑实现：犹豫点 -> Q&A
        processHesitations() {
            if (!this.data.hesitations) return;

            this.data.hesitations.forEach(hesitation => {
                const seoWord = this.getSEOKeyword();
                // 逻辑：直接正面回答犹豫，并用核心词根强化信心
                this.qaPairs.push({
                    type: "Conversion/Hesitation",
                    q: hesitation,
                    a: `That is a common question. As a premium <span class="seo-highlight">${seoWord}</span>, we have optimized the design to handle this. Based on user feedback, it performs exceptionally well in this regard.`
                });
            });
        }

        // 逻辑实现：场景 -> Q&A
        processScenarios() {
            if (!this.data.personas_scenarios) return;

            this.data.personas_scenarios.forEach(item => {
                const seoWord = this.getSEOKeyword();
                // 逻辑：构造“我能用来做X吗？”的问题
                this.qaPairs.push({
                    type: "Scenario/Persona",
                    q: `Is this chair suitable for a ${item.persona} doing ${item.scenario}?`,
                    a: `Absolutely. This <span class="seo-highlight">${seoWord}</span> is a top choice for ${item.persona}s. The features support ${item.scenario} perfectly, providing the necessary support for long durations.`
                });
            });
        }

        // 逻辑实现：惊喜点 -> Q&A
        processAhaMoments() {
            if (!this.data.aha_moments) return;
            
            this.data.aha_moments.forEach(moment => {
                // 提取惊喜点中的关键词作为问题的主体
                const subject = moment.split(" ")[0] + " " + moment.split(" ")[1]; 
                this.qaPairs.push({
                    type: "Feature/Highlight",
                    q: `What is special about the ${subject}?`,
                    a: `Users frequently discover that ${moment}. It's a key feature of our <span class="seo-highlight">${this.getSEOKeyword()}</span> design.`
                });
            });
        }

        // 逻辑实现：防御性 Q&A (处理劝退点和断层)
        processDefense() {
            const issues = [...(this.data.deal_breakers || []), ...(this.data.promise_reality_gap || [])];
            
            issues.forEach(issue => {
                // 简单的自然语言处理模拟：将负面陈述转化为中性问题
                // 真实生产环境会用 NLP 提取实体，这里用简单规则模拟
                let topic = "this product";
                if (issue.toLowerCase().includes("assembly")) topic = "assembly";
                if (issue.toLowerCase().includes("cushion")) topic = "cushion durability";
                
                this.qaPairs.push({
                    type: "Defense/Honesty",
                    q: `What should I know about the ${topic}?`,
                    a: `Regarding ${topic}: While some users mention "${issue}", we provide comprehensive guides/tools to assist. This transparency is part of our commitment as a leading <span class="seo-highlight">${this.getSEOKeyword()}</span> brand.`
                });
            });
        }
    }

    // UI 控制逻辑
    const app = {
        init: () => {
            document.getElementById('jsonInput').value = JSON.stringify(DEFAULT_DATA, null, 4);
        },

        generate: () => {
            const inputStr = document.getElementById('jsonInput').value;
            try {
                const jsonData = JSON.parse(inputStr);
                const builder = new RufusBuilder(jsonData);
                const results = builder.build();
                app.render(results, jsonData.dimensions.core_roots);
            } catch (e) {
                alert("JSON 格式错误，请检查输入。\n" + e.message);
            }
        },

        render: (qaPairs, roots) => {
            const container = document.getElementById('outputContainer');
            const stats = document.getElementById('statsOutput');
            container.innerHTML = '';
            
            stats.innerHTML = `成功生成 <b>${qaPairs.length}</b> 组 Q&A | SEO 核心词根植入: ${roots.join(", ")}`;

            qaPairs.forEach((item, index) => {
                // 模拟打字机效果或淡入效果，这里用简单的延迟显示
                const card = document.createElement('div');
                card.className = 'qa-card';
                card.style.animation = `fadeIn 0.5s ease forwards ${index * 0.1}s`;
                card.innerHTML = `
                    <span class="tag">${item.type}</span>
                    <div class="question">${item.q}</div>
                    <div class="answer">${item.answer_with_seo || item.a}</div>
                `;
                container.appendChild(card);
            });
        }
    };

    // 初始化
    app.init();
</script>

</body>
</html>
