<!-- Analysis Module Template -->
<section class="flex-1 overflow-y-auto pb-20">
    <div class="app-center-container">
        <!-- Analysis Module Welcome -->
        <div class="mb-6">
            <div class="bg-gradient-to-br from-slate-50 via-purple-50/30 to-pink-50/30 rounded-2xl border border-slate-200/60 p-8 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-purple-100/30 to-pink-100/40 rounded-full blur-3xl -translate-y-1/2 translate-x-1/2"></div>
                <div class="absolute bottom-0 left-0 w-48 h-48 bg-gradient-to-tr from-fuchsia-100/30 to-purple-100/30 rounded-full blur-2xl translate-y-1/3 -translate-x-1/3"></div>
                <div class="relative z-10">
                    <div class="flex items-start gap-6">
                        <div class="app-center-icon-container bg-gradient-to-br from-purple-500 to-pink-600 shadow-lg shadow-purple-500/20">
                            <i class="fas fa-chart-line text-white"></i>
                        </div>
                        <div class="flex-1">
                            <h2 class="text-xl font-bold text-slate-800 mb-2">深度分析报告</h2>
                            <p class="text-slate-600 text-sm leading-relaxed max-w-xl">
                                基于大数据的多维分析,生成包含覆盖率、高频词和 AI 诊断的专业报告,助您通过数据驱动决策。
                            </p>
                        </div>
                    </div>
                    <div class="mt-6 grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div class="flex items-center gap-3 bg-white/60 backdrop-blur-sm rounded-xl px-4 py-3 border border-slate-200/50">
                            <span class="w-7 h-7 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center text-xs font-bold">1</span>
                            <span class="text-sm text-slate-600">生成报告</span>
                        </div>
                        <div class="flex items-center gap-3 bg-white/60 backdrop-blur-sm rounded-xl px-4 py-3 border border-slate-200/50">
                            <span class="w-7 h-7 rounded-lg bg-pink-100 text-pink-600 flex items-center justify-center text-xs font-bold">2</span>
                            <span class="text-sm text-slate-600">查看统计</span>
                        </div>
                        <div class="flex items-center gap-3 bg-white/60 backdrop-blur-sm rounded-xl px-4 py-3 border border-slate-200/50">
                            <span class="w-7 h-7 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs font-bold">3</span>
                            <span class="text-sm text-slate-600">优化策略</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- AI 深度诊断 -->
        <div class="app-center-card h-auto mb-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-user-doctor text-purple-500"></i> AI 深度诊断
                <span class="text-xs bg-purple-100 text-purple-600 px-2 py-1 rounded-full ml-2">仅供参考</span>
            </h2>

            <button id="kt-analyze-btn" onclick="window.kt_runLLMAnalysis()" disabled
                class="px-4 py-2 bg-purple-600 text-white hover:bg-purple-700 rounded-lg text-sm font-medium transition-all shadow-sm flex items-center gap-2">
                <i class="fas fa-magic"></i> 生成报告
            </button>
        </div>

        <div id="kt-llm-analysis-result"
            class="h-auto min-h-[160px] bg-slate-50 rounded-xl p-6 markdown-content border border-slate-200">
            <div class="flex flex-col items-center justify-center py-10 text-slate-400 gap-3">
                <i class="fas fa-sparkles text-3xl opacity-30"></i>
                <p class="text-sm">点击上方按钮，让 AI 为您生成深度诊断报告</p>
            </div>
        </div>
    </div>

        <!-- Statistics + Word Frequency -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
            <!-- Coverage Rate -->
            <div class="app-center-card h-auto">
            <h2 class="text-lg font-semibold text-slate-800 mb-6 flex items-center gap-2">
                <i class="fas fa-chart-pie text-blue-500"></i> 关键词覆盖率概览
            </h2>

            <div class="mb-8">
                <div class="flex justify-between items-end mb-2">
                    <span class="text-sm text-slate-500">Keyword Coverage</span>
                    <span id="kt-coverage-rate" class="text-2xl font-bold text-blue-600">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-4 overflow-hidden">
                    <div id="kt-coverage-bar"
                        class="bg-gradient-to-r from-blue-500 to-purple-500 h-4 rounded-full smooth-transition"
                        style="width: 0%"></div>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="grid grid-cols-3 gap-4">
                <div class="p-4 bg-green-50 rounded-xl border border-green-100 text-center">
                    <div id="kt-stat-matched" class="text-2xl font-bold text-green-600">0</div>
                    <div class="text-xs text-green-800 mt-1">已匹配</div>
                </div>
                <div class="p-4 bg-red-50 rounded-xl border border-red-100 text-center">
                    <div id="kt-stat-unmatched" class="text-2xl font-bold text-red-600">0</div>
                    <div class="text-xs text-red-800 mt-1">未匹配</div>
                </div>
                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                    <div id="kt-stat-total" class="text-2xl font-bold text-slate-600">0</div>
                    <div class="text-xs text-slate-500 mt-1">总词数</div>
                </div>
            </div>
        </div>

            <!-- Word Frequency -->
            <div class="app-center-card h-auto">
            <h3 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
                <i class="fas fa-cloud text-indigo-500"></i> 高频词云 (Top 50)
            </h3>
            <div id="kt-word-frequency-list" class="flex flex-wrap gap-2 max-h-64 overflow-y-auto scrollbar-thin">
                <!-- 高频词将在这里动态渲染 -->
            </div>
            </div>
        </div>
    </div>
</section>
