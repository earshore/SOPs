<div class="deep-chat-shell">
  <div
    class="wb-container wb-container--card wb-container--hidden wb-theme-supply deep-chat-welcome"
    aria-labelledby="deep-chat-welcome-title"
    aria-hidden="true"
  >
    <div class="wb-card">
      <div class="wb-bg-gradient"></div>
      <div class="wb-content">
        <div class="wb-header">
          <div class="wb-icon-wrapper">
            <div class="wb-icon-main">
              <i class="far fa-comments" aria-hidden="true"></i>
            </div>
            <div class="wb-icon-badge">
              <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
            </div>
          </div>
          <div class="wb-text">
            <div class="wb-title-row">
              <h2 id="deep-chat-welcome-title" class="wb-title">Deep Chat 助手</h2>
              <span class="wb-badge wb-badge-ai" aria-label="AI 对话功能">
                <i class="fas fa-bolt" aria-hidden="true"></i>Playground
              </span>
            </div>
            <p class="wb-description">
              面向运营任务的多模型对话工作台，用于快速生成 SOP 草稿、Listing 改写方向和分析提示词。
            </p>
            <ul class="wb-tags" role="list">
              <li class="wb-tag" role="listitem">
                <span class="wb-tag-dot" aria-hidden="true"></span>
                <span>多模型对话</span>
              </li>
              <li class="wb-tag" role="listitem">
                <span class="wb-tag-dot wb-tag-dot--blue" aria-hidden="true"></span>
                <span>SOP 草稿</span>
              </li>
              <li class="wb-tag" role="listitem">
                <span class="wb-tag-dot wb-tag-dot--green" aria-hidden="true"></span>
                <span>Listing 改写</span>
              </li>
              <li class="wb-tag" role="listitem">
                <span class="wb-tag-dot wb-tag-dot--amber" aria-hidden="true"></span>
                <span>Prompt 实验</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="deep-chat-page">
    <button
      id="deep-chat-drawer-backdrop"
      class="deep-chat-drawer-backdrop"
      type="button"
      aria-label="关闭侧栏"
      hidden
    ></button>
    <aside id="deep-chat-thread-rail" class="deep-chat-thread-rail" aria-label="Deep Chat 会话">
      <div class="deep-chat-rail-brand">
        <h1 class="text-base font-bold text-slate-800 flex items-center gap-2.5">
          <div class="deep-chat-rail-icon">
            <i class="far fa-comments" aria-hidden="true"></i>
          </div>
          Deep Chat
        </h1>
      </div>

      <div class="deep-chat-thread-actions">
        <button id="deep-chat-clear-chat" class="deep-chat-new-thread" type="button">
          <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
          <span>新建会话</span>
        </button>
        <button id="deep-chat-search-chats" class="deep-chat-search-chats" type="button">
          <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
          <span>搜索会话</span>
        </button>
      </div>

      <div class="deep-chat-thread-list-wrap">
        <h3 class="deep-chat-panel-title">最近会话</h3>
        <div id="deep-chat-thread-list" class="deep-chat-thread-list" aria-label="最近会话"></div>
      </div>
    </aside>

    <section class="deep-chat-main" aria-label="Deep Chat">
      <div class="deep-chat-mobile-rail-bar" aria-label="窄屏侧栏">
        <button
          id="deep-chat-open-thread-drawer"
          class="deep-chat-mobile-rail-btn"
          type="button"
          data-drawer="thread"
        >
          <i class="far fa-comments" aria-hidden="true"></i>
          <span>会话</span>
        </button>
        <button
          id="deep-chat-open-prompt-drawer"
          class="deep-chat-mobile-rail-btn"
          type="button"
          data-drawer="prompt"
        >
          <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
          <span>Prompt</span>
        </button>
      </div>
      <header class="deep-chat-topbar">
        <div class="deep-chat-model-area">
          <button
            id="deep-chat-toggle-rail"
            class="deep-chat-top-icon"
            type="button"
            title="收起最近会话"
            aria-label="收起最近会话"
            aria-controls="deep-chat-thread-rail"
            aria-expanded="true"
          >
            <i class="far fa-window-maximize" aria-hidden="true"></i>
          </button>
          <select
            id="deep-chat-model-select"
            class="deep-chat-select"
            aria-label="模型选择"
            disabled
          >
            <option value="">默认</option>
          </select>
          <button
            id="deep-chat-refresh-config"
            class="deep-chat-top-icon"
            type="button"
            title="刷新模型配置"
            aria-label="刷新模型配置"
          >
            <i class="fas fa-rotate" aria-hidden="true"></i>
          </button>
          <button id="deep-chat-open-settings" class="deep-chat-config-link" type="button" hidden>
            配置模型
          </button>
        </div>

        <div class="deep-chat-top-actions">
          <button id="deep-chat-open-promptlab" class="deep-chat-promptlab-link" type="button">
            <i class="fas fa-wand-magic-sparkles" aria-hidden="true"></i>
            <span>生成 Prompt</span>
          </button>
          <details class="deep-chat-tuning-panel">
            <summary title="调试参数" aria-label="调试参数">
              <i class="fas fa-sliders" aria-hidden="true"></i>
            </summary>
            <div class="deep-chat-tuning">
              <label class="deep-chat-field deep-chat-field-system" for="deep-chat-system-prompt">
                <span>系统提示词</span>
                <textarea
                  id="deep-chat-system-prompt"
                  rows="3"
                  placeholder="可选：仅用于当前 Deep Chat 会话"
                ></textarea>
              </label>
              <label
                class="deep-chat-field deep-chat-field-temperature"
                for="deep-chat-temperature"
              >
                <span>随机性 <output id="deep-chat-temperature-value">0.3</output></span>
                <input
                  id="deep-chat-temperature"
                  type="range"
                  min="0"
                  max="1"
                  step="0.1"
                  value="0.3"
                />
              </label>
              <button id="deep-chat-reset-tuning" class="deep-chat-reset-tuning" type="button">
                重置参数
              </button>
            </div>
          </details>
        </div>
      </header>

      <div class="deep-chat-stage">
        <div
          id="deep-chat-skill-load-banner"
          class="deep-chat-skill-load-banner"
          role="status"
          aria-live="polite"
          hidden
        >
          <i class="fas fa-graduation-cap" aria-hidden="true"></i>
          <span id="deep-chat-skill-load-banner-text">正在载入技能…</span>
        </div>
        <div
          id="deep-chat-pending-status"
          class="deep-chat-pending-status"
          aria-live="polite"
          hidden
        >
          <span class="deep-chat-pending-dot" aria-hidden="true"></span>
          <span id="deep-chat-pending-status-text">正在生成回复...</span>
        </div>
        <div class="deep-chat-wrap">
          <deep-chat id="deep-chat-view" class="deep-chat-view"></deep-chat>
          <button
            id="deep-chat-stop-generation"
            class="deep-chat-stop-generation"
            type="button"
            aria-label="停止生成"
            title="停止生成"
            hidden
          >
            <i class="fas fa-stop" aria-hidden="true"></i>
          </button>
        </div>
        <!-- 贴输入框上方：技能 Chip 在输入框内与正文混排，此处仅状态提示 -->
        <div
          id="deep-chat-skill-context-bar"
          class="deep-chat-skill-context-bar"
          aria-label="已挂载技能"
          hidden
        >
          <div class="deep-chat-skill-context-bar__head">
            <span class="deep-chat-skill-context-bar__label">
              <i class="fas fa-graduation-cap" aria-hidden="true"></i>
              已挂载技能
            </span>
            <span
              id="deep-chat-skill-context-bar-hint"
              class="deep-chat-skill-context-bar__hint"
            ></span>
            <button id="deep-chat-skill-undo" class="deep-chat-skill-undo" type="button" hidden>
              撤销移除
            </button>
          </div>
        </div>
      </div>
    </section>

    <aside id="deep-chat-prompt-rail" class="deep-chat-prompt-rail" aria-label="Prompt 生成记录">
      <div class="deep-chat-prompt-list-wrap">
        <h3 class="deep-chat-panel-title deep-chat-panel-title--prompt">Prompt</h3>
        <div
          id="deep-chat-prompt-list"
          class="deep-chat-prompt-list"
          aria-label="Prompt 生成记录"
        ></div>
      </div>

      <div
        id="deep-chat-prompt-preview-popover"
        class="deep-chat-prompt-preview-popover"
        role="dialog"
        aria-label="Prompt 预览"
        aria-modal="false"
        aria-hidden="true"
      >
        <div class="deep-chat-prompt-preview-title"></div>
        <div class="deep-chat-prompt-preview-body"></div>
      </div>
    </aside>
  </div>

  <div id="deep-chat-search-modal" class="deep-chat-search-modal" aria-hidden="true" hidden>
    <div class="deep-chat-search-backdrop" data-chat-search-close aria-hidden="true"></div>
    <section class="deep-chat-search-dialog" role="dialog" aria-modal="true" aria-label="搜索会话">
      <div class="deep-chat-search-bar">
        <input
          id="deep-chat-search-input"
          class="deep-chat-search-input"
          type="search"
          aria-label="搜索会话"
          autocomplete="off"
          spellcheck="false"
          placeholder="搜索会话..."
        />
        <button
          id="deep-chat-search-close"
          class="deep-chat-search-close"
          type="button"
          data-chat-search-close
          aria-label="关闭搜索会话"
          title="关闭搜索会话"
        >
          <i class="fas fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <button class="deep-chat-search-new" type="button" data-chat-search-new>
        <i class="fa-regular fa-pen-to-square" aria-hidden="true"></i>
        <span>新建会话</span>
      </button>
      <div id="deep-chat-search-results" class="deep-chat-search-results" aria-live="polite"></div>
    </section>
  </div>
</div>
