name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-alpha.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v3.0.5-rc.1). Leave empty to use package.json version only for dry packaging.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: validate-build-publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $tag = $env:GITHUB_REF_NAME
            } else {
              $pkg = Get-Content package.json -Raw | ConvertFrom-Json
              $tag = "v$($pkg.version)"
              Write-Host "workflow_dispatch without tag input; using package.json -> $tag"
            }
          }
          if ($tag -notmatch '^v') { $tag = "v$tag" }
          $version = $tag.Substring(1)
          $isPre = [bool]($version -match '-(alpha|beta|rc)(\.|$)')
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($isPre) {
            "is_prerelease=true" >> $env:GITHUB_OUTPUT
          } else {
            "is_prerelease=false" >> $env:GITHUB_OUTPUT
          }
          Write-Host "tag=$tag version=$version prerelease=$isPre"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version / CHANGELOG
        shell: pwsh
        run: |
          npx tsx scripts/release/prepare-release.ts validate --tag ${{ steps.meta.outputs.tag }}

      - name: Security gate
        run: npm run ci:security

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Lint warning gate
        run: npm run lint:warning-gate

      - name: Unit tests
        run: npx vitest run --coverage=false

      - name: Build app
        # Skip prebuild hooks that re-run full ci:security/quality (already gated above)
        run: npx vite build
        env:
          VITE_APP_VERSION: ${{ steps.meta.outputs.version }}

      - name: Generate release notes
        shell: pwsh
        run: |
          npx tsx scripts/release/prepare-release.ts notes --version ${{ steps.meta.outputs.version }} --out release-artifacts/RELEASE_BODY.md

      - name: Package artifacts
        shell: pwsh
        run: |
          npx tsx scripts/release/prepare-release.ts package --version ${{ steps.meta.outputs.version }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.meta.outputs.version }}
          path: release-artifacts/
          retention-days: 30

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $isPre = '${{ steps.meta.outputs.is_prerelease }}' -eq 'true'
          $notes = 'release-artifacts/RELEASE_BODY.md'
          $assetList = @()
          $dist = Get-ChildItem 'release-artifacts/sops-dist-*' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dist) { $assetList += $dist.FullName }
          foreach ($f in @('release-artifacts/build-info.json', 'release-artifacts/SHA256SUMS.txt')) {
            if (Test-Path $f) { $assetList += (Resolve-Path $f).Path }
          }
          if ($assetList.Count -eq 0) { throw 'No release artifacts found to upload' }

          $exists = $false
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { $exists = $true }

          if ($exists) {
            Write-Host "Updating existing release $tag"
            & gh release upload $tag @assetList --clobber
            if ($isPre) {
              & gh release edit $tag --prerelease --notes-file $notes --title $tag
            } else {
              & gh release edit $tag --latest --notes-file $notes --title $tag
            }
          } else {
            Write-Host "Creating release $tag"
            $createArgs = @('release', 'create', $tag, '--notes-file', $notes, '--title', $tag)
            if ($isPre) { $createArgs += '--prerelease' } else { $createArgs += '--latest' }
            $createArgs += $assetList
            & gh @createArgs
          }

          if ($isPre) {
            & gh release edit $tag --prerelease
          }
