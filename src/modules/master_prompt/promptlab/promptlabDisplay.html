<div id="panel-promptlab" class="panel hidden fade-in">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
        <i class="fas fa-wand-magic-sparkles text-purple-600"></i> Listing
        炼金术工场
      </h2>
      <p class="text-slate-500 text-sm mt-1">
        融合竞品洞察、产品 DNA与SEO关键词，以及A10、COSMO与Rufus
        Ai逻辑，打造高转化率的 Master Prompt
      </p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 relative pb-10">
    <div class="lg:col-span-8 space-y-6">
      
      <div
        id="card-product-dna"
        class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 transition-all duration-300"
      >
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-slate-800 flex items-center gap-2">
            <span
              class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-xs"
              >1</span
            >
            产品 DNA 定义 (Product DNA)
          </h3>
          <select
            id="lab-target-market"
            class="text-xs border-slate-300 rounded-lg focus:ring-indigo-500 border p-1.5 w-48 bg-slate-50 text-slate-700 font-medium"
          >
            <option value="" disabled selected>选择目标站点/语言...</option>
          </select>
        </div>

        <div class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-slate-700 mb-1">
                <span class="text-red-500 mr-1">*</span>Tier 1 核心大词 (Title / Bullet 1) - 必填
              </label>
              <input
                type="text"
                id="lab-keywords-tier1"
                placeholder="humidifiers for bedroom, cool mist humidifier"
                class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border"
              />
            </div>
            <div>
              <label class="block text-xs font-medium text-slate-500 mb-1"
                >目标受众 (Target Audience) - 有就填,报告含此字段</label
              >
              <input
                type="text"
                id="lab-audience"
                placeholder="e.g. Busy moms, Tech enthusiasts"
                class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 p-2 border"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-700 mb-1">
              <span class="text-red-500 mr-1">*</span>Tier 2 长尾词 (Bullets 2-5) - 必填
            </label>
            <textarea
              id="lab-keywords-tier2"
              rows="2"
              placeholder="baby humidifier, easy to clean, quiet operation"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border"
            ></textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1"
              >核心卖点 (USPs) - 每行一个 - 有就填，报告已拆解竞品卖点</label
            >
            <textarea
              id="lab-usps"
              rows="3"
              placeholder="- 专利静音技术 (<28dB)&#10;- 360度旋转喷嘴"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border"
            ></textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1"
              >详细参数 (Specs) - 有就填，报告无此字段</label
            >
            <textarea
              id="lab-specs"
              rows="3"
              placeholder="材质: ABS + PP&#10;尺寸: 20x20x30cm"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border"
            ></textarea>
          </div>

          <div class="pt-2">
            <label class="block text-xs font-medium text-purple-600 mb-1">
              <i class="fab fa-instagram mr-1"></i> 植入社媒“Hook”/节日词 (Social Hooks) - 有就填
            </label>
            <input
              type="text"
              id="lab-social-hook"
              placeholder="例如: 🔥限时半价 / 🎄圣诞特供 / #SummerVibes"
              class="w-full text-sm border-purple-200 rounded-lg focus:ring-purple-500 border p-2 bg-purple-50/20 text-purple-700"
            />
          </div>

          <div class="pt-2">
            <label class="block text-xs font-medium text-slate-500 mb-1"
              <i class="fa-solid fa-ban"></i> 限制词 (Negative) - 有就填
            </label>
            <input
              type="text"
              id="negative-keywords"
              placeholder="例如: bestseller/cure"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 p-2 border"
            />
          </div>
        </div>
      </div>

      <div
        id="card-analysis"
        class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 transition-all duration-300"
      >
        <div class="flex items-center justify-between mb-4">
          <h3 class="font-semibold text-slate-800 flex items-center gap-2">
            <span
              class="w-6 h-6 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs"
              >2</span
            >
            Ai分析报告
          </h3>
          <div
            id="lab-analysis-status"
            class="px-2 py-1 bg-slate-100 text-slate-500 rounded text-xs flex items-center gap-1"
          >
            <i class="fas fa-exclamation-circle"></i> 检测中...
          </div>
        </div>

        <div class="bg-slate-50 rounded-lg p-4 border border-slate-100">
          <div
            class="flex items-center justify-between mb-2 pb-2 border-b border-slate-200"
          >
            <div class="flex items-center gap-2">
              <input
                type="checkbox"
                id="use-analysis-data"
                class="rounded text-blue-600 focus:ring-blue-500"
              />
              <label
                for="use-analysis-data"
                class="text-sm font-medium text-slate-700 cursor-pointer"
                >启用竞品分析数据注入</label
              >
            </div>
          </div>
          <div
            id="report-sections-container"
            class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-60 overflow-y-auto custom-scrollbar"
          >
            <p class="text-xs text-slate-400 italic">暂无报告数据...</p>
          </div>
        </div>
      </div>

      <div
        id="card-strategy"
        class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 mb-10 transition-all duration-300"
      >
        <h3 class="font-semibold text-slate-800 flex items-center gap-2 mb-4">
          <span
            class="w-6 h-6 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-xs"
            >3</span
          >
          生成策略配置
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1"
              >文案语气 Tone</label
            >
            <select
              id="lab-tone"
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-orange-500 p-2 border"
            >
              <option value="professional">Professional (专业)</option>
              <option value="exciting">Exciting (激动人心)</option>
              <option value="emotional">Emotional (情感共鸣)</option>
              <option value="minimalist">Minimalist (极简)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1"
              >自定义生成规则 (Custom Rules) - 有就填</label
            >
            <textarea
              id="lab-custom-strategy"
              rows="1"
              placeholder="例如: 禁止使用'Best Seller'词汇..."
              class="w-full text-sm border-slate-300 rounded-lg focus:ring-orange-500 border p-2"
            ></textarea>
          </div>
        </div>

        <div
          class="mt-4 pt-4 border-t border-slate-100 flex items-center gap-6 flex-wrap"
        >
          <label
            class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer hover:text-slate-900 bg-orange-50 px-2 py-1 rounded border border-orange-100"
          >
            <input
              type="checkbox"
              id="opt-cosmo"
              class="rounded text-orange-500 focus:ring-orange-500"
              checked
            />
            <span>COSMO意图匹配(构建场景化)</span>
          </label>
          <label
            class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer hover:text-slate-900 bg-orange-50 px-2 py-1 rounded border border-orange-100"
          >
            <input
              type="checkbox"
              id="opt-rufus"
              class="rounded text-orange-500 focus:ring-orange-500"
              checked
            />
            <span>Rufus 优化(问答预判)</span>
          </label>
          <label
            class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer hover:text-slate-900 bg-orange-50 px-2 py-1 rounded border border-orange-100"
          >
            <input
              type="checkbox"
              id="opt-emoji"
              class="rounded text-orange-500 focus:ring-orange-500"
              checked
            />
            <span>Emoji 点缀</span>
          </label>
        </div>
      </div>
    </div>

    <div class="lg:col-span-4">
      <div class="sticky top-6 space-y-4">
        <div class="relative w-full group [perspective:1000px]">
          <div
            id="embed-toggle-container"
            class="absolute top-4 right-4 z-[60] bg-white/20 backdrop-blur-md p-1 rounded-lg flex items-center shadow-sm border border-white/10 transition-all duration-500"
          >
            <div
              id="mode-toggle-glider"
              class="absolute top-1 left-1 w-[calc(50%-4px)] h-[calc(100%-8px)] bg-white shadow-sm rounded transition-all duration-300 ease-out z-0"
            ></div>

            <button
              onclick="amz_toggleConsoleMode('listing')"
              id="btn-mode-listing"
              class="relative z-10 px-3 py-1 text-[10px] font-bold rounded transition-colors duration-300 text-blue-600 uppercase tracking-wide cursor-pointer"
            >
              Listing
            </button>

            <button
              onclick="amz_toggleConsoleMode('visual')"
              id="btn-mode-visual"
              class="relative z-10 px-3 py-1 text-[10px] font-bold rounded transition-colors duration-300 text-slate-500 hover:text-pink-600 uppercase tracking-wide cursor-pointer"
            >
              Visual
            </button>
          </div>

          <div
            id="console-card-inner"
            class="relative transition-all duration-700 [transform-style:preserve-3d] grid grid-cols-1 grid-rows-1"
          >
            <div
              class="col-start-1 row-start-1 w-full [backface-visibility:hidden]"
            >
              <div
                class="bg-gradient-to-br from-slate-900 via-slate-800 to-blue-900 rounded-xl shadow-lg shadow-blue-900/20 p-5 text-white h-full flex flex-col gap-6 border border-blue-500/20"
              >


                <div class="pr-24">
                  <h3 class="font-bold text-lg mb-1 flex items-center gap-2">
                    <i class="fas fa-pen-nib text-blue-400"></i>
                    <span
                      >Listing<span
                        class="text-slate-200/50 font-normal text-xs ml-2"
                        >Text Gen</span
                      ></span
                    >
                  </h3>
                  <p class="text-slate-200/60 text-xs">
                    基于 A10 算法生成高转化文本
                  </p>
                </div>

                <div class="space-y-3 pb-2">
                  <button
                    id="btn-generate-prompt"
                    onclick="amz_generateMasterPrompt()"
                    class="w-full py-3 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-400 hover:to-purple-500 text-white font-bold rounded-lg shadow-md transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2 group cursor-pointer"
                  >
                    <i class="fas fa-microchip group-hover:animate-pulse"></i>
                    生成 Master Prompt
                  </button>

                  <div class="grid grid-cols-2 gap-2">
                    <button
                      onclick="amz_copyMasterPrompt()"
                      class="py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition-colors text-slate-300 hover:text-white cursor-pointer backdrop-blur-sm border border-white/5"
                    >
                      <i class="fas fa-copy mr-1"></i> 复制
                    </button>
                    <button
                      onclick="amz_clearPromptInputs()"
                      class="py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition-colors text-slate-300 hover:text-white cursor-pointer backdrop-blur-sm border border-white/5"
                    >
                      <i class="fas fa-trash-alt mr-1"></i> 清空
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div
              class="col-start-1 row-start-1 w-full [backface-visibility:hidden] [transform:rotateY(180deg)]"
            >
              <div
                class="bg-gradient-to-br from-slate-900 via-slate-800 to-pink-900 rounded-xl shadow-lg shadow-pink-900/20 p-5 text-white h-full flex flex-col gap-6 border border-pink-500/20"
              >
                <div class="pr-24">
                  <h3
                    class="font-bold text-lg mb-1 flex items-center gap-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-rose-300"
                  >
                    <i class="fas fa-palette text-pink-400"></i>
                    <span
                      >Visual<span
                        class="text-pink-200/50 font-normal text-xs ml-2"
                        >Art Director</span
                      ></span
                    >
                  </h3>
                  <p class="text-pink-200/60 text-xs">
                    将痛点转化为视觉防御策略
                  </p>
                </div>

                <div class="space-y-3 pb-2">
                  <button
                    id="btn-generate-visual"
                    onclick="amz_generateVisualPrompt()"
                    class="w-full py-3 bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 hover:to-rose-500 text-white font-bold rounded-lg shadow-lg shadow-pink-700/30 transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2 group cursor-pointer border border-pink-400/20"
                  >
                    <i class="fas fa-magic group-hover:spin-slow"></i>
                    生成视觉剧本 (A+/EBC)
                  </button>

                  <div class="grid grid-cols-2 gap-2">
                    <button
                      onclick="amz_copyMasterPrompt()"
                      class="py-2 bg-pink-900/40 hover:bg-pink-800/60 rounded-lg text-sm transition-colors text-pink-100/80 hover:text-white cursor-pointer backdrop-blur-sm border border-pink-500/10"
                    >
                      <i class="fas fa-copy mr-1"></i> 复制
                    </button>
                    <button
                      onclick="amz_clearPromptInputs()"
                      class="py-2 bg-pink-900/40 hover:bg-pink-800/60 rounded-lg text-sm transition-colors text-pink-100/80 hover:text-white cursor-pointer backdrop-blur-sm border border-pink-500/10"
                    >
                      <i class="fas fa-eraser mr-1"></i> 清空
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div
          class="bg-white rounded-xl shadow-md border border-slate-200 flex flex-col h-[500px]"
        >
          <div
            class="p-3 border-b border-slate-100 bg-slate-50 rounded-t-xl flex justify-between items-center"
          >
            <span
              class="text-xs font-bold text-slate-500 uppercase tracking-wider"
              >Output Preview</span
            >
            <div class="flex items-center gap-1 text-xs">
              <span id="prompt-word-count" class="text-slate-400"
                >0 / 5000</span
              >
              <span class="text-slate-300">| Limit:</span>
              <input
                type="number"
                id="lab-char-limit"
                value="5000"
                class="w-12 h-5 text-xs text-center border border-slate-200 rounded text-slate-500 p-0 focus:ring-0 focus:border-blue-400"
              />
            </div>
          </div>
          <textarea
            id="final-prompt-output"
            class="flex-1 w-full p-4 text-xs font-mono text-slate-600 bg-white resize-none focus:outline-none rounded-b-xl transition-colors duration-500"
            placeholder="// 1. 填写左侧信息&#10;// 2. 点击生成按钮&#10;// 3. 复制并发送给 Ai大模型"
            readonly
          ></textarea>
        </div>
      </div>
    </div>
  </div>
</div>
