<!-- 系统设置 (Alpine.js Refactored - Visual Enhanced) -->
<div x-data="settingsPanel" @open-settings.window="open()" @close-settings.window="close()"
    @keydown.escape.window="close()" x-show="isOpen" x-transition.opacity.duration.300ms
    class="fixed inset-0 z-50 flex items-center justify-end" style="display: none;">

    <!-- Backdrop with blur -->
    <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" @click="close()"></div>

    <!-- Modal Panel -->
    <div x-show="isOpen"
        x-transition:enter="transform transition ease-out duration-400"
        x-transition:enter-start="translate-x-full opacity-90"
        x-transition:enter-end="translate-x-0 opacity-100"
        x-transition:leave="transform transition ease-in duration-300"
        x-transition:leave-start="translate-x-0 opacity-100"
        x-transition:leave-end="translate-x-full opacity-90"
        class="relative w-full max-w-lg h-full bg-gradient-to-b from-white to-slate-50/80 shadow-[-8px_0_30px_rgba(0,0,0,0.12)] overflow-hidden flex flex-col">

        <!-- Decorative top accent line -->
        <div class="absolute top-0 left-0 right-0 h-[3px] bg-gradient-to-r from-blue-500 via-indigo-500 to-violet-500"></div>

        <!-- Header -->
        <div class="relative p-5 pb-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/25">
                    <i class="fas fa-sliders-h text-white text-sm"></i>
                </div>
                <div>
                    <h2 class="text-[15px] font-bold text-slate-800 tracking-tight">系统设置</h2>
                    <p class="text-[11px] text-slate-400 mt-0.5">配置模型与网络参数</p>
                </div>
            </div>
            <button @click="close()"
                class="w-8 h-8 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-all duration-200 hover:rotate-90">
                <i class="fas fa-times text-sm"></i>
            </button>
        </div>

        <!-- Subtle separator -->
        <div class="mx-5 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent"></div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-5 py-6 space-y-7"
            style="scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent;">

            <!-- Section 1: LLM Config -->
            <section class="space-y-4">
                <div class="flex items-center gap-2.5 mb-1">
                    <div class="w-6 h-6 rounded-lg bg-violet-100 flex items-center justify-center">
                        <i class="fas fa-robot text-violet-500 text-[10px]"></i>
                    </div>
                    <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-widest">LLM 模型配置</h3>
                </div>

                <!-- 🔒 Security Warning -->
                <div x-show="isProduction && llm.endpoint && isDangerousEndpoint(llm.endpoint)"
                     x-transition:enter="transition ease-out duration-300"
                     x-transition:enter-start="opacity-0 -translate-y-2"
                     x-transition:enter-end="opacity-100 translate-y-0"
                     class="p-4 bg-gradient-to-r from-amber-50 to-orange-50 border border-amber-200/80 rounded-2xl shadow-sm">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-full bg-amber-100 flex items-center justify-center flex-shrink-0 mt-0.5">
                            <i class="fas fa-exclamation-triangle text-amber-500 text-xs"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="font-bold text-amber-800 text-sm mb-1.5">安全警告</h4>
                            <p class="text-xs text-amber-700/80 leading-relaxed mb-2.5">
                                为保护您的 API 密钥安全，生产环境已禁用直接调用外部 API。
                            </p>
                            <div class="flex flex-wrap gap-1.5">
                                <span class="inline-flex items-center gap-1 px-2 py-1 bg-amber-100/80 rounded-md text-[10px] font-medium text-amber-700">
                                    <i class="fas fa-server"></i> 使用内置代理
                                </span>
                                <span class="inline-flex items-center gap-1 px-2 py-1 bg-amber-100/80 rounded-md text-[10px] font-medium text-amber-700">
                                    <i class="fas fa-shield-alt"></i> 配置企业网关
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="space-y-4">
                    <!-- Provider Select -->
                    <div class="group">
                        <label for="llm-provider" class="block text-xs font-semibold text-slate-600 mb-2 group-focus-within:text-blue-600 transition-colors">AI 厂商</label>
                        <div class="relative">
                            <select id="llm-provider" name="llm-provider" x-model="llm.provider"
                                class="w-full pl-4 pr-10 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 appearance-none bg-white text-sm transition-all duration-200 shadow-sm hover:border-slate-300 cursor-pointer">
                                <option value="new_api">✨ NEW API</option>
                            </select>
                            <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none w-5 h-5 rounded-md bg-slate-100 flex items-center justify-center">
                                <i class="fas fa-chevron-down text-slate-400 text-[9px]"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Endpoint -->
                    <div class="group">
                        <label for="llm-endpoint" class="block text-xs font-semibold text-slate-600 mb-2 group-focus-within:text-blue-600 transition-colors">API Endpoint</label>
                        <div class="relative">
                            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded bg-emerald-100 flex items-center justify-center">
                                <i class="fas fa-link text-emerald-500 text-[9px]"></i>
                            </div>
                            <input type="text" id="llm-endpoint" name="llm-endpoint" x-model="llm.endpoint"
                                class="w-full pl-11 pr-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 text-sm font-mono text-slate-600 shadow-sm transition-all duration-200 hover:border-slate-300 placeholder:text-slate-300"
                                placeholder="https://llm-gateway.example.com/" />
                        </div>
                    </div>

                    <!-- API Key -->
                    <div class="group">
                        <label for="llm-api-key" class="block text-xs font-semibold text-slate-600 mb-2 group-focus-within:text-blue-600 transition-colors">API Key</label>
                        <div class="relative">
                            <div class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded bg-amber-100 flex items-center justify-center">
                                <i class="fas fa-key text-amber-500 text-[9px]"></i>
                            </div>
                            <input :type="llm.showKey ? 'text' : 'password'" id="llm-api-key" name="llm-api-key" x-model="llm.apiKey"
                                class="w-full pl-11 pr-11 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 text-sm font-mono text-slate-600 shadow-sm transition-all duration-200 hover:border-slate-300 placeholder:text-slate-300"
                                placeholder="sk-..." />
                            <button @click="llm.showKey = !llm.showKey"
                                class="absolute right-2.5 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-all duration-200">
                                <i class="fas text-xs" :class="llm.showKey ? 'fa-eye-slash' : 'fa-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Model Selection -->
                    <div class="group">
                        <label for="llm-model" class="block text-xs font-semibold text-slate-600 mb-2 group-focus-within:text-blue-600 transition-colors">选择模型</label>
                        <div class="flex gap-2">
                            <div class="relative flex-1">
                                <select id="llm-model" name="llm-model" x-model="llm.model"
                                    class="w-full pl-4 pr-10 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 appearance-none bg-white text-sm shadow-sm transition-all duration-200 hover:border-slate-300 disabled:bg-slate-50 disabled:text-slate-400 disabled:cursor-not-allowed cursor-pointer"
                                    :disabled="llm.models.length === 0">
                                    <option value="">-- 请选择 --</option>
                                    <template x-for="(m, index) in llm.models" :key="index">
                                        <option :value="typeof m === 'string' ? m : m.id"
                                            x-text="typeof m === 'string' ? m : m.id"></option>
                                    </template>
                                </select>
                                <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none w-5 h-5 rounded-md bg-slate-100 flex items-center justify-center">
                                    <i class="fas fa-chevron-down text-slate-400 text-[9px]"></i>
                                </div>
                            </div>
                            <button @click="fetchModels()" :disabled="llm.isFetching"
                                class="px-4 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 hover:border-slate-300 text-slate-600 rounded-xl transition-all duration-200 text-sm font-medium flex items-center gap-2 whitespace-nowrap disabled:opacity-50 disabled:cursor-not-allowed shadow-sm active:scale-[0.97]">
                                <i class="fas text-xs" :class="llm.isFetching ? 'fa-circle-notch fa-spin text-blue-500' : 'fa-sync-alt'"></i>
                                <span x-text="llm.isFetching ? '同步中' : '刷新'"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Model Info Card -->
                    <div x-show="activeModelInfo"
                        x-transition:enter="transition ease-out duration-300"
                        x-transition:enter-start="opacity-0 scale-95"
                        x-transition:enter-end="opacity-100 scale-100"
                        class="p-4 bg-gradient-to-br from-slate-50 to-blue-50/30 rounded-2xl border border-slate-100/80 shadow-sm">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-xl bg-blue-100 flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-expand-alt text-blue-500 text-xs"></i>
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-400 uppercase tracking-wider font-medium block">上下文</span>
                                    <span class="text-sm font-bold text-slate-700"
                                        x-text="activeModelInfo && (activeModelInfo.context / 1000) + 'K'"></span>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 rounded-xl bg-amber-100 flex items-center justify-center flex-shrink-0">
                                    <i class="fas fa-star text-amber-500 text-xs"></i>
                                </div>
                                <div>
                                    <span class="text-[10px] text-slate-400 uppercase tracking-wider font-medium block">特性</span>
                                    <span class="text-sm font-bold text-slate-700"
                                        x-text="activeModelInfo && (activeModelInfo.features.length ? activeModelInfo.features.join(', ') : '基础')"></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex gap-2.5 pt-1">
                        <button @click="testConnection()" :disabled="llm.isTesting"
                            class="flex-1 py-2.5 bg-white border border-slate-200 hover:bg-slate-50 hover:border-slate-300 text-slate-700 font-medium rounded-xl transition-all duration-200 text-sm flex items-center justify-center gap-2 shadow-sm disabled:opacity-50 active:scale-[0.97]">
                            <i class="fas text-xs" :class="llm.isTesting ? 'fa-circle-notch fa-spin text-blue-500' : 'fa-plug text-emerald-500'"></i>
                            <span x-text="llm.isTesting ? '测试中...' : '测试连接'"></span>
                        </button>
                        <button @click="saveProviderConfig()"
                            class="flex-[2] py-2.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold rounded-xl transition-all duration-200 text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 active:scale-[0.97]">
                            <i class="fas fa-check text-xs"></i> 保存配置
                        </button>
                    </div>
                </div>
            </section>

            <!-- Decorative Divider -->
            <div class="flex items-center gap-3 py-1">
                <div class="flex-1 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>
                <div class="flex-1 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent"></div>
            </div>

            <!-- Section 2: Proxy Config -->
            <section class="space-y-4">
                <div class="flex items-center gap-2.5 mb-1">
                    <div class="w-6 h-6 rounded-lg bg-cyan-100 flex items-center justify-center">
                        <i class="fas fa-network-wired text-cyan-500 text-[10px]"></i>
                    </div>
                    <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-widest">采集网络设置</h3>
                </div>

                <div class="space-y-4">
                    <!-- Connection Type -->
                    <div class="group">
                        <label for="proxy-type" class="block text-xs font-semibold text-slate-600 mb-2 group-focus-within:text-blue-600 transition-colors">连接方式</label>
                        <div class="relative">
                            <select id="proxy-type" name="proxy-type" x-model="proxy.type"
                                class="w-full pl-4 pr-10 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 appearance-none bg-white text-sm shadow-sm transition-all duration-200 hover:border-slate-300 cursor-pointer">
                                <optgroup label="商业 API (高成功率)">
                                    <option value="scraperapi">ScraperAPI</option>
                                    <option value="zenrows">ZenRows</option>
                                    <option value="brightdata">Bright Data</option>
                                    <option value="custom_api">自定义 API</option>
                                </optgroup>
                                <optgroup label="免费代理">
                                    <option value="allorigins">AllOrigins</option>
                                    <option value="corsproxy">CORS Proxy</option>
                                </optgroup>
                                <optgroup label="直连">
                                    <option value="custom_proxy">自定义 HTTP 代理</option>
                                </optgroup>
                            </select>
                            <div class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none w-5 h-5 rounded-md bg-slate-100 flex items-center justify-center">
                                <i class="fas fa-chevron-down text-slate-400 text-[9px]"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Conditional Input -->
                    <div x-show="proxyNeedsInput"
                        x-transition:enter="transition ease-out duration-300"
                        x-transition:enter-start="opacity-0 -translate-y-2"
                        x-transition:enter-end="opacity-100 translate-y-0"
                        class="space-y-3">
                        <label for="proxy-custom-url" class="block text-xs font-semibold text-slate-600" x-text="proxyInputLabel"></label>
                        <div class="flex gap-2">
                            <div class="relative flex-1">
                                <div class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded bg-cyan-100 flex items-center justify-center">
                                    <i class="fas fa-globe text-cyan-500 text-[9px]"></i>
                                </div>
                                <input :type="proxy.showKey ? 'text' : 'password'" id="proxy-custom-url" name="proxy-custom-url" x-model="proxy.customUrl"
                                    class="w-full pl-11 pr-11 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-400 text-sm font-mono text-slate-600 shadow-sm transition-all duration-200 hover:border-slate-300 placeholder:text-slate-300"
                                    :placeholder="proxyInputPlaceholder" />
                                <button @click="proxy.showKey = !proxy.showKey"
                                    class="absolute right-2.5 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-all duration-200">
                                    <i class="fas text-xs" :class="proxy.showKey ? 'fa-eye-slash' : 'fa-eye'"></i>
                                </button>
                            </div>
                            <button @click="saveProxyConfig()"
                                class="px-5 py-2.5 bg-gradient-to-r from-slate-700 to-slate-800 hover:from-slate-800 hover:to-slate-900 text-white rounded-xl transition-all duration-200 text-sm font-semibold shadow-lg shadow-slate-500/15 whitespace-nowrap active:scale-[0.97]">
                                更新配置
                            </button>
                        </div>
                        <div class="flex items-center gap-2 px-1">
                            <div class="w-4 h-4 rounded-full bg-slate-100 flex items-center justify-center flex-shrink-0">
                                <i class="fas fa-info text-slate-400 text-[8px]"></i>
                            </div>
                            <p class="text-[11px] text-slate-400 leading-relaxed"
                                x-text="proxy.type === 'custom_api' ? '请确保 URL 包含 url= 参数' : '系统将自动托管请求头'"></p>
                        </div>
                    </div>

                    <!-- Tip Card -->
                    <div class="p-3.5 bg-gradient-to-r from-blue-50/80 to-indigo-50/50 border border-blue-100/60 rounded-2xl flex gap-3">
                        <div class="w-7 h-7 rounded-lg bg-blue-100 flex items-center justify-center flex-shrink-0 mt-0.5">
                            <i class="fas fa-lightbulb text-blue-500 text-[10px]"></i>
                        </div>
                        <p class="text-[11px] text-slate-500 leading-[1.7]">
                            商业 API 通常提供更稳定的 IP 池和验证码自动绕过功能，建议在大量采集时使用。
                        </p>
                    </div>
                </div>
            </section>

            <!-- Decorative Divider -->
            <div class="flex items-center gap-3 py-1">
                <div class="flex-1 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent"></div>
                <div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>
                <div class="flex-1 h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent"></div>
            </div>

            <!-- Section 3: Performance Monitor -->
            <section class="space-y-4">
                <div class="flex items-center gap-2.5 mb-1">
                    <div class="w-6 h-6 rounded-lg bg-emerald-100 flex items-center justify-center">
                        <i class="fas fa-chart-line text-emerald-500 text-[10px]"></i>
                    </div>
                    <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-widest">性能监控</h3>
                </div>

                <div class="space-y-4">
                    <!-- Monitor Panel Button -->
                    <button @click="openPerformanceMonitor()"
                        class="w-full p-4 bg-gradient-to-br from-emerald-50 to-teal-50/30 hover:from-emerald-100 hover:to-teal-100/50 border border-emerald-200/60 hover:border-emerald-300 rounded-2xl transition-all duration-200 shadow-sm hover:shadow-md group">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-600 flex items-center justify-center shadow-lg shadow-emerald-500/25 group-hover:shadow-emerald-500/40 transition-all duration-200">
                                <i class="fas fa-tachometer-alt text-white text-base"></i>
                            </div>
                            <div class="flex-1 text-left">
                                <h4 class="text-sm font-bold text-slate-700 mb-0.5">打开监控面板</h4>
                                <p class="text-[11px] text-slate-500">查看性能指标、错误追踪和用户行为分析</p>
                            </div>
                            <div class="w-7 h-7 rounded-lg bg-white/80 flex items-center justify-center group-hover:bg-white transition-all duration-200">
                                <i class="fas fa-arrow-right text-emerald-500 text-xs group-hover:translate-x-0.5 transition-transform duration-200"></i>
                            </div>
                        </div>
                    </button>

                    <!-- Info Card -->
                    <div class="p-3.5 bg-gradient-to-r from-slate-50/80 to-emerald-50/30 border border-slate-100/60 rounded-2xl">
                        <div class="flex gap-3">
                            <div class="w-7 h-7 rounded-lg bg-slate-100 flex items-center justify-center flex-shrink-0 mt-0.5">
                                <i class="fas fa-info-circle text-slate-400 text-[10px]"></i>
                            </div>
                            <div class="flex-1">
                                <p class="text-[11px] text-slate-500 leading-[1.7] mb-2">
                                    监控面板提供实时性能数据、错误统计和用户行为分析,帮助您了解应用运行状态。
                                </p>
                                <div class="flex flex-wrap gap-1.5">
                                    <span class="inline-flex items-center gap-1 px-2 py-1 bg-white/80 rounded-md text-[10px] font-medium text-slate-600">
                                        <i class="fas fa-bolt text-amber-500"></i> Web Vitals
                                    </span>
                                    <span class="inline-flex items-center gap-1 px-2 py-1 bg-white/80 rounded-md text-[10px] font-medium text-slate-600">
                                        <i class="fas fa-bug text-red-500"></i> 错误追踪
                                    </span>
                                    <span class="inline-flex items-center gap-1 px-2 py-1 bg-white/80 rounded-md text-[10px] font-medium text-slate-600">
                                        <i class="fas fa-users text-blue-500"></i> 用户分析
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Bottom spacer for comfortable scrolling -->
            <div class="h-2"></div>
        </div>

        <!-- Footer -->
        <div class="px-5 py-3.5 bg-white/80 backdrop-blur-sm border-t border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <span class="text-[11px] text-slate-400 font-medium">系统正常运行</span>
            </div>
            <span class="text-[11px] text-slate-300 font-mono">AihangSOP v1.0.0</span>
        </div>
    </div>
</div>
